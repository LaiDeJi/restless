# Calendar cadence: a per-date change leaves the next date's code, the picker
# resets on the scheduled session, a skip hides the plan and unskip restores it,
# a new round on a future rest day re-phases the codes, and a past date and a
# past record offer no round. The calendar projects one session every rest gap
# plus one days from its anchor; exceptions are a dated range or one repeating
# weekday; a new round is offered only today or later. This is a fragment: it
# restarts the app, waits with `tool: await-ui-element` steps, and taps by
# coordinate. Same-day fragment: it assumes the calendar has no exceptions,
# starts its week on Sunday, and SESSIONS holds the neutral seed. Its setup adds
# two more sessions, so the rotation is Session 1, New session, New session 2.
executionPrerequisite: "Restless is installed with the neutral seed; the calendar starts its week on Sunday and has no exceptions."
steps:
  - tool: restart-app
    args:
      bundleId: com.whc.restless
  - tool: open-url
    args:
      url: restless://restart
  - wait: 800
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: START SESSION
      timeoutMs: 8000
  - wait: 800
  # The seed holds Session 1. Build the two sessions the rotation needs: a copy
  # of the schedule plus the library movement, saved under its default name.
  - tap:
      x: 0.5
      y: 0.941
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: WORKOUTS
      timeoutMs: 6000
  - tap:
      x: 0.89
      y: 0.125
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: USE THIS SESSION
      timeoutMs: 6000
  - tap:
      x: 0.4
      y: 0.412
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: ADD FROM LIBRARY
      timeoutMs: 6000
  - tap:
      x: 0.5
      y: 0.701
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 1 MOVEMENT
      timeoutMs: 5000
  - tap:
      x: 0.848
      y: 0.103
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: USE THIS SESSION
      timeoutMs: 5000
  - tap:
      x: 0.848
      y: 0.103
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: New session
      timeoutMs: 6000
  - tap:
      x: 0.89
      y: 0.125
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: USE THIS SESSION
      timeoutMs: 6000
  - tap:
      x: 0.4
      y: 0.412
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: ADD FROM LIBRARY
      timeoutMs: 6000
  - tap:
      x: 0.5
      y: 0.701
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 1 MOVEMENT
      timeoutMs: 5000
  - tap:
      x: 0.848
      y: 0.103
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: USE THIS SESSION
      timeoutMs: 5000
  - tap:
      x: 0.848
      y: 0.103
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: New session 2
      timeoutMs: 6000
  - tap:
      x: 0.717
      y: 0.941
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: UP NEXT
      timeoutMs: 8000
  - wait: 800
  # Normalize the gap to 0: the stepper clamps at zero.
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - tap: { x: 0.677, y: 0.8285 }
  - wait: 500
  # A round on today clears skips, changes and the old anchor.
  - tap:
      x: 0.6295
      y: 0.3965
  - wait: 700
  # Today may be planned or may sit before a future anchor. The NO RECORD sheet
  # puts NEW ROUND at 0.697; the planned sheet puts it at 0.829. Tap both: the
  # one that is not a button is inert, the other makes today slot 0.
  - tap:
      x: 0.50
      y: 0.697
  - wait: 700
  - tap:
      x: 0.795
      y: 0.829
  - wait: 700
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  # Tomorrow is New session. Change it to Session 1: the day after stays New session 2.
  - tap:
      x: 0.7575
      y: 0.3965
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: CHANGE
      timeoutMs: 6000
  - wait: 500
  - tap:
      x: 0.20
      y: 0.829
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: CHANGE EXERCISE
      timeoutMs: 6000
  - wait: 500
  - tap:
      x: 0.50
      y: 0.595
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: CHANGED
      timeoutMs: 5000
  - wait: 500
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 14, New session 2 planned
      timeoutMs: 6000
  - wait: 500
  # Picking the scheduled New session resets the change.
  - tap:
      x: 0.7575
      y: 0.3965
  - wait: 500
  - tap:
      x: 0.20
      y: 0.829
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: SCHEDULED
      timeoutMs: 5000
  - tap:
      x: 0.50
      y: 0.656
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: CHANGED
      timeoutMs: 5000
  - wait: 500
  # Skip New session; the next date keeps New session 2. Unskip restores New session.
  - tap:
      x: 0.50
      y: 0.829
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: SKIPPED
      timeoutMs: 5000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: UNSKIP
      timeoutMs: 5000
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 13, session skipped
      timeoutMs: 6000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 14, New session 2 planned
      timeoutMs: 6000
  - wait: 500
  - tap:
      x: 0.7575
      y: 0.3965
  - wait: 500
  - tap:
      x: 0.28
      y: 0.771
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: START
      timeoutMs: 5000
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 13, New session planned
      timeoutMs: 6000
  - wait: 500
  # A gap of one makes tomorrow a rest day; a round there makes it session 1.
  - tap:
      x: 0.851
      y: 0.8285
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 13, rest day
      timeoutMs: 6000
  - wait: 500
  - tap:
      x: 0.7575
      y: 0.3965
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: REST DAY
      timeoutMs: 5000
  - wait: 500
  - tap:
      x: 0.50
      y: 0.751
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: START
      timeoutMs: 5000
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 13, Session 1 planned
      timeoutMs: 6000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 14, rest day
      timeoutMs: 6000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: November 15, New session planned
      timeoutMs: 6000
  - wait: 500
  # A past date offers no round, and a past record stays read-only.
  - tap:
      x: 0.3715
      y: 0.3965
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: NO RECORD
      timeoutMs: 5000
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: NEW ROUND
      timeoutMs: 3000
  - tap:
      x: 0.50
      y: 0.30
  - wait: 600
  - wait: 500
  - tap:
      x: 0.4995
      y: 0.3965
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: RECORDED
      timeoutMs: 5000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: STARTED
      timeoutMs: 5000
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: START
        role: button
      timeoutMs: 3000
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: CHANGE
      textMatch: equals
      timeoutMs: 3000
