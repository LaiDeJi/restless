        (workRest ? (workRest.dur > 0 ? "Set done · " + fmt(workRest.dur) : "Set done") : "Finish session") +
      '</button>';
    }
    if (group === "rest") {
      return '<button class="primary" data-act="primary">' +
        (state.status === "paused" ? "Resume" : "Pause") +
      '</button><button class="ghost" data-act="skip">Skip</button>';
    }
    return '<button class="primary" data-act="primary">Again</button>';
  }
  function syncIsland(force) {
    var group = groupOf();
    var session = activeSession();
    var p = currentPos();
    var accent = accentKind();
    if (!p) return;

    var gate = group === "gate";
    islandEl.classList.toggle("dormant", gate);
    if (gate) {
      ui.expanded = false;
      islandEl.classList.remove("expanded");
      screenEl.classList.remove("island-open");
      islandEl.style.width = "126px";
      islandEl.style.height = "37px";
      islandEl.style.borderRadius = "22px";
      islandEl.style.setProperty("--phase", PHASE_COLORS.set);
      return;
    }

    islandEl.classList.toggle("expanded", ui.expanded);
    screenEl.classList.toggle("island-open", ui.expanded);
    islandEl.style.setProperty("--phase", PHASE_COLORS[accent] || PHASE_COLORS.set);

    var compactW = group === "ready" ? 200 : group === "done" ? 190 : 214;
    islandEl.style.width = (ui.expanded ? 380 : compactW) + "px";
    islandEl.style.height = (ui.expanded ? 186 : 37) + "px";
    islandEl.style.borderRadius = (ui.expanded ? 44 : 22) + "px";

    setText($("[data-el='icLabel']", islandEl), compactLabel(group, p));
    setText($("[data-el='icTime']", islandEl), compactTime(group));

    var iePhase, ieSub, ieTime, ieNext, progress = 0, small = false;
    var total = sessionTotals(session).sets;
    var positionText = positionLabel(p.block, p);

    if (group === "ready") {
      var rest = upcomingRest();
      if (rest) {
        if (rest.dur <= 0) {
          iePhase = "NO REST";
          ieTime = "NEXT";
          ieNext = movementName(p.movement).toUpperCase() + (positionText ? " · " + positionText : "");
          small = true;
        } else {
          iePhase = restKindLabel(rest.kind);
          ieTime = fmt(rest.dur);
          ieNext = movementName(p.movement).toUpperCase() + (positionText ? " · " + positionText : "");
        }
      } else {
        iePhase = "LAST SET";
        ieTime = "FINISH";
        ieNext = movementName(p.movement).toUpperCase() + " · NO REST AFTER";
        small = true;
      }
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
    } else if (group === "work") {
      iePhase = "WORK";
      ieTime = fmt(remainingSetNow());
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
      var workRest = upcomingRest();
      ieNext = workRest ? (workRest.dur > 0 ? "REST " + fmt(workRest.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
      progress = setProgress();
    } else if (group === "rest") {
      iePhase = state.status === "paused" ? "PAUSED" : restKindLabel(state.restKind);
      ieTime = fmt(remainingNow());
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
      ieNext = state.rest ? state.rest.label : "";
      progress = restProgress();
    } else {
      iePhase = "DONE";
      ieSub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " + plural(sessionTotals(session).movements, "MOVEMENT", "MOVEMENTS");
      ieTime = "DONE";
      ieNext = plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      progress = 1;
      small = true;
    }

    setText($("[data-el='iePhase']", islandEl), iePhase);
    setText($("[data-el='ieSub']", islandEl), ieSub);
    var ieTimeEl = $("[data-el='ieTime']", islandEl);
    setText(ieTimeEl, ieTime);
    if (ieTimeEl) ieTimeEl.classList.toggle("small", small);
    setText($("[data-el='ieNext']", islandEl), ieNext);
    $("[data-el='ieBar']", islandEl).style.width = (progress * 100) + "%";

    var sig = activeSessionId + "|" + group + "|" + state.status + "|" + state.doneSets + "|" +
      (state.restKind || "") + "|" + session.blocks.length + "|" + p.block.id + "|" +
      p.movement.id + "|" + p.movement.endCondition + "|" + p.movement.target;
    if (force || sig !== ui.islandSig) {
      ui.islandSig = sig;
      $("[data-el='ieActions']", islandEl).innerHTML = islandActionsHTML(group, p);
    }
  }

  /* ------------------------------------------------------------------ actions */
  function handleAct(act, el) {
    switch (act) {
      case "primary": {
        if (state.status === "notStarted") {
          startSession();
        } else if (state.status === "ready") {
          var p = currentPos();
          if (p && p.movement.endCondition === "time") startSet();
          else setDone();
        } else if (state.status === "performing") {
          setDone();
        } else if (state.status === "resting") {
          pauseRest();
        } else if (state.status === "paused") {
          resumeRest();
        } else if (state.status === "done") {
          again();
        }
        break;
      }
      case "skip":
        skipRest();
        break;
      case "watch-rep":
        watchRep();
        break;
      case "watch-drop":
        watchDrop();
        break;
      case "watch-connect":
        watchConnect();
        break;
      case "tab-timer":
        flushEdit();
        ui.draft = null;
        ui.stagedBlock = null;
        ui.tab = "timer";
        ui.route = { kind: "list" };
        ui.deleteArmed = null;
        ui.editingNumber = null;
        render(false);
        break;
      case "tab-sessions":
        flushEdit();
        ui.draft = null;
        ui.stagedBlock = null;
        ui.tab = "sessions";
        ui.route = { kind: "list" };
        ui.deleteArmed = null;
        ui.editingNumber = null;
        render(false);
        break;
      case "edit-session":
        if (isLocked()) break;
        flushEdit();
        ui.stagedBlock = null;
        ui.tab = "sessions";
        ui.route = { kind: "session", id: activeSessionId };
        ui.deleteArmed = null;
        ui.editingNumber = null;
        render(false);
        break;
      case "restart": {
        if (state.doneSets <= 0 || state.status === "done" || state.status === "notStarted") break;
        if (!ui.restartArmed) {
          ui.restartArmed = true;
          ui.restartStatus = state.status;
          render(false);
          break;
        }
        again();
        break;
      }
      case "toggle-chrome": {
        var flat = document.body.classList.toggle("flat-chrome");
        el.setAttribute("aria-pressed", flat ? "false" : "true");
        el.textContent = flat ? "CHROME · FLAT" : "CHROME · LIQUID GLASS";
        break;
      }
      case "open-session":
        openSession(el.getAttribute("data-id"));
        break;
      case "add-session":
        newSession();
        break;
      case "back-list":
        if (ui.draft) ui.draft = null;
        backToList();
        break;
      case "done-session":
        if (ui.draft) {
          commitDraft();
          ui.route = { kind: "list" };
          ui.deleteArmed = null;
          ui.editingNumber = null;
          render(false);
        } else {
          backToList();
        }
        break;
      case "back-session":
        backToSession(ui.route.sessionId);
        break;
      case "done-block":
        if (ui.route.staged && !commitStagedBlock(ui.route.sessionId)) break;
        backToSession(ui.route.sessionId);
        break;
      case "back-block":
        backToBlock(ui.route.sessionId, ui.route.blockId);
        break;
      case "done-block-movement":
        backToBlock(ui.route.sessionId, ui.route.blockId);
        break;
      case "done-picker":
        commitPicker();
        break;
      case "cancel-picker":
        cancelPicker();
        break;
      case "back-library":
        backToLibrary();
        break;
      case "done-movement":
        backToLibrary();
        break;
      case "record-back":
        recordBack();
        break;
      case "use-session":
        if (ui.draft) {
          var committed = commitDraft();
          if (!committed) break;
          ui.route = { kind: "list" };
          ui.deleteArmed = null;
          ui.editingNumber = null;
          useSession(committed.id);
        } else {
          useSession(el.getAttribute("data-id"));
        }
        break;
      case "restart-session":
        restartSession();
        break;
      case "delete-session":
        deleteSession(el.getAttribute("data-id"));
        break;
      case "add-block":
        addBlock(ui.route.id);
        break;
      case "open-block":
        openBlock(ui.route.id, el.getAttribute("data-id"));
        break;
      case "move-block":
        if (ui.route.kind === "session") moveBlock(ui.route.id, el.getAttribute("data-id"), el.getAttribute("data-dir"));
        break;
      case "delete-block":
        if (ui.route.kind === "block") deleteBlock(ui.route.sessionId, el.getAttribute("data-id"));
        break;
      case "delete-block-row":
        if (ui.route.kind === "session") deleteBlock(ui.route.id, el.getAttribute("data-id"));
        break;
      case "bump-block":
        bumpBlock(el.getAttribute("data-key"), el.getAttribute("data-dir"));
        break;
      case "edit-number":
        startEditNumber(el.getAttribute("data-key"));
        break;
      case "open-block-movement":
        openBlockMovement(ui.route.sessionId, ui.route.blockId, el.getAttribute("data-id"));
        break;
      case "move-block-movement":
        moveBlockMovement(ui.route.sessionId, ui.route.blockId, el.getAttribute("data-id"), el.getAttribute("data-dir"));
        break;
      case "delete-block-movement":
        removeBlockMovement(ui.route.sessionId, ui.route.blockId, el.getAttribute("data-id"));
        break;
      case "delete-block-movement-row":
        if (ui.route.kind === "block") removeBlockMovement(ui.route.sessionId, ui.route.blockId, el.getAttribute("data-id"));
        break;
      case "picker-condition":
        ui.picker.condition = el.getAttribute("data-value");
        if (ui.picker.condition === "manual") ui.picker.target = null;
        else if (ui.picker.condition === "time") ui.picker.target = safeTime(ui.picker.target, 60);
        else ui.picker.target = Math.max(1, safeCount(ui.picker.target, 10));
        render(false);
        break;
      case "picker-target":
        var pickDir = Number(el.getAttribute("data-dir"));
        if (ui.picker.condition === "time") {
          ui.picker.target = clamp((ui.picker.target || 15) + pickDir * 15, LIMITS.time[0], LIMITS.time[1]);
        } else {
          ui.picker.target = Math.max(1, (ui.picker.target || 1) + pickDir);
        }
        render(false);
        break;
      case "bm-condition":
        setBlockMovementCondition(ui.route.movementId, el.getAttribute("data-value"));
        break;
      case "bump-bm-target":
        bumpBlockMovementTarget(ui.route.movementId, el.getAttribute("data-dir"));
        break;
      case "bm-default":
        useBlockMovementDefault(ui.route.movementId);
        break;
      case "open-picker":
        openPicker(ui.route.sessionId, ui.route.blockId);
        break;
      case "add-from-library":
        addFromLibrary(el.getAttribute("data-id"));
        break;
      case "toggle-block-movement":
        queueMovementToBlock(el.getAttribute("data-id"));
        break;
      case "add-new-movement":
        queueNewMovementToBlock();
        break;
      case "remove-pending":
        removePendingPicker(el.getAttribute("data-id"));
        break;
      case "open-library":
        openLibrary();
        break;
      case "open-movement":
        openMovement(el.getAttribute("data-id"));
        break;
      case "record-new":
        startRecord(null);
        break;
      case "re-record":
        startRecord(ui.route.id);
        break;
      case "start-recording":
        startRecordingNow();
        break;
      case "simulate-trace":
        simulateTrace(5);
        break;
      case "simulate-short":
        simulateTrace(2);
        break;
      case "simulate-timeout":
        failRecording("NO TRACE ARRIVED");
        break;
      case "simulate-nomotion":
        failRecording("NO MOTION DETECTED");
        break;
      case "retry-record":
        retryRecording();
        break;
      case "save-record":
        saveRecordedMovement();
        break;
      case "discard-record":
        discardRecording();
        break;
      case "record-group":
        setRecordGroup(el.getAttribute("data-group"));
        break;
      case "record-condition":
        setRecordCondition(el.getAttribute("data-value"));
        break;
      case "record-target":
        bumpRecordTarget(el.getAttribute("data-dir"));
        break;
      case "movement-group":
        setMovementGroup(ui.route.id, el.getAttribute("data-group"));
        break;
      case "movement-condition":
        setMovementCondition(ui.route.id, el.getAttribute("data-value"));
        break;
      case "bump-movement-target":
        bumpMovementDefaultTarget(ui.route.id, el.getAttribute("data-dir"));
        break;
      case "delete-movement":
        deleteMovement(ui.route.id);
        break;
    }
  }

  /* ------------------------------------------------------------------ events */
  var holdDelay = 0;
  var holdRepeat = 0;
  var holdButton = null;
  var holdFired = false;
  var suppressStepClick = false;

  function liveStepButton(source) {
    if (!source) return null;
    var selector = '[data-act="' + source.getAttribute("data-act") + '"]';
    var key = source.getAttribute("data-key");
    var dir = source.getAttribute("data-dir");
    if (key != null) selector += '[data-key="' + key + '"]';
    if (dir != null) selector += '[data-dir="' + dir + '"]';
    return appEl.querySelector(selector);
  }
  function stopStepHold() {
    if (holdDelay) {
      clearTimeout(holdDelay);
      holdDelay = 0;
    }
    if (holdRepeat) {
      clearInterval(holdRepeat);
      holdRepeat = 0;
    }
    if (holdFired) suppressStepClick = true;
    holdButton = null;
    holdFired = false;
  }
  function repeatStep() {
    if (!holdButton) {
      stopStepHold();
      return;
    }
    if (isLocked()) {
      stopStepHold();
      return;
    }
    var live = liveStepButton(holdButton);
    if (!live || live.disabled) {
      stopStepHold();
      return;
    }
    holdFired = true;
    handleAct(live.getAttribute("data-act"), live);
  }
  function startStepHold(source) {
    stopStepHold();
    if (!source || source.disabled || isLocked()) return;
    suppressStepClick = false;
    holdButton = source;
    holdFired = false;
    holdDelay = setTimeout(function () {
      holdDelay = 0;
      repeatStep();
      if (!holdButton) return;
      holdRepeat = setInterval(repeatStep, 100);
    }, 500);
  }

  appEl.addEventListener("pointerdown", function (e) {
    var button = e.target.closest ? e.target.closest(".sstep button") : null;
    if (!button) return;
    if (e.button !== undefined && e.button > 0) return;
    startStepHold(button);
  });
  document.addEventListener("pointerup", stopStepHold);
  document.addEventListener("pointercancel", stopStepHold);
  window.addEventListener("blur", stopStepHold);

  document.addEventListener("click", function (e) {
    var inIsland = !!(e.target.closest && e.target.closest("#island"));
    var actEl = e.target.closest ? e.target.closest("[data-act]") : null;
    if (actEl) {
      if (suppressStepClick && actEl.closest(".sstep")) {
        suppressStepClick = false;
        return;
      }
      suppressStepClick = false;
      var act = actEl.getAttribute("data-act");
      var switched = inIsland && ui.tab === "sessions" && (act === "primary" || act === "skip");
      if (switched) {
        flushEdit();
        ui.tab = "timer";
        ui.route = { kind: "list" };
        ui.deleteArmed = null;
        ui.editingNumber = null;
      }
      handleAct(act, actEl);
      if (switched) render(false);
      if (!inIsland && ui.expanded) {
        ui.expanded = false;
        syncIsland(true);
      }
      return;
    }
    if (!inIsland && ui.expanded) {
      ui.expanded = false;
      syncIsland(true);
    }
  });

  var dragState = null;
  var dragGhost = null;
  function clearDrag() {
    dragState = null;
    if (dragGhost && dragGhost.parentNode) dragGhost.parentNode.removeChild(dragGhost);
    dragGhost = null;
    $$(".block-row.dragging, .block-row.drop-target", appEl).forEach(function (row) {
      row.classList.remove("dragging");
      row.classList.remove("drop-target");
    });
  }
  function moveDragGhost(e) {
    if (!dragGhost) return;
    var x = e.clientX;
    var y = e.clientY;
    if (!x && !y) return;
    dragGhost.style.left = (x + 14) + "px";
    dragGhost.style.top = (y - 34) + "px";
  }
  appEl.addEventListener("dragstart", function (e) {
    var handle = e.target.closest ? e.target.closest("[data-drag-handle]") : null;
    if (!handle || isLocked()) {
      e.preventDefault();
      return;
    }
    var row = handle.closest("[data-drag-row]");
    if (!row) return;
    dragState = { kind: row.getAttribute("data-drag-row"), id: row.getAttribute("data-id") };
    row.classList.add("dragging");
    var card = row.querySelector(".block-open");
    if (card) {
      var rect = card.getBoundingClientRect();
      dragGhost = card.cloneNode(true);
      dragGhost.classList.add("drag-ghost");
      dragGhost.removeAttribute("data-act");
      dragGhost.style.width = rect.width + "px";
      dragGhost.style.left = ((e.clientX || rect.left) + 14) + "px";
      dragGhost.style.top = ((e.clientY || rect.top) - 34) + "px";
      document.body.appendChild(dragGhost);
    }
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragState.id);
      var blank = new Image();
      blank.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      e.dataTransfer.setDragImage(blank, 0, 0);
    }
  });
  appEl.addEventListener("drag", moveDragGhost);
  appEl.addEventListener("dragover", function (e) {
    moveDragGhost(e);
    if (!dragState) return;
    var row = e.target.closest ? e.target.closest("[data-drag-row]") : null;
    if (!row || row.getAttribute("data-drag-row") !== dragState.kind) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    $$(".block-row.drop-target", appEl).forEach(function (other) { other.classList.remove("drop-target"); });
    row.classList.add("drop-target");
  });
  appEl.addEventListener("drop", function (e) {
    if (!dragState) return;
    e.preventDefault();
    var row = e.target.closest ? e.target.closest("[data-drag-row]") : null;
    var state = dragState;
    clearDrag();
    if (row && row.getAttribute("data-drag-row") === state.kind) {
      reorderRow(state.kind, state.id, row.getAttribute("data-id"));
    }
  });
  appEl.addEventListener("dragend", clearDrag);

  islandEl.addEventListener("click", function (e) {
    if (e.target.closest("[data-act]")) return;
    if (groupOf() === "gate") return;
    e.stopPropagation();
    ui.expanded = !ui.expanded;
    syncIsland(true);
  });
  islandEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (groupOf() === "gate") return;
      ui.expanded = !ui.expanded;
      syncIsland(true);
    }
  });

  appEl.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="sessionName"]') && ui.route.kind === "session") {
      var session = findSession(ui.route.id);
      if (session) {
        session.name = liveName(t.value);
        markEdited(session);
      }
    } else if (t.matches('[data-el="blockName"]') && ui.route.kind === "block") {
      var blockSession = findSession(ui.route.sessionId);
      var block = routeBlock(ui.route);
      if (block) {
        block.name = liveName(t.value);
        if (!ui.route.staged) markEdited(blockSession);
      }
    } else if (t.matches('[data-el="movementName"]') && ui.route.kind === "movement") {
      var movement = findMovement(ui.route.id);
      if (movement) {
        movement.name = liveName(t.value);
        markEdited(null);
      }
    } else if (t.matches('[data-el="recordName"]') && ui.record) {
      ui.record.draft.name = liveName(t.value);
    } else if (t.matches('[data-el="pickerName"]') && ui.route.kind === "picker") {
      if (!ui.picker) ui.picker = pickerDefault();
      ui.picker.name = liveName(t.value);
      var addButton = $('[data-act="add-new-movement"]', appEl);
      if (addButton) addButton.disabled = !ui.picker.name.trim();
    } else if (t.matches('[data-el="numberInput"]')) {
      ui.numberDraft = t.value;
    }
  });

  appEl.addEventListener("focusout", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="sessionName"]')) {
      commitSessionName(t);
    } else if (t.matches('[data-el="blockName"]')) {
      commitBlockName(t);
    } else if (t.matches('[data-el="movementName"]')) {
      commitMovementName(t);
    } else if (t.matches('[data-el="recordName"]')) {
      commitRecordName(t);
    } else if (t.matches('[data-el="pickerName"]') && ui.picker) {
      ui.picker.name = trimName(t.value, "");
      if (t.value !== ui.picker.name) t.value = ui.picker.name;
      var addButton = $('[data-act="add-new-movement"]', appEl);
      if (addButton) addButton.disabled = !ui.picker.name;
    } else if (t.matches('[data-el="numberInput"]')) {
      commitNumberInput(t, false);
    }
  });

  appEl.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="pickerName"]') && e.key === "Enter") {
      e.preventDefault();
      queueNewMovementToBlock();
      return;
    }
    if ((t.matches('[data-el="sessionName"]') || t.matches('[data-el="blockName"]') ||
         t.matches('[data-el="movementName"]') || t.matches('[data-el="recordName"]')) && e.key === "Enter") {
      e.preventDefault();
      t.blur();
      return;
    }
    if (t.matches('[data-el="numberInput"]')) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        commitNumberInput(t, true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        var target = resolveEditTarget(ui.editingNumber ? ui.editingNumber.key : "");
        if (target && ui.editingNumber) t.value = String(target.value == null ? "" : target.value);
        ui.editingNumber = null;
        t.blur();
      }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (ui.expanded) {
        ui.expanded = false;
        syncIsland(true);
        return;
      }
      if (ui.tab === "sessions") {
        if (ui.route.kind === "record") recordBack();
        else if (ui.route.kind === "movement") backToLibrary();
        else if (ui.route.kind === "library") backToList();
        else if (ui.route.kind === "picker") cancelPicker();
        else if (ui.route.kind === "blockMovement") backToBlock(ui.route.sessionId, ui.route.blockId);
        else if (ui.route.kind === "block") backToSession(ui.route.sessionId);
        else if (ui.route.kind === "session") backToList();
        else {
          flushEdit();
          ui.tab = "timer";
          render(false);
        }
      }
    }
    if (e.key === " ") {
      var t = e.target;
      if (t && t.closest && t.closest("button, input, textarea")) return;
      if (ui.tab !== "timer") return;
      if (state.status === "resting" || state.status === "paused") {
        e.preventDefault();
        state.status === "resting" ? pauseRest() : resumeRest();
      }
    }
  });

  window.addEventListener("beforeunload", function () {
    commitEdit();
  });

  /* ------------------------------------------------------------------ timer */
  var frame = function (now) {
    if (state.status === "resting") {
      var rem = (state.deadline - now) / 1000;
      if (rem <= 0) finishRest(true);
    } else if (state.status === "performing") {
      if (state.setDeadline - now <= 0) setDone();
    }
    sync();
    requestAnimationFrame(frame);
  };

  /* ------------------------------------------------------------------ fit + boot */
  function fit() {
    var availH = window.innerHeight - 126;
    var availW = window.innerWidth - 28;
    var s = Math.min(1, availH / 880, availW / 430);
    s = Math.max(0.5, s);
    frameEl.style.transform = "scale(" + s + ")";
    stageEl.style.height = (880 * s) + "px";
    stageEl.style.width = (430 * s) + "px";
  }
  window.addEventListener("resize", fit);

  function boot() {
    resetSession();
    render(false);
    fit();
    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
</html>
