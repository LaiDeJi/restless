<head>
<meta charset="utf-8" />

<title>Restless — session rest timer</title>
<!--
  PROTOTYPE — a session rest timer built around the Dynamic Island.

  Model:
    A session is an ordered list of blocks. A block holds movements from the
    reusable library, a number of rounds, a number of sets per round, a set
    rest, and a round rest. Every set ends on one of two conditions: a timed
    hold on the phone or a manual tap.

    Each movement runs all of its rounds before the next movement starts: a
    block with two movements and three rounds runs the first movement's three
    rounds, then the second's. A set rest separates only the sets inside a
    round; a round rest follows every round boundary, every movement switch,
    and every block transition. A block with one movement is that movement
    repeated. A sequential pair is two blocks.

    A timed set runs a work countdown in the performing phase, then starts the
    same rest as any other set. The final set of the final block has no rest.

  The key interaction: tap the Dynamic Island → Set done. That starts the right rest
  without reopening the app. The phone screen is the detailed view of the same state.

  Navigation: TIMER, SESSIONS and CALENDAR bottom tabs. SESSIONS lists saved sessions and the
  MOVEMENTS library. A session opens its ordered blocks; a block edits its rounds,
  sets per round, rests, and movements. A movement opens its end condition and target.
  CALENDAR projects the SESSIONS order onto a fixed cadence: one session every rest
  gap plus one days from the anchor, taking the next session in order at each slot.
  A dated range or a repeating weekday closes a date: it keeps its slot but plans no
  session, so that session is skipped for the lap. A skipped date hides its plan and
  offers no START; a date can use another session for that date only. A reorder and a
  new round both move the anchor; a past day, a record and a run in progress keep
  their record. A month cell shows a recorded session with a filled set bar, a planned
  one with a hollow bar, REST, CLOSED or SKIP, and a ring for today. A day opens a
  sheet: a planned day offers START, CHANGE, SKIP and NEW ROUND, a recorded day is
  read-only with a two-tap delete and NEW ROUND, a skipped day offers UNSKIP, a rest
  day offers NEW ROUND, and a closed day offers no action. REST DAYS carries an inline
  0–6 stepper and EXCEPTIONS opens its editor; the demo grid keeps a fixed Monday
  start. Values persist in localStorage. Rounds and sets
  per round are unbounded; rests stay 15–600 seconds in 15s steps, except a block's set
  rest may be 0.

  The add-movement picker can also create a library movement from a typed name: it
  is appended with the selected set end and target, and is reused when a matching
  name already exists. Dragging a block or movement by its grip floats an opaque card
  under the pointer while the source slot dims and the row under the pointer is
  outlined.

  The timer's ↺ restart opens a confirmation dialog that names the lost sets, the
  cancelled rest, and the return to block 1; it appears once a set is done and stays
  available through a set or rest. Confirming returns to the start gate, so no Live
  Activity stays behind. The block editor appends an unused library
  movement in one tap under ADD FROM LIBRARY. SESSIONS cards reorder by their grip
  and keep the ACTIVE badge on their own card. When a rest reaches zero the
  prototype shows a simulated local-notification card with the words the app
  uses; the island stays compact and the page stays silent. The footer toggle
  previews the iOS 26 Liquid Glass chrome and the flat iOS 18–25 fallback on
  EDIT, restart, and the SESSIONS add control. Session, block, and movement
  names cap at 40 characters.

  Not production code. Double-click to open.
-->
<style>
  :root { --danger: #FF5C4D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  button:focus, button:focus-visible { outline: none; }

  body {
    background: radial-gradient(120% 70% at 50% -12%, #1d1d23 0%, #0c0c0f 48%, #070708 100%);
    color: #ececef;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------------------------------------------------------------- page chrome */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 26px;
  }
  .page-head {
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 10px;
    letter-spacing: .16em;
    font-weight: 600;
    color: rgba(255,255,255,.42);
    text-transform: uppercase;
    padding: 0 2px;
    flex: 0 0 auto;
  }
  .ph-left { display: flex; align-items: center; gap: 9px; }
  .ph-mark {
    width: 6px; height: 6px; border-radius: 50%;
    background: #C8FF4D;
    box-shadow: 0 0 10px rgba(200,255,77,.7);
  }
  .ph-left em {
    font-style: normal;
    color: rgba(255,255,255,.26);
    letter-spacing: .12em;
  }
  .ph-right {
    color: rgba(255,255,255,.3);
    letter-spacing: .08em;
    text-transform: none;
    font-weight: 500;
  }

  .stage {
    position: relative;
    flex: 0 0 auto;
    margin: auto 0 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .phone-frame { width: 430px; height: 880px; transform-origin: top center; }

  /* ---------------------------------------------------------------- phone hardware */
  .phone {
    position: relative;
    width: 430px;
    height: 880px;
    padding: 14px;
    border-radius: 72px;
    background:
      linear-gradient(148deg, #5a5a60 0%, #1b1b1f 22%, #26262b 46%, #101013 72%, #3b3b41 100%);
    box-shadow:
      0 70px 110px -40px rgba(0,0,0,.95),
      0 20px 40px -20px rgba(0,0,0,.8),
      0 0 0 1px rgba(255,255,255,.10),
      inset 0 0 0 2px rgba(255,255,255,.06),
      inset 0 1px 1px rgba(255,255,255,.25);
    user-select: none;
    -webkit-user-select: none;
  }
  .side-btn {
    position: absolute;
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #1a1a1d, #3a3a3f 55%, #141416);
    box-shadow: 0 0 0 .5px rgba(255,255,255,.08);
  }
  .side-btn.vol-up   { left: -3px; top: 176px; height: 58px; }
  .side-btn.vol-down { left: -3px; top: 246px; height: 58px; }
  .side-btn.mute     { left: -3px; top: 118px; height: 32px; }
  .side-btn.power    { right: -3px; top: 200px; height: 92px; }

  .screen {
    position: relative;
    width: 402px;
    height: 852px;
    border-radius: 58px;
    overflow: hidden;
    background: #070708;
    isolation: isolate;
  }
  .app { position: absolute; inset: 0; z-index: 10; }

  /* status bar */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 56px;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    color: #fff;
    pointer-events: none;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .01em;
    transition: opacity .18s ease;
  }
  .screen.island-open .statusbar { opacity: 0; }
  .sb-icons { display: flex; align-items: center; gap: 6px; margin-top: -2px; }
  .sb-icons svg { display: block; }

  .home-indicator {
    position: absolute;
    bottom: 9px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 5px;
    border-radius: 4px;
    background: rgba(255,255,255,.88);
    z-index: 35;
    pointer-events: none;
  }

  /* ---------------------------------------------------------------- dynamic island */
  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 37px;
    border-radius: 22px;
    background: #000;
    border: 1px solid rgba(255,255,255,.06);
    z-index: 50;
    overflow: hidden;
    cursor: pointer;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    box-shadow:
      0 3px 12px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,255,255,.02);
    transition:
      width .52s cubic-bezier(.32,.72,0,1),
      height .52s cubic-bezier(.32,.72,0,1),
      border-radius .42s cubic-bezier(.32,.72,0,1);
    --phase: #C8FF4D;
  }
  #island:focus, #island:focus-visible { outline: none !important; }
  .island.dormant { cursor: default; }
  .island.dormant .ic,
  .island.dormant .ie { opacity: 0; }

  .ic {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    opacity: 1;
    transition: opacity .18s ease;
  }
  .island.expanded .ic { opacity: 0; pointer-events: none; transition-duration: .08s; }
  .ic-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ic-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--phase);
    box-shadow: 0 0 7px color-mix(in srgb, var(--phase) 60%, transparent);
    flex: 0 0 auto;
  }
  .ic-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .13em;
    white-space: nowrap;
  }
  .ic-time {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .ie {
    position: absolute;
    inset: 0;
    padding: 15px 20px 16px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .16s ease, visibility 0s linear .2s;
    color: #fff;
  }
  .island.expanded .ie {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .24s ease .1s, visibility 0s;
  }
  .ie-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ie-phase { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .16em; white-space: nowrap; }
  .ie-phase i { width: 7px; height: 7px; border-radius: 50%; background: var(--phase); box-shadow: 0 0 7px color-mix(in srgb, var(--phase) 55%, transparent); flex: 0 0 auto; }
  .ie-sub {
    font-size: 11px;
    letter-spacing: .07em;
    color: rgba(255,255,255,.44);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ie-time {
    font-size: 50px;
    font-weight: 600;
    letter-spacing: -.05em;
    line-height: 1;
    margin-top: 9px;
    font-variant-numeric: tabular-nums;
  }
  .ie-time.small { font-size: 34px; letter-spacing: .01em; }
  .ie-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); margin-top: 10px; overflow: hidden; }
  .ie-bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--phase); }
  .ie-next { margin-top: 9px; font-size: 11px; letter-spacing: .1em; color: rgba(255,255,255,.44); white-space: nowrap; }
  .ie-actions { display: flex; gap: 8px; margin-top: auto; }
  .ie-actions button {
    flex: 1;
    height: 34px;
    border-radius: 17px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    white-space: nowrap;
  }
  .ie-actions .primary { background: #fff; color: #000; }
  .ie-actions .primary:active { background: rgba(255,255,255,.85); }
  .ie-actions .ghost { background: rgba(255,255,255,.13); color: #fff; }
  .ie-actions .ghost:active { background: rgba(255,255,255,.22); }
  .island.pulse { animation: islandPulse .42s ease; }
  @keyframes islandPulse {
    0% { transform: translateX(-50%) scale(1); }
    38% { transform: translateX(-50%) scale(1.035); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* ---------------------------------------------------------------- confirmation dialog */
  .confirm-backdrop {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,.58);
    animation: fadeIn .18s ease both;
  }
  .confirm {
    position: absolute;
    z-index: 41;
    left: 24px; right: 24px;
    top: 50%;
    transform: translateY(-50%);
    padding: 22px 20px 18px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.1);
    background: #17171a;
    box-shadow: 0 24px 70px rgba(0,0,0,.7);
    color: #fff;
    animation: confirmIn .22s cubic-bezier(.22,1,.28,1) both;
  }
  @keyframes confirmIn {
    from { opacity: 0; transform: translateY(-50%) scale(.96); }
    to { opacity: 1; transform: translateY(-50%) scale(1); }
  }
  .confirm-title { font-size: 19px; font-weight: 650; letter-spacing: .01em; }
  .confirm-body {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.45;
    color: rgba(255,255,255,.6);
  }
  .confirm-actions { display: flex; gap: 8px; margin-top: 20px; }
  .confirm-actions button {
    flex: 1;
    min-height: 44px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm-cancel { background: rgba(255,255,255,.1); color: #fff; }
  .confirm-cancel:active { background: rgba(255,255,255,.16); }
  .confirm-destructive { background: var(--danger); color: #fff; }
  .confirm-destructive:active { background: #e64b3d; }

  /* ---------------------------------------------------------------- completion alert */
  .alert-card {
    position: absolute;
    z-index: 39;
    top: 54px;
    left: 12px; right: 12px;
    padding: 12px 15px 13px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(26,26,30,.94);
    box-shadow: 0 14px 40px rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    animation: alertIn .32s cubic-bezier(.22,1,.28,1) both;
  }
  @keyframes alertIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .alert-app {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
    color: rgba(255,255,255,.42);
  }
  .alert-title {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #C8FF4D;
  }
  .alert-body {
    margin-top: 3px;
    font-size: 13px;
    line-height: 1.35;
    color: rgba(255,255,255,.72);
  }

  /* ---------------------------------------------------------------- done celebration */
  .celebration {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }
  .confetti {
    position: absolute;
    top: 30%;
    width: 7px;
    height: 12px;
    border-radius: 2px;
    opacity: 0;
    animation: confettiFall 2.5s cubic-bezier(.2,.6,.4,1) both;
  }
  @keyframes confettiFall {
    0% { opacity: 0; transform: translate(0,-14px) rotate(0deg); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--drift), 58vh) rotate(var(--spin)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; }
    .celebration::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 38%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(200,255,77,.24) 0%, rgba(255,184,77,.10) 45%, transparent 68%);
      animation: celebrationGlow 2.5s ease-out both;
    }
    @keyframes celebrationGlow {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: 0; }
    }
  }

  /* ---------------------------------------------------------------- rest timer screen */
  .app-screen {
    --accent: #C8FF4D;
    --glow: rgba(200,255,77,.26);
    --glow-soft: rgba(200,255,77,.07);
    position: relative;
    height: 100%;
    padding: 64px 22px 92px;
    display: flex;
    flex-direction: column;
    background: #070708;
    color: #fff;
    overflow: hidden;
    transition: background .5s ease;
  }
  .app-screen[data-phase="round"] {
    --accent: #FFB84D;
    --glow: rgba(255,184,77,.24);
    --glow-soft: rgba(255,184,77,.08);
    background: #0a0805;
  }
  .app-screen::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 160px;
    width: 420px;
    height: 420px;
    transform: translateX(-50%);
    background: radial-gradient(circle, var(--glow-soft) 0%, transparent 66%);
    pointer-events: none;
    transition: background .5s;
  }

  .app-head {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    flex: 0 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 240px;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .09em;
    color: #fff;
  }
  .brand-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 9px var(--glow);
    transition: background .4s;
    flex: 0 0 auto;
  }
  .brand-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .edit-pill {
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.035);
    color: rgba(255,255,255,.58);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .09em;
    cursor: pointer;
  }
  .edit-pill:active { background: rgba(255,255,255,.1); }
  .head-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
  }
  .restart-pill {
    width: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: rgba(255,255,255,.72);
  }
  .restart-pill svg { width: 18px; height: 18px; }
  .edit-pill.chrome-glass { color: rgba(255,255,255,.86); }
  .add-pill.chrome-glass { color: rgba(255,255,255,.86); }

  .pos {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 3px 10px;
    min-height: 24px;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .067em;
    text-align: center;
    color: rgba(255,255,255,.38);
    flex: 0 0 auto;
  }
  .pos b {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    letter-spacing: .01em;
    margin: 0 1px;
    font-variant-numeric: tabular-nums;
  }
  .pos em { font-style: normal; color: rgba(255,255,255,.26); }
  .pos-sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .pos-up {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: .067em;
    margin-right: 2px;
    transition: color .35s;
  }
  .pos-done {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: .133em;
    font-weight: 700;
  }

  .center-stack {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  /* The timer stage pins the ring's centre to its own vertical middle. The
     top chrome and the lower content are positioned against that fixed centre,
     so neither a wrapping position strip nor a taller set map moves the ring.
     Tall content makes the stage scroll. */
  .timer-screen { padding-bottom: 92px; }
  .timer-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding-top: calc(var(--stage-h, 696px) / 2 + 170px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .timer-stage::-webkit-scrollbar { display: none; }
  .timer-chrome {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
  }
  .timer-stage > .hero {
    position: absolute;
    top: calc(var(--stage-h, 696px) / 2);
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  .timer-lower {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .timer-lower .actions {
    margin-top: auto;
    width: 100%;
  }
  .hero {
    position: relative;
    width: 300px;
    height: 300px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .rt-ring {
    position: absolute;
    width: 300px;
    height: 300px;
    transform: rotate(-90deg);
  }
  .rt-track { fill: none; stroke: rgba(255,255,255,.065); stroke-width: 13; }
  .rt-prog {
    fill: none;
    stroke: var(--accent);
    stroke-width: 13;
    stroke-linecap: round;
    stroke-dasharray: 1005.31;
    stroke-dashoffset: 1005.31;
    filter: drop-shadow(0 0 9px var(--glow));
    transition: stroke .45s ease;
  }
  .rt-center { position: relative; text-align: center; z-index: 2; }
  .rt-kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .133em;
    color: var(--accent);
    transition: color .35s;
  }
  .rt-time {
    margin-top: 8px;
    font-size: 78px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.05em;
    font-variant-numeric: tabular-nums;
  }
  .rt-time.small { font-size: 52px; letter-spacing: .01em; }
  .rt-sub {
    margin-top: 12px;
    max-width: 232px;
    margin-left: auto;
    margin-right: auto;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: .03em;
    color: rgba(255,255,255,.38);

  .map-wrap { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .map {
    display: flex;

    gap: 8px 11px;
    max-width: 310px;
  }
  .map-group { display: flex; align-items: center; gap: 7px; }

  .br-index {

  .row-actions { display: flex; gap: 4px; flex: 0 0 auto; }
  .row-grip,
  .row-trash {

  /* ---------------------------------------------------------------- setup sheet */
  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.48);

  .sheet {
    position: absolute;

    background: #111113;
    border-radius: 34px 34px 0 0;
    padding: 9px 22px 28px;
    box-shadow: 0 -24px 60px rgba(0,0,0,.55);
    animation: sheetUp .4s cubic-bezier(.22,1,.28,1) both;
    color: #fff;
  }
  .sheet.no-anim { animation: none; }
  .grab {
    width: 38px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.16);
    margin: 0 auto 16px;
  }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sheet-title { flex: 1 1 auto; min-width: 0; }
  .sheet-k { font-size: 8px; font-weight: 650; letter-spacing: .18em; color: rgba(255,255,255,.4); }
  .preset-name {
    display: block;
    width: 100%;
    margin-top: 5px;

    border: none;
    border-bottom: 1px dashed rgba(255,255,255,.14);

  .preset-name::selection { background: var(--accent); color: #070708; }
  .preset-bar { display: flex; align-items: center; gap: 6px; margin-top: 13px; }
  .preset-row {

    min-width: 0;
    gap: 6px;
    padding-bottom: 2px;
    overflow-x: auto;
    scrollbar-width: none;

  .preset-row::-webkit-scrollbar { display: none; }
  .preset-chip {

    max-width: 132px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.11);
    background: transparent;
    color: rgba(255,255,255,.55);

    font-size: 8.5px;
    font-weight: 700;

  .sheet-done {

    letter-spacing: .015em;

  }

  .rows { margin-top: 10px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(102%); } to { transform: translateY(0); } }

  .screen-in { animation: screenIn .32s cubic-bezier(.22,1,.28,1) both; }
  @keyframes screenIn {

  /* ---------------------------------------------------------------- liquid glass chrome */
  /* iOS 26 draws the floating header controls with Liquid Glass. The prototype
     simulates it with a blur, a specular top edge, and a translucent fill; the
     FLAT state keeps the iOS 18–25 capsule so both can be checked. */
  .chrome-glass {
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    background: linear-gradient(148deg, rgba(255,255,255,.17), rgba(255,255,255,.045) 46%, rgba(255,255,255,.1));
    border-color: rgba(255,255,255,.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 8px 22px rgba(0,0,0,.3);
  }
  .flat-chrome .chrome-glass {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: rgba(255,255,255,.035);
    border-color: rgba(255,255,255,.12);
    box-shadow: none;
  }

<body>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ config */
  var STORAGE_KEY = "restless.sessions.v4";
  var V2_KEY = "restless.sessions.v2";
  var LEGACY_KEY = "rounds.presets.v1";

  var CAL_GAP_MAX = 6;
  var MONTH_NAMES = [
    "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",

  ];
  var MONTH_SHORT = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  var WEEKDAY_SHORT = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

  var GROUPS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Core", "Legs", "Glutes"];
  var CONDITIONS = ["time", "manual"];
  var DEFAULT_ROUNDS = 1;
  var DEFAULT_SETS_PER_ROUND = 3;
  var DEFAULT_SET_REST = 60;
  var DEFAULT_ROUND_REST = 120;
  var LIMITS = {
    setRest: [15, 600, 15],
    roundRest: [15, 600, 15],
    time: [15, 600, 15]
  };
  var MAP_LIMITS = { rounds: 12, perRound: 12, dots: 72 };
  var PHASE_COLORS = {
    set: "#C8FF4D",
    round: "#FFB84D",
    last: "#C8FF4D",
    work: "#C8FF4D",
    done: "#C8FF4D"
  };
  var ICON = {
    skip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 6.1v11.8a1 1 0 0 0 1.56.83l8.06-5.9a1 1 0 0 0 0-1.66L6.56 5.27A1 1 0 0 0 5 6.1z"/><rect x="16.6" y="4.9" width="3" height="14.2" rx="1.3"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="7" r="1.6"/><circle cx="15" cy="7" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="17" r="1.6"/><circle cx="15" cy="17" r="1.6"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M6.5 7l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/><path d="M10 11v6M14 11v6"/></svg>',
    restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6 9.6a7.6 7.6 0 1 1 1.1 7.2"/><path d="M4.3 4.7v5.2h5.2"/></svg>',
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.6 1.6M9 2.5h6"/></svg>',
    sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4.5"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></svg>'
  };

  /* ------------------------------------------------------------------ demo data */
  var DEMO_LIBRARY = [
    { id: "m-bench", name: "Bench press", group: "Chest", defaultCondition: "manual", defaultTarget: null },
    { id: "m-incline", name: "Incline press", group: "Chest", defaultCondition: "manual", defaultTarget: null },
    { id: "m-curl", name: "Curl", group: "Biceps", defaultCondition: "manual", defaultTarget: null },
    { id: "m-pushdown", name: "Pushdown", group: "Triceps", defaultCondition: "manual", defaultTarget: null },
    { id: "m-plank", name: "Plank", group: "Core", defaultCondition: "time", defaultTarget: 60 },
    { id: "m-deadhang", name: "Dead hang", group: "Back", defaultCondition: "manual", defaultTarget: null },
    { id: "m-lateral", name: "Lateral raise", group: "Shoulders", defaultCondition: "manual", defaultTarget: null }
  ];
  var DEMO_SESSIONS = [
    {
      id: "s-chest",
      name: "Chest",
      blocks: [{
        id: "b-chest",
        name: "Chest",
        rounds: 4,
        setsPerRound: 4,
        setRest: 60,
        roundRest: 120,
        movements: [
          { id: "bm-bench", movementId: "m-bench", endCondition: "manual", target: null }
        ]
      }]
    },
    {
      id: "s-arms",
      name: "Arms",
      blocks: [{
        id: "b-arms",
        name: "Arms",
        rounds: 2,
        setsPerRound: 1,
        setRest: 30,
        roundRest: 120,
        movements: [
          { id: "bm-curl", movementId: "m-curl", endCondition: "manual", target: null },
          { id: "bm-pushdown", movementId: "m-pushdown", endCondition: "manual", target: null }
        ]
      }]
    },
    {
      id: "s-core",
      name: "Core",
      blocks: [{
        id: "b-core",
        name: "Core",
        rounds: 1,
        setsPerRound: 3,
        setRest: 45,
        roundRest: 60,
        movements: [
          { id: "bm-plank", movementId: "m-plank", endCondition: "time", target: 60 }
        ]
      }]
    }
  ];

  var sessions, movements, activeSessionId;
  var state = {
    doneSets: 0,
    status: "notStarted",   // notStarted | ready | performing | resting | paused | done
    restKind: null,        // "set" | "round"
    duration: 0,
    remaining: 0,
    deadline: 0,
    setDuration: 0,
    setDeadline: 0,
    rest: null
  };
  var ui = {
    tab: "timer",
    route: { kind: "list" },
    expanded: false,
    deleteArmed: null,
    editingNumber: null,
    numberDraft: "",
    focusName: false,
    focusNumber: false,
    commitTimer: 0,
    pendingEdit: false,
    pendingReset: false,
    mapSig: "",
    islandSig: "",
    debugSig: "",
    draft: null,
    stagedBlock: null,
    celebration: false,
    celebrationTimer: 0,
    restartConfirm: null,
    alert: null,
    calMonth: null,
    calFilter: "all",
    calSheet: null,
    calDeleteArmed: null,
    calExceptionDraft: null,
    calExceptionError: "",
    calExceptionMode: "dates",
    calExceptionWeekday: 1
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var appEl = $("#app");
  var screenEl = $("#screen");
  var islandEl = $("#island");
  var debugEl = $("#debug");
  var stageEl = $("#stage");
  var frameEl = $("#phoneFrame");

  var textCache = new WeakMap();

  initData();
  initCalendar();

  /* ------------------------------------------------------------------ tiny helpers */
  function uid(prefix) {
    return (prefix || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function safeMul(a, b) {
    var v = a * b;
    if (!isFinite(v) || v > Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
    return v;
  }
  function safeAdd(a, b) {
    var v = a + b;
    if (!isFinite(v) || v > Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
    return v;
  }
  function safeCount(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    v = Math.floor(v);
    if (v < 1) return 1;
    if (v > Number.MAX_SAFE_INTEGER) return fallback;
    return v;
  }
  function safeRest(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    return clamp(Math.round(v / 15) * 15, LIMITS.setRest[0], LIMITS.setRest[1]);
  }
  function safeSetRest(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    if (v <= 0) return 0;
    return safeRest(v, fallback);
  }
  function safeTime(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    return clamp(Math.round(v / 15) * 15, LIMITS.time[0], LIMITS.time[1]);
  }
  function safeTarget(condition, value, fallback) {
    if (condition === "manual") return null;
    return safeTime(value, fallback == null ? 60 : fallback);
  }
  function trimName(value, fallback) {
    var name = String(value == null ? "" : value).trim().slice(0, 40);
    return name || fallback;
  }
  function liveName(value) {
    return String(value == null ? "" : value).slice(0, 40);
  }
  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function idOk(value, used) {
    return typeof value === "string" && /^[A-Za-z0-9_-]+$/.test(value) && !used[value];
  }
  function isCondition(value) { return CONDITIONS.indexOf(value) >= 0; }

  /* ------------------------------------------------------------------ model lookups */
  function findSession(id) {
    if (ui.draft && ui.draft.id === id) return ui.draft;
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === id) return sessions[i];
    return null;
  }
  function findBlock(session, id) {
    if (!session) return null;
    for (var i = 0; i < session.blocks.length; i++) if (session.blocks[i].id === id) return session.blocks[i];
    return null;
  }
  function findBlockMovement(block, id) {
    if (!block) return null;
    for (var i = 0; i < block.movements.length; i++) if (block.movements[i].id === id) return block.movements[i];
    return null;
  }
  /// A staged block lives outside `session.blocks` until DONE. Every block,
  /// movement, and picker route resolves its block through this one helper so a
  /// staged edit never touches the session or schedules a save.
  function routeBlock(route) {
    if (!route) return null;
    if (route.staged && ui.stagedBlock && ui.stagedBlock.id === route.blockId) return ui.stagedBlock;
    var session = findSession(route.sessionId);
    return findBlock(session, route.blockId);
  }
  function discardStagedBlock() {
    ui.stagedBlock = null;
  }
  function findMovement(id) {
    for (var i = 0; i < movements.length; i++) if (movements[i].id === id) return movements[i];
    return null;
  }
  function movementName(bm) {
    var m = bm ? findMovement(bm.movementId) : null;
    return m ? m.name : "Missing movement";
  }
  function movementGroup(bm) {
    var m = bm ? findMovement(bm.movementId) : null;
    return m ? m.group : "Untitled group";
  }
  function activeSession() {
    return findSession(activeSessionId) || sessions[0] || null;
  }
  function conditionLabel(condition) {
    return condition === "time" ? "TIME" : "MANUAL";
  }
  function conditionTargetLabel(condition, target) {
    if (condition === "manual" || target == null) return "MANUAL";
    return conditionLabel(condition) + " " + (condition === "time" ? fmt(target) : target);
  }
  function movementConditionLabel(bm) {
    return conditionTargetLabel(bm.endCondition, bm.target);
  }

  /* ------------------------------------------------------------------ totals and position */
  function blockTotalSets(block) {
    if (!block.movements.length) return 0;
    return safeMul(safeMul(Math.max(1, block.rounds), Math.max(1, block.setsPerRound)), block.movements.length);
  }
  function blockNumbers(block) {
    return plural(block.movements.length, "MOVEMENT", "MOVEMENTS") + ' · ' +
      plural(block.rounds, "ROUND", "ROUNDS") + ' · ' +
      plural(block.setsPerRound, "SET", "SETS") + ' EACH · ' +
      plural(blockTotalSets(block), "SET", "SETS");
  }
  function positionLabel(block, p) {
    var bits = [];
    if (block.rounds > 1) bits.push('ROUND ' + p.round + ' OF ' + block.rounds);
    if (block.setsPerRound > 1) bits.push('SET ' + p.set + ' OF ' + block.setsPerRound);
    return bits.join(' · ');
  }
  /// Movement-major: each movement runs all of its rounds before the next, so a
  /// set rest separates only sets inside a round, and every round boundary,
  /// movement switch, and block transition takes the round rest.
  function blockRest(block, hasNext) {
    if (!block.movements.length) return 0;
    var movements = Math.max(1, block.movements.length);
    var rounds = Math.max(1, block.rounds);
    var sets = Math.max(1, block.setsPerRound);
    var setRests = safeMul(
      safeMul(safeMul(movements, rounds), Math.max(0, sets - 1)),
      block.setRest
    );
    var roundRests = safeAdd(
      safeMul(movements, Math.max(0, rounds - 1)),
      safeAdd(Math.max(0, movements - 1), hasNext ? 1 : 0)
    );
    return safeAdd(setRests, safeMul(roundRests, block.roundRest));
  }
  function sessionTotals(session) {
    var sets = 0;
    var rest = 0;
    var movementSlots = 0;
    if (!session) return { sets: 0, rest: 0, blocks: 0, movements: 0 };
    session.blocks.forEach(function (block, index) {
      sets = safeAdd(sets, blockTotalSets(block));
      rest = safeAdd(rest, blockRest(block, index < session.blocks.length - 1));
      movementSlots = safeAdd(movementSlots, block.movements.length);
    });
    return { sets: sets, rest: rest, blocks: session.blocks.length, movements: movementSlots };
  }
  function blockOffset(session, blockIndex) {
    var offset = 0;
    for (var i = 0; i < blockIndex; i++) offset = safeAdd(offset, blockTotalSets(session.blocks[i]));
    return offset;
  }
  function posAt(session, index) {
    var total = sessionTotals(session).sets;
    if (!total || !session.blocks.length) return null;
    var i = clamp(index, 0, Math.max(0, total - 1));
    var offset = 0;
    for (var b = 0; b < session.blocks.length; b++) {
      var block = session.blocks[b];
      var count = blockTotalSets(block);
      if (i < count) {
        var p = {
          blockIndex: b,
          block: block,
          blockStart: offset,
          indexInBlock: i,
          movementIndex: 0,
          movement: null,
          set: 0,
          round: 0
        };
        var perMovement = safeMul(Math.max(1, block.rounds), Math.max(1, block.setsPerRound));
        var movementCount = Math.max(1, block.movements.length);
        p.movementIndex = Math.min(Math.floor(i / Math.max(1, perMovement)), movementCount - 1);
        var withinMovement = i % Math.max(1, perMovement);
        p.round = Math.floor(withinMovement / Math.max(1, block.setsPerRound)) + 1;
        p.set = (withinMovement % Math.max(1, block.setsPerRound)) + 1;
        p.movement = block.movements[Math.min(p.movementIndex, block.movements.length - 1)];
        return p;
      }
      offset = safeAdd(offset, count);
      i -= count;
    }
    var lastBlock = session.blocks[session.blocks.length - 1];
    var lastMovement = lastBlock.movements[lastBlock.movements.length - 1];
    return {
      blockIndex: session.blocks.length - 1,
      block: lastBlock,
      blockStart: blockOffset(session, session.blocks.length - 1),
      indexInBlock: Math.max(0, blockTotalSets(lastBlock) - 1),
      movementIndex: Math.max(0, lastBlock.movements.length - 1),
      movement: lastMovement,
      set: Math.max(1, lastBlock.setsPerRound),
      round: Math.max(1, lastBlock.rounds)
    };
  }
  function totalSets() { return sessionTotals(activeSession()).sets; }
  function totalRest() { return sessionTotals(activeSession()).rest; }
  function currentIndex() { return Math.min(state.doneSets, Math.max(0, totalSets() - 1)); }
  function currentPos() { return posAt(activeSession(), currentIndex()); }
  function groupOf() {
    if (state.status === "notStarted") return "gate";
    if (state.status === "performing") return "work";
    if (state.status === "resting" || state.status === "paused") return "rest";
    if (state.status === "done") return "done";
    return "ready";
  }

  /* ------------------------------------------------------------------ rest choice */
  function restKindLabel(kind) {
    return kind === "round" ? "ROUND REST" : "SET REST";
  }
  function restLabelFor(rest, p) {
    if (rest.transition === "set") return "AFTER SET " + p.set;
    if (rest.transition === "round") return "AFTER ROUND " + p.round;
    if (rest.transition === "movement") {
      return "AFTER " + movementName(rest.from).toUpperCase() + " · NEXT " + movementName(rest.to).toUpperCase();
    }
    if (rest.transition === "block") {
      return "AFTER " + rest.fromBlock.name.toUpperCase() + " · NEXT " + rest.toBlock.name.toUpperCase();
    }
    return "";
  }
  function restAfter(session, doneSets) {
    var total = sessionTotals(session).sets;
    if (doneSets >= total) return null;
    var p = posAt(session, doneSets);
    if (!p) return null;
    if (!p.block.movements.length) return null;
    var block = p.block;
    var movement = p.movement;
    var nextBlock = p.blockIndex < session.blocks.length - 1 ? session.blocks[p.blockIndex + 1] : null;
    var rest = null;

    if (p.set < block.setsPerRound) {
      rest = { kind: "set", dur: block.setRest, transition: "set", set: p.set };
    } else if (p.round < block.rounds) {
      rest = { kind: "round", dur: block.roundRest, transition: "round", round: p.round };
    } else if (p.movementIndex < block.movements.length - 1) {
      rest = { kind: "round", dur: block.roundRest, transition: "movement", from: movement, to: block.movements[p.movementIndex + 1] };
    } else if (nextBlock) {
      rest = { kind: "round", dur: block.roundRest, transition: "block", fromBlock: block, toBlock: nextBlock };
    }

    if (!rest) return null;
    rest.accent = rest.transition === "set" ? "set" : "round";
    rest.label = restLabelFor(rest, p);
    return rest;
  }
  function upcomingRest() {
    return restAfter(activeSession(), state.doneSets);
  }
  /// The completion alert's words. The app builds the same title and body in
  /// `CompletionAlertCopy`; change both together.
  function alertCopy(rest) {
    var title = rest.kind === "set" ? "SET REST OVER" : "ROUND REST OVER";
    var context = "";
    if (rest.transition === "set") {
      context = "AFTER SET " + rest.set;
    } else if (rest.transition === "round") {
      context = "AFTER ROUND " + rest.round;
    } else if (rest.transition === "movement") {
      context = "AFTER " + movementName(rest.from).toUpperCase() +

        return;
      }
    }
    ui.calExceptionDraft = null;
    ui.calExceptionError = "";
    render(false);
  }
  function calStartSession(sessionId) {
    if (!findSession(sessionId)) return;
    if (state.doneSets > 0 || isLocked()) {
      ui.calSheet = { kind: "startConfirm", sessionId: sessionId };
      render(false);
      return;
    }
    useSession(sessionId, true);
  }
  function calStartConfirmed(sessionId) {
    ui.calSheet = null;
    useSession(sessionId, true);
  }

  function sessionCode(name) {
    return String(name).toUpperCase();
  }
  function calMonthDate() {
    var now = new Date();
    if (!ui.calMonth) return new Date(now.getFullYear(), now.getMonth(), 1);
    return new Date(ui.calMonth.y, ui.calMonth.m, 1);
  }
  function calDayMatches(key) {
    var plan = planForKey(key);
    if (plan && plan.id === ui.calFilter) return true;
    return recordsOn(key).some(function (record) { return record.sessionId === ui.calFilter; });
  }
  /* ------------------------------------------------------------------ calendar markup */
  function calendarMarkup() {
    calRenderBoundary = nextUnstartedKey();
    var html = '<div class="calendar-scroll">';
    html += '<div class="cal-head"><div><div class="sessions-kicker">TRAINING</div>' +
      '<div class="sessions-title">CALENDAR</div></div></div>';
    html += calFiltersMarkup();
    html += calMonthMarkup();
    html += calUpNextMarkup();
    html += calSettingsMarkup();
    html += '<div class="sessions-foot">One session falls on each day through the SESSIONS order, ' +
      'then the rest days follow before the next round. A closed or skipped date keeps its place ' +
      'in the round and takes no session.</div>';
    html += '</div>';
    return html + calSheetMarkup();
  }

  function calFiltersMarkup() {
    var html = '<div class="cal-filters" aria-label="Session filter">';
    html += calChipMarkup("all", "ALL");
    sessions.forEach(function (session) {
      html += calChipMarkup(session.id, sessionCode(session.name));
    });
    return html + '</div>';
  }
  function calChipMarkup(id, label) {
    var on = ui.calFilter === id;
    return '<button class="cal-chip' + (on ? " on" : "") + '" data-act="cal-filter" data-id="' +
      esc(id) + '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(label) + '</button>';
  }

  function calMonthMarkup() {
    var month = calMonthDate();
    var html = '<div class="cal-month">' +
      '<button class="cal-nav" data-act="cal-prev" aria-label="Previous month">‹</button>' +
      '<div class="cal-month-label" data-el="calMonthLabel">' + MONTH_NAMES[month.getMonth()] +
        " " + month.getFullYear() + '</div>' +
      '<button class="cal-nav" data-act="cal-next" aria-label="Next month">›</button>' +
    '</div>';
    html += '<div class="cal-weekdays" data-el="calWeekdays">';
    for (var i = 0; i < 7; i++) {
      html += '<div class="cal-weekday">' + WEEKDAY_SHORT[(weekStartIndex() + i) % 7] + '</div>';
    }
    html += '</div><div class="cal-grid">';
    var lead = (month.getDay() - weekStartIndex() + 7) % 7;
    var start = addDays(month, -lead);
    for (var day = 0; day < 42; day++) {
      html += calCellMarkup(addDays(start, day), month);
    }
    return html + '</div>';
  }

  function calDayMark(key) {
    var exception = exceptionFor(key);
    if (exception) return { kind: "closed", exception: exception };
    if (isSkipped(key)) return { kind: "skipped" };
    if (!calRenderBoundary || key < calRenderBoundary) return { kind: "none" };
    if (!isSessionSlot(key)) return { kind: "rest" };
    var plan = planForKey(key);
    return plan ? { kind: "planned", plan: plan } : { kind: "none" };
  }

  function calCellMarkup(date, month) {
    var key = dayKey(date);
    var adjacent = date.getMonth() !== month.getMonth();
    var classes = "cal-cell";
    if (adjacent) classes += " adjacent";
    if (key === todayKey()) classes += " today";
    if (!adjacent && ui.calFilter !== "all" && !calDayMatches(key)) classes += " dim";

    var inner = '<span class="cal-day">' + date.getDate() + '</span>';
    if (!adjacent) {
      var records = recordsOn(key);
      var mark = calDayMark(key);
      var body = "";
      var bar = "";
      var sub = "";
      if (records.length) {
        var latest = records[records.length - 1];
        var pct = latest.totalSets > 0 ? Math.round((latest.doneSets / latest.totalSets) * 100) : 0;
        body = '<span class="cal-mark record">' + esc(sessionCode(latest.sessionName)) + '</span>';
        bar = '<span class="cal-bar"><i style="width:' + pct + '%"></i></span>';
        if (records.length > 1) {
          inner += '<span class="cal-count">' + records.length + '</span>';
        }
        if (mark.kind === "closed") sub = "CLOSED";
        else if (mark.kind === "skipped") sub = "SKIP";
        else if (mark.kind === "rest") sub = "REST";
      } else if (mark.kind === "closed") {
        body = '<span class="cal-mark word">CLOSED</span>';
      } else if (mark.kind === "skipped") {
        body = '<span class="cal-mark word">SKIP</span>';
      } else if (mark.kind === "rest") {
        body = '<span class="cal-mark word">REST</span>';
      } else if (mark.kind === "planned") {
        body = '<span class="cal-mark plan">' + esc(sessionCode(mark.plan.name)) + '</span>';
        bar = '<span class="cal-bar hollow"></span>';
      }
      inner += body + bar;
      if (sub) inner += '<span class="cal-sub">' + sub + '</span>';
    }
    if (adjacent) return '<div class="' + classes + '">' + inner + '</div>';
    return '<button class="' + classes + '" data-act="open-cal-day" data-key="' + key + '">' + inner + '</button>';
  }

  function calUpNextMarkup() {
    var key = calRenderBoundary;
    var plan = key ? planForKey(key) : null;
    if (!plan) return "";
    var label = key === todayKey()
      ? "TODAY"
      : WEEKDAY_SHORT[keyToDate(key).getDay()] + " " + keyToDate(key).getDate() + " " +
        MONTH_SHORT[keyToDate(key).getMonth()];
    return '<div class="cal-upnext"><span class="cal-upnext-k">UP NEXT</span> ' +
      '<span class="cal-upnext-v">' + esc(sessionCode(plan.name)) + " · " + label + '</span></div>';
  }

  function calSettingsMarkup() {
    var html = '<div class="cal-section"><div class="section-head"><div class="section-k">SETTINGS</div></div>';
    html += calRestGapRow();
    html += calSettingRow("exceptions", "EXCEPTIONS", calExceptionsValue());
    return html + '</div>';
  }
  function calRestGapRow() {
    return '<div class="cal-setting-row static" data-kind="restDays">' +
      '<span class="cal-setting-main"><span class="cal-setting-label">REST DAYS</span>' +
        '<span class="cal-setting-value">BETWEEN ROUNDS</span></span>' +
      '<span class="cal-gap">' +
        '<button class="cal-step" data-act="cal-gap-step" data-value="-1" aria-label="One rest day fewer">−</button>' +
        '<span class="cal-step-value" data-el="calGapValue">' + calendar.restDaysBetween + '</span>' +
        '<button class="cal-step" data-act="cal-gap-step" data-value="1" aria-label="One rest day more">+</button>' +
      '</span></div>';
  }
  function calSettingRow(kind, label, value) {
    return '<button class="cal-setting-row" data-act="open-cal-setting" data-kind="' + kind + '">' +
      '<span class="cal-setting-main"><span class="cal-setting-label">' + label + '</span>' +
        '<span class="cal-setting-value">' + esc(value) + '</span></span>' +
      '<span class="chev">›</span></button>';
  }
  function calExceptionsValue() {
    if (!calendar.exceptions.length) return "NONE";
    var text = exceptionText(calendar.exceptions[0]);
    if (calendar.exceptions.length > 1) text += " +" + (calendar.exceptions.length - 1);
    return text;
  }
  function exceptionWhenText(exception) {
    if (exception.kind === "weekday") return "EVERY " + WEEKDAY_FULL[exception.weekday - 1];
    var start = keyToDate(exception.start);
    var end = keyToDate(exception.end);
    var startText = start.getDate() + " " + MONTH_SHORT[start.getMonth()];
    if (exception.start === exception.end) return startText;
    return startText + "–" + end.getDate() + " " + MONTH_SHORT[end.getMonth()];
  }
  function exceptionText(exception) {
    var prefix = exception.label ? exception.label.toUpperCase() + " · " : "";
    return prefix + exceptionWhenText(exception);
  }

  /* ------------------------------------------------------------------ calendar sheets */
  function calSheetMarkup() {
    if (!ui.calSheet) return "";
    var body;
    switch (ui.calSheet.kind) {
      case "day": body = calDaySheetMarkup(ui.calSheet.key); break;
      case "exceptions": body = calExceptionsSheetMarkup(); break;
      case "changePicker": body = calChangePickerMarkup(ui.calSheet.key); break;
      case "startConfirm": body = calStartConfirmMarkup(); break;
      default: return "";
    }
    if (!body) return "";
    return '<div class="cal-sheet-backdrop" data-act="close-cal-sheet"></div>' +
      '<div class="cal-sheet" role="dialog" aria-modal="true">' +
        '<div class="cal-sheet-grip"></div>' + body +
      '</div>';
  }
  function calSheetHead(kicker) {
    return '<div class="cal-sheet-head"><span class="cal-sheet-kicker">' + kicker + '</span>' +
      '<button class="sheet-done" data-act="close-cal-sheet">DONE</button></div>';
  }
  function dayLongText(key) {
    var date = keyToDate(key);
    return WEEKDAY_SHORT[date.getDay()] + " " + date.getDate() + " " +
      MONTH_NAMES[date.getMonth()] + " " + date.getFullYear();
  }

  function calSheetTag(label) {
    return ' <span class="cal-tag">' + label + '</span>';
  }
  function calSheetTitle(name, tag) {
    return '<div class="cal-sheet-title">' + esc(name) + (tag ? calSheetTag(tag) : "") + '</div>';
  }
  function calSessionSummary(session) {
    var totals = sessionTotals(session);
    return plural(session.blocks.length, "BLOCK", "BLOCKS") + ' · ' +
      plural(totals.sets, "SET", "SETS") + ' · ' + fmtLong(totals.rest) + ' TOTAL REST';
  }
  function calBlocksMarkup(session) {
    var html = '<div class="cal-blocks">';
    session.blocks.forEach(function (block) {
      html += '<div class="cal-block"><div class="cal-block-name">' + esc(block.name) + '</div>' +
        '<div class="cal-block-meta">' + esc(blockNumbers(block)) + '</div>' +
        '<div class="cal-block-meta">' + fmtLong(block.setRest) + ' SET REST · ' +
          fmtLong(block.roundRest) + ' ROUND REST</div></div>';
    });
    return html + '</div>';
  }
  function calNextMarkup(key) {
    var next = nextPlanAfter(key);
    if (!next) {
      return '<div class="cal-next"><span class="cal-next-k">NEXT</span>' +
        '<span class="cal-next-v">NO SESSION PLANNED</span></div>';
    }
    var date = keyToDate(next.key);
    return '<div class="cal-next"><span class="cal-next-k">NEXT</span><span class="cal-next-v">' +
      esc(sessionCode(next.plan.name)) + ' · ' + WEEKDAY_SHORT[date.getDay()] + ' ' + date.getDate() +
      ' ' + MONTH_SHORT[date.getMonth()] + '</span></div>';
  }
  function calFooterMarkup(buttons) {
    var shown = buttons.filter(function (button) { return !!button; });
    if (!shown.length) return "";
    return '<div class="cal-footer">' + shown.join("") + '</div>';
  }
  function calActionButton(act, label) {
    return '<button class="cal-outline" data-act="' + act + '" data-key="' + esc(ui.calSheet.key) + '">' +
      label + '</button>';
  }
  function calRecordDeleteButton(record) {
    var armed = ui.calDeleteArmed === record.id;
    return '<button class="cal-outline danger' + (armed ? " armed" : "") + '" data-act="cal-delete-record" data-id="' +
      esc(record.id) + '">' + (armed ? "TAP AGAIN TO DELETE" : "DELETE RECORD") + '</button>';
  }

  function calDaySheetMarkup(key) {
    var records = recordsOn(key);
    var exception = exceptionFor(key);
    var skipped = isSkipped(key);
    var plan = planForKey(key);
    var future = key >= todayKey();
    var round = future ? calActionButton("cal-new-round", "NEW ROUND") : "";
    var html = calSheetHead(dayLongText(key));

    if (records.length) {
      html += calSheetTitle(
        records.length === 1 ? records[0].sessionName : plural(records.length, "RECORD", "RECORDS"),
        "RECORDED"
      );
      records.forEach(function (record) { html += calRecordMarkup(record); });
      if (exception) {
        html += '<div class="cal-sheet-note">CLOSED · ' + esc(exceptionText(exception)) +
          '. The record still shows on this date.</div>';
      }
      if (skipped) {
        html += '<div class="cal-sheet-note">SKIPPED · The record still shows on this date.</div>';
      }
      html += calNextMarkup(key);
      html += calFooterMarkup([calRecordDeleteButton(records[records.length - 1]), round]);
      return html;
    }
    if (exception) {
      html += '<div class="cal-sheet-title">' + esc(exception.label ? exception.label.toUpperCase() : "CLOSED") + '</div>' +
        '<div class="cal-sheet-meta">' + esc(exceptionWhenText(exception)) + ' · NO SESSION IS PLANNED</div>' +
        '<div class="cal-sheet-note">This date is closed. It skips the session on its slot and does not move the schedule.</div>' +
        calNextMarkup(key);
      return html;
    }
    if (skipped) {
      var skippedPlan = plan || scheduledPlanForKey(key);
      html += calSheetTitle(skippedPlan ? skippedPlan.name : "SKIPPED", "SKIPPED");
      if (skippedPlan) html += '<div class="cal-sheet-meta">' + esc(calSessionSummary(skippedPlan)) + '</div>';
      html += '<div class="cal-sheet-note">This session is skipped. The gap, the anchor and every other day stay where they are.</div>' +
        calNextMarkup(key) +
        calFooterMarkup([calActionButton("cal-unskip", "UNSKIP"), round]);
      return html;
    }
    if (calRenderBoundary && key >= calRenderBoundary && !isSessionSlot(key)) {
      html += '<div class="cal-sheet-title">REST DAY</div>' +
        '<div class="cal-sheet-meta">' + plural(calendar.restDaysBetween, "REST DAY", "REST DAYS") + ' BETWEEN ROUNDS</div>' +
        '<div class="cal-sheet-note">No session is planned on a rest day.</div>' +
        calNextMarkup(key) +
        calFooterMarkup([round]);
      return html;
    }
    if (plan) {
      var changed = !!changeSessionFor(key);
      html += calSheetTitle(plan.name, changed ? "CHANGED" : "") +
        '<div class="cal-sheet-meta">' + esc(calSessionSummary(plan)) + '</div>' +
        '<button class="cal-primary" data-act="cal-start" data-id="' + esc(plan.id) + '">START</button>' +
        calBlocksMarkup(plan) +
        calFooterMarkup([
          calActionButton("cal-open-change", "CHANGE"),
          calActionButton("cal-skip", "SKIP"),
          round
        ]);
      return html;
    }
    html += '<div class="cal-sheet-title">NO RECORD</div>' +
      '<div class="cal-sheet-meta">This date is before the next planned session.</div>' +
      calNextMarkup(key) +
      calFooterMarkup([round]);
    return html;
  }

  function calRecordMarkup(record) {
    var html = '<div class="cal-record"><div class="cal-record-head">' +
      '<span class="cal-record-name">' + esc(record.sessionName) + '</span>' +
      '<span class="cal-record-sets">' + record.doneSets + ' OF ' + record.totalSets + ' SETS</span></div>';
    var time = record.startTime ? "STARTED " + esc(record.startTime) : "START TIME NOT SAVED";
    var duration = record.finished
      ? (record.durationMin ? record.durationMin + " MIN" : "FINISHED")
      : "STOPPED BEFORE THE LAST SET";
    html += '<div class="cal-record-block">' + time + ' · ' + duration + '</div>';
    record.blocks.forEach(function (block) {
      html += '<div class="cal-record-block">' + esc(block.name) + ' · ' + esc(blockMeta(block)) + '</div>';
    });
    return html + '</div>';
  }

  function calExceptionsSheetMarkup() {
    var mode = ui.calExceptionMode === "weekday" ? "weekday" : "dates";
    var html = calSheetHead("EXCEPTIONS") +
      '<div class="cal-sheet-meta">A closed date plans no session and keeps its slot.</div>' +
      '<div class="cal-modes">' +
        calModeMarkup("dates", "DATES", mode) +
        calModeMarkup("weekday", "WEEKDAY", mode) +
      '</div>';
    calendar.exceptions.forEach(function (exception) {
      html += '<div class="cal-exception"><div class="cal-exception-main">' +
        '<div class="cal-exception-label">' + esc(exception.label || "CLOSED") + '</div>' +
        '<div class="cal-exception-days">' + esc(exceptionWhenText(exception)) + '</div></div>' +
        '<button class="cal-exception-delete" data-act="cal-remove-exception" data-id="' +
          esc(exception.id) + '" aria-label="Remove exception">×</button></div>';
    });
    if (!calendar.exceptions.length) {
      html += '<div class="cal-empty">NO EXCEPTIONS</div>';
    }
    if (mode === "weekday") {
      html += '<div class="cal-options">';
      for (var number = 1; number <= 7; number++) {
        var on = ui.calExceptionWeekday === number;
        html += '<button class="cal-option' + (on ? " on" : "") + '" data-act="cal-exception-weekday" data-value="' +
          number + '" aria-pressed="' + on + '">' + WEEKDAY_SHORT[number - 1] + '</button>';
      }
      html += '</div>';
    } else {
      var draft = ui.calExceptionDraft || { start: todayKey(), end: todayKey(), label: "" };
      html += '<div class="cal-range">' +
        '<label class="cal-field"><span>START</span><input class="cal-input" type="date" data-el="calStart" value="' +
          draft.start + '"></label>' +
        '<label class="cal-field"><span>END</span><input class="cal-input" type="date" data-el="calEnd" value="' +
          draft.end + '"></label>' +
      '</div>';
    }
    html += '<label class="cal-field" style="display:block;margin-top:10px"><span>LABEL</span>' +
      '<input class="cal-input" data-el="calLabel" maxlength="40" placeholder="Gym closed" value="' +
        esc((ui.calExceptionDraft && ui.calExceptionDraft.label) || "") + '"></label>';
    if (ui.calExceptionError) {
      html += '<div class="cal-sheet-note">' + esc(ui.calExceptionError) + '</div>';
    }
    html += '<button class="cal-primary" data-act="cal-add-exception">ADD CLOSURE</button>';
    return html;
  }

  function calModeMarkup(value, label, current) {
    var on = value === current;
    return '<button class="cal-mode' + (on ? " on" : "") + '" data-act="cal-exception-mode" data-value="' +
      value + '" aria-pressed="' + on + '">' + label + '</button>';
  }

  function calChangePickerMarkup(key) {
    var scheduled = scheduledPlanForKey(key);
    var chosen = changeSessionFor(key);
    var current = chosen || scheduled;
    var html = calSheetHead("CHANGE EXERCISE") +
      '<div class="cal-sheet-meta">' + esc(dayLongText(key)) + '</div>' +
      '<div class="cal-picker">';
    sessions.forEach(function (session) {
      var isScheduled = !!scheduled && session.id === scheduled.id;
      var isChosen = !!current && session.id === current.id;
      html += '<button class="cal-picker-row" data-act="cal-pick-session" data-id="' + esc(session.id) + '">' +
        '<span class="cal-picker-name">' + esc(session.name) + '</span>' +
        (isScheduled ? '<span class="cal-tag">SCHEDULED</span>' : "") +
        (isChosen ? '<span class="cal-picker-check">✓</span>' : "") +
      '</button>';
    });
    return html + '</div>';
  }

  function calStartConfirmMarkup() {
    var target = findSession(ui.calSheet.sessionId);
    if (!target) return "";
    var active = activeSession();
    var sets = state.doneSets;
    return calSheetHead("START " + esc(sessionCode(target.name))) +
      '<div class="cal-sheet-title">Discard ' + plural(sets, "set", "sets") + '?</div>' +
      '<div class="cal-sheet-meta">' + esc(active ? active.name : "The session") + ' has ' + sets +
        ' completed ' + (sets === 1 ? "set" : "sets") + '. Starting ' + esc(target.name) +
        ' clears them and opens the start gate.</div>' +
      '<button class="cal-primary" data-act="cal-start-confirm" data-id="' + esc(target.id) +
        '">DISCARD AND START</button>';
  }

  /* ------------------------------------------------------------------ edits */
  function markEdited(session) {
    ui.deleteArmed = null;
    if (session && ui.draft && session.id === ui.draft.id) return;
    ui.pendingEdit = true;
    if (session && session.id === activeSessionId) ui.pendingReset = true;
    if (ui.commitTimer) clearTimeout(ui.commitTimer);
    ui.commitTimer = setTimeout(function () {
      ui.commitTimer = 0;
      commitEdit();
    }, 350);
  }
  function commitEdit() {
    if (!ui.pendingEdit) return;
    ui.pendingEdit = false;
    saveData();
    if (ui.pendingReset) {
      ui.pendingReset = false;
      resetSession();
    }
  }
  function flushEdit() {
    commitOpenName();
    if (ui.commitTimer) {
      clearTimeout(ui.commitTimer);
      ui.commitTimer = 0;
    }
    commitEdit();
  }
  function commitOpenName() {
    var sessionInput = $('[data-el="sessionName"]', appEl);
    if (sessionInput && ui.route.kind === "session") commitSessionName(sessionInput);
    var blockInput = $('[data-el="blockName"]', appEl);
    if (blockInput && ui.route.kind === "block") commitBlockName(blockInput);
    var movementInput = $('[data-el="movementName"]', appEl);
    if (movementInput && ui.route.kind === "movement") commitMovementName(movementInput);
  }
  function commitSessionName(input) {
    if (ui.route.kind !== "session") return;
    var session = findSession(ui.route.id);
    if (!session) return;
    var name = trimName(input.value, "Untitled");
    if (input.value !== name) input.value = name;
    if (session.name !== name) {
      session.name = name;
      markEdited(session);
    }
  }
  function commitBlockName(input) {
    if (ui.route.kind !== "block") return;
    var session = findSession(ui.route.sessionId);
    var block = routeBlock(ui.route);
    if (!block) return;
    var name = trimName(input.value, "Untitled block");
    if (input.value !== name) input.value = name;
    if (block.name !== name) {
      block.name = name;
      if (!ui.route.staged) markEdited(session);
    }
  }
  function commitMovementName(input) {
    if (ui.route.kind !== "movement") return;
    var movement = findMovement(ui.route.id);
    if (!movement) return;
    var name = trimName(input.value, "Untitled movement");
    if (input.value !== name) input.value = name;
    if (movement.name !== name) {
      movement.name = name;
      markEdited(null);
    }
  }

  /* ------------------------------------------------------------------ navigation */
  function openSession(id) {
    flushEdit();
    ui.stagedBlock = null;
    if (!findSession(id)) return;
    ui.tab = "sessions";
    ui.route = { kind: "session", id: id };
    ui.deleteArmed = null;
    ui.editingNumber = null;
    render(false);
  }
  function openBlock(sessionId, blockId) {
    flushEdit();
    ui.stagedBlock = null;
    var session = findSession(sessionId);
    if (!session || !findBlock(session, blockId)) return;
    ui.tab = "sessions";
    ui.route = { kind: "block", sessionId: sessionId, blockId: blockId };
    ui.deleteArmed = null;
    ui.editingNumber = null;
    render(false);
  }
  function openBlockMovement(sessionId, blockId, movementId) {
    flushEdit();
    var block = routeBlock(ui.route);
    if (!block || !findBlockMovement(block, movementId)) return;
    ui.tab = "sessions";
    ui.route = {
      kind: "blockMovement",
      sessionId: sessionId,
      blockId: blockId,
      movementId: movementId,
      staged: ui.route.staged === true
    };
    ui.deleteArmed = null;
    ui.editingNumber = null;
    render(false);
  }
  function pickerDefault() {
