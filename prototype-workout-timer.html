  function finishRest(pulse) {
    if (state.status !== "resting" && state.status !== "paused") return;
    if (pulse && state.rest) {
      ui.alert = alertCopy(state.rest);
    }
    state.status = "ready";
    state.remaining = 0;
    state.duration = 0;
    state.restKind = null;
    state.deadline = 0;
    state.rest = null;
    if (pulse) {
      islandEl.classList.remove("pulse");
      void islandEl.offsetWidth;
      islandEl.classList.add("pulse");
    }
    render(true);
  }
  function skipRest() {
    if (state.status !== "resting" && state.status !== "paused") return;
    flushEdit();
    finishRest(false);
  }
  function pauseRest() {
    if (state.status !== "resting") return;
    flushEdit();
    if (state.status !== "resting") return;
    state.remaining = remainingNow();
    state.deadline = 0;
    state.status = "paused";
    sync();
  }
  function resumeRest() {
    if (state.status !== "paused") return;
    flushEdit();
    if (state.status !== "paused") return;
    state.status = "resting";
    state.deadline = performance.now() + state.remaining * 1000;
    sync();
  }
  function startCelebration() {
    if (ui.celebrationTimer) clearTimeout(ui.celebrationTimer);
    ui.celebration = true;
    ui.celebrationTimer = setTimeout(function () {
      ui.celebration = false;
      ui.celebrationTimer = 0;
      render(false);
    }, 2500);
  }
  function stopCelebration() {
    if (ui.celebrationTimer) clearTimeout(ui.celebrationTimer);
    ui.celebrationTimer = 0;
    ui.celebration = false;
  }
  function again() {
    flushEdit();
    resetSession();
    state.status = "ready";
    ui.tab = "timer";
    ui.route = { kind: "list" };
    ui.expanded = false;
    render(true);
  }
  /* ------------------------------------------------------------------ numeric editing */
  function startEditNumber(key) {
    if (isLocked()) return;
    var target = resolveEditTarget(key);
    if (!target || target.value == null) return;
    ui.editingNumber = { scope: ui.route.kind, key: key };
    ui.numberDraft = String(target.value);
    ui.focusNumber = true;
    render(false);
  }
  function resolveEditTarget(key) {
    if (ui.route.kind === "block") {
      var block = routeBlock(ui.route);
      if (!block) return null;
      return { object: block, key: key, value: block[key], condition: null };
    }
    if (ui.route.kind === "blockMovement") {
      var b2 = routeBlock(ui.route);
      var bm = findBlockMovement(b2, ui.route.movementId);
      if (!bm || key !== "target") return null;
      return { object: bm, key: "target", value: bm.target, condition: bm.endCondition };
    }
    if (ui.route.kind === "movement") {
      var movement = findMovement(ui.route.id);
      if (!movement || (key !== "defaultTarget" && key !== "target")) return null;
      return { object: movement, key: "defaultTarget", value: movement.defaultTarget, condition: movement.defaultCondition };
    }
    return null;
  }
  function commitNumberInput(input, immediate) {
    if (!ui.editingNumber) return;
    var target = resolveEditTarget(ui.editingNumber.key);
    var editing = ui.editingNumber;
    ui.editingNumber = null;
    if (!target) return;
    var current = target.value;
    var raw = String(input.value == null ? "" : input.value).trim();
    var next = current;
    if (raw) {
      if (editing.key === "rounds" || editing.key === "setsPerRound") {
        next = safeCount(raw, current);
      } else if (editing.key === "target" || editing.key === "defaultTarget") {
        next = safeTarget(target.condition, raw, current);
      } else {
        next = current;
      }
    }
    if (next !== current) {
      target.object[target.key] = next;
      if (ui.route.staged) {
        // Staged edits stay in memory and never schedule a save.
      } else if (ui.route.kind === "block" || ui.route.kind === "blockMovement") {
        markEdited(findSession(ui.route.sessionId));
      } else {
        markEdited(null);
      }
    }
    if (immediate) render(false);
    else setTimeout(function () { if (!ui.editingNumber) render(false); }, 0);
  }

  /* ------------------------------------------------------------------ rendering */
  function render(animate) {
    if (ui.tab !== "timer") {
      ui.restartConfirm = null;
    }
    appEl.innerHTML = appMarkup();
    ui.mapSig = "";
    if (animate) {
      var root = appEl.firstElementChild;
      if (root) {
        root.classList.add("screen-in");
        root.addEventListener("animationend", function () { root.classList.remove("screen-in"); }, { once: true });
      }
    }
    sync();
    syncIsland(true);
    if (ui.focusName) {
      ui.focusName = false;
      setTimeout(focusNameInput, 0);
    }
    if (ui.focusNumber) {
      ui.focusNumber = false;
      setTimeout(focusNumberInput, 0);
    }
    if (ui.tab === "timer") {
      requestAnimationFrame(scrollBlockStrip);
    }
  }

  function appMarkup() {
    var sessionsView = ui.tab === "sessions";
    var calendarView = ui.tab === "calendar";
    var body = sessionsView ? sessionsMarkup() : (calendarView ? calendarMarkup() : timerMarkup());
    var phase = sessionsView || calendarView ? "set" : accentKind();
    var screenClass = sessionsView ? " sessions-screen" : (calendarView ? " calendar-screen" : " timer-screen");
    return '<div class="app-screen' + screenClass + '" data-phase="' + phase + '">' +
      body +
      celebrationMarkup() +
      completionAlertMarkup() +
      restartDialogMarkup() +
      tabbarMarkup() +
    '</div>';
  }

  /// The one-shot done effect: 48 accent pieces that fall over 2.5 seconds.
  /// It is inert to the pointer and hidden from assistive technology; Reduce
  /// Motion swaps the pieces for a static accent glow.
  function celebrationMarkup() {
    if (!ui.celebration || state.status !== "done" || ui.tab !== "timer") return "";
    var colors = ["#C8FF4D", "#FFFFFF", "#FFB84D"];
    var pieces = "";
    for (var i = 0; i < 48; i++) {
      var left = (i * 37) % 100;
      var drift = ((i * 53) % 120) - 60;
      var spin = ((i * 47) % 540) + 180;
      var delay = (i % 8) * 40;
      pieces += '<span class="confetti" style="left:' + left + '%;--drift:' + drift +
        'px;--spin:' + spin + 'deg;animation-delay:' + delay + 'ms;background:' +
        colors[i % colors.length] + '"></span>';
    }
    return '<div class="celebration" aria-hidden="true">' + pieces + '</div>';
  }

  /// The prototype's visual stand-in for the system local notification. It is
  /// silent and leaves the island compact; the app shows the same card.
  function completionAlertMarkup() {
    if (!ui.alert) return '';
    return '<div class="alert-card" role="alert" data-act="dismiss-alert">' +
      '<div class="alert-app">RESTLESS</div>' +
      '<div class="alert-title">' + esc(ui.alert.title) + '</div>' +
      '<div class="alert-body">' + esc(ui.alert.body) + '</div>' +
    '</div>';
  }

  /// One restart dialog for the timer, replacing the old two-tap arm. It closes
  /// when the phase it was opened in changes.
  function restartDialogMarkup() {
    if (!ui.restartConfirm || ui.restartConfirm !== state.status) return '';
    return '<div class="confirm-backdrop" data-act="restart-cancel"></div>' +
      '<div class="confirm" role="dialog" aria-modal="true" aria-labelledby="restartTitle">' +
        '<div class="confirm-title" id="restartTitle">Restart this session?</div>' +
        '<div class="confirm-body">This clears all completed sets, cancels the current rest, ' +
          'and returns to block 1, set 1.</div>' +
        '<div class="confirm-actions">' +
          '<button class="confirm-cancel" data-act="restart-cancel">Cancel</button>' +
          '<button class="confirm-destructive" data-act="restart-confirm">Restart Session</button>' +
        '</div>' +
      '</div>';
  }

  function timerMarkup() {
    var session = activeSession();
    var group = groupOf();
    var isRest = group === "rest";
    var isDone = group === "done";
    var p = currentPos();
    if (!session || !p) {
      return '<div class="center-stack"><div class="rt-center"><div class="rt-kicker">NO SESSION</div><div class="rt-sub">Open SESSIONS to build a plan.</div></div></div>';
    }
    var block = p.block;
    var movement = p.movement;
    var multi = session.blocks.length > 1;
    var movementText = movementName(movement);
    var doneInBlock = clamp(state.doneSets - p.blockStart, 0, blockTotalSets(block));
    var stageHeight = Math.max(320, (screenEl.clientHeight || 852) - 64 - 92);
    var posHtml;

    if (isDone) {
      posHtml = '<div class="pos"><span class="pos-done">SESSION COMPLETE</span></div>';
    } else {
      var bits = [];
      if (isRest) bits.push('<span class="pos-up">UP NEXT</span>');
      // The block strip already names the active block in a multi-block
      // session; a single block names itself only when it adds something the
      // movement name does not.
      if (!multi && block.name.trim().toLowerCase() !== movementText.trim().toLowerCase()) {
        bits.push('<span class="pos-block">' + esc(block.name) + '</span>');
        bits.push('<span class="pos-sep"></span>');
      }
      bits.push('<span class="pos-move">' + esc(movementText) + '</span>');
      var posText = positionLabel(block, p);
      if (posText) {
        bits.push('<span class="pos-sep"></span>');
        bits.push('<span>' + posText + '</span>');
      }
      posHtml = '<div class="pos">' + bits.join('') + '</div>';
    }

    // The ring's centre is pinned to half the stage height. The chrome sits
    // above it in the same stage, and the lower content starts one fixed gap
    // below the ring, so neither wrapping copy nor map height can move it.
    return '' +
      '<div class="timer-stage" style="--stage-h:' + stageHeight + 'px">' +
        '<div class="timer-chrome">' +
          '<header class="app-head">' +
            '<div class="brand"><span class="brand-dot"></span><span class="brand-name" data-el="brandName">' +
              esc(session.name) + '</span></div>' +
            '<div class="head-actions">' +
              (isRest || group === "work" ? '' : '<button class="edit-pill chrome-glass" data-act="edit-session">EDIT</button>') +
              restartMarkup() +
            '</div>' +
          '</header>' +
          (multi ? blockStripMarkup(session, p.blockIndex) : '') +
          posHtml +
        '</div>' +
        '<div class="hero">' +
          '<svg class="rt-ring" viewBox="0 0 340 340" aria-hidden="true">' +
            '<circle class="rt-track" cx="170" cy="170" r="160"></circle>' +
            '<circle class="rt-prog" cx="170" cy="170" r="160" data-el="ring"></circle>' +
          '</svg>' +
          '<div class="rt-center">' +
            '<div class="rt-kicker" data-el="kicker"></div>' +
            '<div class="rt-time" data-el="time"></div>' +
            '<div class="rt-sub" data-el="sub"></div>' +
          '</div>' +
        '</div>' +
        '<div class="timer-lower">' +
          mapMarkup(session, block, doneInBlock) +
          '<div class="actions">' +
            '<button class="primary" data-act="primary">' +
              '<span class="btn-main" data-el="btnMain"></span>' +
              '<span class="btn-sub" data-el="btnSub"></span>' +
            '</button>' +
            (isRest ? '<button class="icon-btn" data-act="skip" aria-label="Skip rest">' + ICON.skip + '</button>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /// One restart control: it opens the confirmation dialog that names the lost
  /// progress. Hidden before the first set and in done, where START AGAIN is
  /// the primary action.
  function restartMarkup() {
    if (state.doneSets <= 0 || state.status === "done" || state.status === "notStarted") return "";
    return '<button class="edit-pill restart-pill chrome-glass" data-act="restart" ' +
      'aria-label="Restart session">' + ICON.restart + '</button>';
  }

  function blockStripMarkup(session, activeIndex) {
    var out = '<div class="block-strip" data-el="blockStrip">';
    var offset = 0;
    session.blocks.forEach(function (block, index) {
      var total = blockTotalSets(block);
      var complete = state.status === "done" || state.doneSets >= offset + total;
      var active = index === activeIndex;
      out += '<span class="block-chip ' + (complete ? "done" : active ? "on" : "") + '"' +
        ' aria-label="' + esc(block.name) + (complete ? ", complete" : active ? ", active" : "") + '">' +
        (complete ? '<span class="pc-check">✓</span>' : '') +
        '<span>' + esc(block.name) + '</span>' +
      '</span>';
      offset = safeAdd(offset, total);
    });
    return out + '</div>';
  }

  function mapMarkup(session, block, doneInBlock) {
    var total = blockTotalSets(block);
    var stepsPerRound = Math.max(1, block.setsPerRound);
    var rows = safeMul(Math.max(1, block.rounds), Math.max(1, block.movements.length));
    var inner;
    var dots = MAP_LIMITS.dots;
    if (rows <= MAP_LIMITS.rounds && stepsPerRound <= MAP_LIMITS.perRound && total <= dots) {
      var groups = "";
      block.movements.forEach(function (bm, m) {
        var movementRows = "";
        for (var r = 1; r <= block.rounds; r++) {
          movementRows += '<div class="map-row" data-m="' + m + '" data-r="' + r + '">' +
            '<span class="map-label">R' + r + '</span>' +
            '<span class="map-dots">';
          for (var k = 1; k <= stepsPerRound; k++) {
            movementRows += '<i class="map-dot" data-m="' + m + '" data-r="' + r + '" data-k="' + k + '"></i>';
          }
          movementRows += '</span></div>';
        }
        groups += '<div class="map-group" data-m="' + m + '">' + movementRows + '</div>';
      });
      inner = '<div class="map-grid">' + groups + '</div>';
    } else {
      var pct = total ? (doneInBlock / total) * 100 : 0;
      inner = '<div class="map-bar-wrap">' +
        '<div class="map-bar"><i data-el="mapBar" style="width:' + pct + '%"></i></div>' +
        '<div class="map-bar-label">' + doneInBlock + ' OF ' + total + ' SETS IN THIS BLOCK</div>' +
      '</div>';
    }
    return '<div class="map-wrap">' + inner + '<div class="map-caption" data-el="mapCap"></div></div>';
  }

  function tabbarMarkup() {
    return '<nav class="tabbar" aria-label="Main tabs">' +
      '<button class="' + (ui.tab === "timer" ? "on" : "") + '" data-act="tab-timer" aria-label="Timer">' +
        ICON.timer + '<span>TIMER</span></button>' +
      '<button class="' + (ui.tab === "sessions" ? "on" : "") + '" data-act="tab-sessions" aria-label="Sessions">' +
        ICON.sessions + '<span>SESSIONS</span></button>' +
      '<button class="' + (ui.tab === "calendar" ? "on" : "") + '" data-act="tab-calendar" aria-label="Calendar">' +
        ICON.calendar + '<span>CALENDAR</span></button>' +
    '</nav>';
  }

  function sessionsMarkup() {
    if (ui.route.kind === "session") return sessionEditorMarkup(ui.route.id);
    if (ui.route.kind === "block") return blockEditorMarkup(ui.route.sessionId, ui.route.blockId, ui.route.staged === true);
    if (ui.route.kind === "blockMovement") return blockMovementMarkup(ui.route.sessionId, ui.route.blockId, ui.route.movementId);
    if (ui.route.kind === "picker") return pickerMarkup(ui.route.sessionId, ui.route.blockId);
    if (ui.route.kind === "library") return libraryMarkup();
    if (ui.route.kind === "movement") return movementDetailMarkup(ui.route.id);
    return sessionsListMarkup();
  }

  function sessionsListMarkup() {
    var locked = isLocked();
    var html = '<div class="sessions-scroll">';
    html += '<div class="sessions-head">' +
      '<div><div class="sessions-kicker">WORKOUTS</div><div class="sessions-title">SESSIONS</div></div>' +
      '<button class="add-pill chrome-glass" data-act="add-session" aria-label="Add session"' + (locked ? " disabled" : "") + '>+</button>' +
    '</div>';
    html += lockBannerMarkup(locked);
    sessions.forEach(function (session) {
      var t = sessionTotals(session);
      var active = session.id === activeSessionId;
      html += '<div class="session-row" data-drag-row="session" data-id="' + esc(session.id) + '">' +
        '<button class="session-card' + (active ? " on" : "") + '" data-act="open-session" data-id="' + esc(session.id) + '">' +
          '<div class="sc-main">' +
            '<div class="sc-name">' + esc(session.name) + '</div>' +
            '<div class="sc-meta">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + ' · ' +
              plural(t.sets, "SET", "SETS") + ' · ' + fmtLong(t.rest) + ' REST</div>' +
          '</div>' +
          '<div class="sc-right">' + (active ? '<span class="active-badge">ACTIVE</span>' : '') +
            '<span class="chev">›</span></div>' +
        '</button>' +
        '<span class="row-grip" draggable="' + (locked ? "false" : "true") + '" data-drag-handle="session" data-id="' +
          esc(session.id) + '" role="button" aria-label="Reorder session">' + ICON.grip + '</span>' +
      '</div>';
    });
    html += '<div class="lib-head"><div class="sessions-kicker">LIBRARY</div>' +
      '<div class="lib-count">' + plural(movements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
    html += '<button class="session-card" data-act="open-library">' +
      '<div class="sc-main"><div class="sc-name">MOVEMENTS</div>' +
        '<div class="sc-meta">Reusable in any block</div></div>' +
      '<div class="sc-right"><span class="chev">›</span></div>' +
    '</button>';
    html += '<div class="sessions-foot">Each movement runs all of its rounds before the next. A set rest follows each set inside a round; a round rest follows each round, each movement switch, and each block.</div>';
    return html + '</div>';
  }

  function sessionEditorMarkup(sessionId) {
    var session = findSession(sessionId);
    if (!session) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var total = sessionTotals(session);
    var isActive = session.id === activeSessionId;
    var isDraft = ui.route.draft === true;
    var commitBlocked = isDraft && !canCommitDraft();
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-list">‹ SESSIONS</button>' +
      '<button class="sheet-done" data-act="done-session"' +
        (commitBlocked ? " disabled" : "") + '>DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">SESSION</div>';
    html += '<input class="preset-name" data-el="sessionName" value="' + esc(session.name) +
      '" maxlength="40" spellcheck="false" autocomplete="off" aria-label="Session name"' + (locked ? " disabled" : "") + '>';
    html += '<div class="sheet-note">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + ' · ' +
      plural(total.sets, "SET", "SETS") + ' · ' + fmtLong(total.rest) + ' TOTAL REST</div>';
    if (commitBlocked) {
      html += '<div class="sheet-warn">ADD A MOVEMENT TO SAVE THIS SESSION.</div>';
    }
    if (isActive && state.doneSets > 0 && !locked) {
      html += '<div class="sheet-warn">EDITING THIS SESSION RESTARTS IT.</div>';
    }
    html += lockBannerMarkup(locked);
    html += '<div class="section-head"><div class="section-k">BLOCKS</div>' +
      '<div class="section-count">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + '</div></div>';
    session.blocks.forEach(function (block, index) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "block" && ui.deleteArmed.id === block.id;
      html += '<div class="block-row" data-drag-row="block" data-id="' + esc(block.id) + '">' +
        '<button class="block-open" data-act="open-block" data-id="' + esc(block.id) + '">' +
          '<span class="br-index">' + pad2(index + 1) + '</span>' +
          '<span class="br-main"><span class="br-name">' + esc(block.name) + '</span>' +
            '<span class="br-meta' + (armed ? " danger" : "") + '">' +
              (armed ? "TAP AGAIN TO DELETE" : blockMeta(block)) + '</span></span>' +
          '<span class="br-chev">›</span>' +
        '</button>' +
        '<div class="row-actions">' +
          '<span class="row-grip" draggable="' + (locked ? "false" : "true") + '" data-drag-handle="block" data-id="' +
            esc(block.id) + '" role="button" aria-label="Reorder block">' + ICON.grip + '</span>' +
          (session.blocks.length > 1
            ? '<button class="row-trash' + (armed ? " armed" : "") + '" data-act="delete-block-row" data-id="' +
                esc(block.id) + '" aria-label="Delete block"' + (locked ? " disabled" : "") + '>' + ICON.trash + '</button>'
            : '') +
        '</div>' +
      '</div>';
    });
    html += '<button class="add-block" data-act="add-block"' + (locked || !movements.length ? " disabled" : "") + '>+ ADD BLOCK</button>';
    html += '<div class="editor-foot">';
    if (isDraft) {
      html += '<button class="use-btn" data-act="use-session"' +
        (locked || commitBlocked ? " disabled" : "") + '>USE THIS SESSION</button>';
    } else if (isActive) {
      if (state.doneSets > 0) {
        html += '<button class="use-btn" data-act="restart-session"' + (locked ? " disabled" : "") + '>RESTART SESSION</button>';
      } else {
        html += '<div class="active-state">ACTIVE SESSION</div>';
      }
    } else {
      html += '<button class="use-btn" data-act="use-session" data-id="' + esc(session.id) + '"' +
        (locked ? " disabled" : "") + '>USE THIS SESSION</button>';
    }
    if (!isDraft && sessions.length > 1) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "session" && ui.deleteArmed.id === session.id;
      html += '<button class="danger-link' + (armed ? " armed" : "") + '" data-act="delete-session" data-id="' +
        esc(session.id) + '"' + (locked ? " disabled" : "") + '>' +
        (armed ? "TAP AGAIN TO DELETE" : "DELETE SESSION") + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function blockMeta(block) {
    return blockNumbers(block) + ' · SET ' + fmt(block.setRest) + ' · ROUND ' + fmt(block.roundRest);
  }
  function blockSummary(block) {
    return blockNumbers(block) + ' · ' + fmtLong(blockRest(block, false)) + ' REST';
  }

  function blockEditorMarkup(sessionId, blockId, staged) {
    var session = findSession(sessionId);
    var block = staged ? routeBlock({ sessionId: sessionId, blockId: blockId, staged: true }) : findBlock(session, blockId);
    if (!session || !block) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-session">‹ SESSION</button>' +
      '<button class="sheet-done" data-act="done-block"' +
        (staged && !block.movements.length ? " disabled" : "") + '>DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">BLOCK</div>';
    html += '<input class="preset-name" data-el="blockName" value="' + esc(block.name) +
      '" maxlength="40" spellcheck="false" autocomplete="off" aria-label="Block name"' + (locked ? " disabled" : "") + '>';
    html += '<div class="sheet-note">' + blockSummary(block) + '</div>';
    html += lockBannerMarkup(locked);
    html += '<div class="rows">' +
      blockRow(block, "rounds", "ROUNDS", true, locked) +
      blockRow(block, "setsPerRound", "SETS PER ROUND", true, locked) +
      blockRow(block, "setRest", "SET REST", false, locked) +
      blockRow(block, "roundRest", "ROUND REST", false, locked) +
    '</div>';
    html += '<div class="section-head"><div class="section-k">MOVEMENTS</div><div class="section-count">' +
      plural(block.movements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';

  function groupChips(selected, action, locked) {
    var options = GROUPS.slice();
    if (selected && options.indexOf(selected) < 0) options.push(selected);
    var html = '<div class="chip-row">';
    options.forEach(function (group) {
      html += '<button class="chip' + (group === selected ? " on" : "") + '" data-act="' + action +
        '" data-group="' + esc(group) + '"' + (locked ? " disabled" : "") + '>' + esc(group.toUpperCase()) + '</button>';
    });

  function segMarkup(options, selected, action, locked) {

      html += '<button class="' + (option.value === selected ? "on" : "") + '" data-act="' + action +
        '" data-value="' + option.value + '"' + (locked ? " disabled" : "") + '>' + option.label + '</button>';
    });

  function lockBannerMarkup(locked) {
    return locked
      ? '<div class="lock-banner">EDITING LOCKED DURING A SET OR REST · SWITCH TO TIMER TO SET DONE OR PAUSE</div>'
      : '';
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(s) { var v = Math.max(0, Math.ceil(s)); return Math.floor(v / 60) + ":" + pad(v % 60); }
  function fmtLong(s) {
    var v = Math.max(0, Math.round(s));
    var h = Math.floor(v / 3600);
    var m = Math.floor((v % 3600) / 60);
    var sec = v % 60;
    return h ? (h + ":" + pad(m) + ":" + pad(sec)) : (m + ":" + pad(sec));
  }

  function focusNameInput() {
    var input = $('[data-el="sessionName"], [data-el="blockName"], [data-el="movementName"]', appEl);
    if (input) { input.focus(); input.select(); }
  }
  function focusNumberInput() {
    var input = $('[data-el="numberInput"]', appEl);
    if (input) { input.focus(); input.select(); }
  }
  function scrollBlockStrip() {
    var strip = $('[data-el="blockStrip"]', appEl);
    if (!strip) return;
    var chip = $(".block-chip.on", strip);
    if (!chip) return;
    strip.scrollLeft = Math.max(0, chip.offsetLeft - (strip.clientWidth - chip.offsetWidth) / 2);
  }

  /* ------------------------------------------------------------------ sync */
  function setText(el, text) {
    if (!el) return;
    if (textCache.get(el) !== text) {
      textCache.set(el, text);
      el.textContent = text;
    }
  }

  function sync() {
    var group = groupOf();
    var session = activeSession();
    var p = currentPos();
    var accent = accentKind();
    var wrap = $(".app-screen", appEl);
    if (wrap && ui.tab === "timer" && wrap.getAttribute("data-phase") !== accent) {
      wrap.setAttribute("data-phase", accent);
    }

    if (ui.tab === "timer" && p) {
      var kicker, timeText, sub, progress = 0, small = false;
      var total = sessionTotals(session).sets;

      if (group === "gate") {
        kicker = "READY";
        timeText = "START";
        sub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " +
          plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
        small = true;
      } else if (group === "ready") {
        var rest = upcomingRest();
        if (rest) {
          if (rest.dur <= 0) {
            kicker = "NO REST";
            timeText = "NEXT";
            sub = "AFTER THIS SET";
            small = true;
          } else {
            kicker = restKindLabel(rest.kind);
            timeText = fmt(rest.dur);
            sub = "AFTER THIS SET";
          }
        } else {
          kicker = "LAST SET";
          timeText = "FINISH";
          sub = "NO REST AFTER";
          small = true;
        }
      } else if (group === "work") {
        kicker = "WORK";
        timeText = fmt(remainingSetNow());
        var workRest = upcomingRest();
        sub = workRest ? (workRest.dur > 0 ? "REST " + fmt(workRest.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
        progress = setProgress();
      } else if (group === "rest") {
        kicker = state.status === "paused" ? "PAUSED" : restKindLabel(state.restKind);
        timeText = fmt(remainingNow());
        sub = state.rest ? state.rest.label : "";
        progress = restProgress();
      } else {
        kicker = state.doneSets + " OF " + plural(total, "SET", "SETS");
        timeText = "DONE";
        sub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " +
          plural(sessionTotals(session).movements, "MOVEMENT", "MOVEMENTS") + " · " +
          fmtLong(sessionTotals(session).rest) + " TOTAL REST";
        progress = 1;
        small = true;
      }

      setText($("[data-el='kicker']", appEl), kicker);
      var timeEl = $("[data-el='time']", appEl);
      setText(timeEl, timeText);
      if (timeEl) timeEl.classList.toggle("small", small);
      setText($("[data-el='sub']", appEl), sub);

      var ring = $("[data-el='ring']", appEl);
      if (ring) ring.style.strokeDashoffset = String(1005.31 * (1 - progress));

      setText($("[data-el='mapCap']", appEl), state.doneSets + " OF " + plural(total, "SET", "SETS"));
      paintMap(p, session);

      var blockStart = p.blockStart;
      var blockTotal = blockTotalSets(p.block);
      var doneInBlock = clamp(state.doneSets - blockStart, 0, blockTotal);
      var mapBar = $("[data-el='mapBar']", appEl);
      if (mapBar) {
        mapBar.style.width = (blockTotal ? (doneInBlock / blockTotal) * 100 : 0) + "%";
        setText($(".map-bar-label", appEl), doneInBlock + " OF " + blockTotal + " SETS IN THIS BLOCK");
      }

      var main, btnSub;
      if (group === "gate") {
        main = "START SESSION";
        btnSub = "BLOCK 1 · " + session.blocks[0].name.toUpperCase();
      } else if (group === "ready") {
        if (p.movement.endCondition === "time") {
          main = "START";
          btnSub = fmt(p.movement.target) + " HOLD";
        } else {
          var readyRest = upcomingRest();
          main = "SET DONE";
          btnSub = readyRest ? (readyRest.dur > 0 ? "START " + fmt(readyRest.dur) + " " + (readyRest.kind === "set" ? "SET" : "ROUND") + " REST" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
        }
      } else if (group === "work") {
        var workRest2 = upcomingRest();
        main = "SET DONE";
        btnSub = workRest2 ? (workRest2.dur > 0 ? "REST " + fmt(workRest2.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "FINISH AFTER THIS SET";
      } else if (group === "rest") {
        if (state.status === "paused") {
          main = "RESUME";
          btnSub = "TAP TO RESUME";
        } else {
          main = "PAUSE";
          btnSub = restKindLabel(state.restKind);
        }
      } else {
        main = "START AGAIN";
        btnSub = plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      }
      setText($("[data-el='btnMain']", appEl), main);
      setText($("[data-el='btnSub']", appEl), btnSub);
    }

    syncIsland(false);

    var debugSig = group + "|" + state.status + "|" + state.doneSets + "|" + (state.restKind || "") + "|" +
      Math.floor(remainingNow()) + "|" + Math.floor(remainingSetNow());
    if (debugSig !== ui.debugSig) {
      ui.debugSig = debugSig;
      var txt;
      if (!p) {
        txt = "NO SESSION";
      } else if (group === "gate") {
        txt = "READY · NOT STARTED · BLOCK 1/" + session.blocks.length + " · " + p.block.name + " · " +
          movementName(p.movement);
      } else if (group === "ready") {
        txt = "READY · BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name + " · " +
          movementName(p.movement) + " · " + positionLabel(p.block, p) +
          " · " + movementConditionLabel(p.movement);
      } else if (group === "work") {
        txt = "PERFORMING · WORK " + fmt(remainingSetNow()) + " · " + movementName(p.movement) + " · " +
          positionLabel(p.block, p);
      } else if (group === "rest") {
        txt = state.status.toUpperCase() + " · " + restKindLabel(state.restKind) + " · " + fmt(remainingNow()) +
          " · " + (state.rest ? state.rest.label : "") + " · NEXT " + movementName(p.movement);
      } else {
        txt = "DONE · " + plural(sessionTotals(session).sets, "SET", "SETS") + " · " +
          plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      }
      var safeText = txt.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      debugEl.innerHTML = safeText.replace(/^(READY|PERFORMING|RESTING|PAUSED|DONE|NO SESSION)/, "<b>$1</b>");
    }
  }

  function paintMap(p, session) {
    var dots = $$(".map-dot", appEl);
    if (!dots.length) return;
    var block = p.block;
    var doneInBlock = clamp(state.doneSets - p.blockStart, 0, blockTotalSets(block));
    var sig = block.id + "|" + state.status + "|" + doneInBlock + "|" + block.rounds + "|" + block.setsPerRound + "|" + block.movements.length;
    if (sig === ui.mapSig) return;
    ui.mapSig = sig;

    var stepsPer = Math.max(1, block.setsPerRound);
    var rounds = Math.max(1, block.rounds);
    dots.forEach(function (dot) {
      var m = Number(dot.getAttribute("data-m"));
      var r = Number(dot.getAttribute("data-r"));
      var k = Number(dot.getAttribute("data-k"));
      var index = (m * rounds + (r - 1)) * stepsPer + (k - 1);
      dot.classList.toggle("done", index < doneInBlock);
      dot.classList.toggle("current", index === doneInBlock && state.status !== "done");
    });
    $$(".map-row", appEl).forEach(function (row) {
      var active = Number(row.getAttribute("data-m")) === p.movementIndex &&
        Number(row.getAttribute("data-r")) === p.round;

  /* ------------------------------------------------------------------ island */
  function shortMovement(name) {
    var clean = String(name || "MOV").replace(/[^A-Za-z0-9]/g, "");

  }
  function compactLabel(group, p) {
    if (group === "done") return "DONE";
    return shortMovement(movementName(p.movement));
  }
  function compactTime(group) {
    if (group === "done") return totalSets() + " SETS";
    if (group === "work") return fmt(remainingSetNow());
    if (group === "rest") return fmt(remainingNow());
    return "READY";
  }
  function islandActionsHTML(group, p) {
    if (group === "ready") {
      if (p.movement.endCondition === "time") {
        return '<button class="primary" data-act="primary">Start · ' + fmt(p.movement.target) + '</button>';
      }
      var rest = upcomingRest();
      return '<button class="primary" data-act="primary">' +
        (rest ? (rest.dur > 0 ? "Set done · " + fmt(rest.dur) : "Set done") : "Finish session") +
      '</button>';
    }
    if (group === "work") {
      var workRest = upcomingRest();
      return '<button class="primary" data-act="primary">' +
        (workRest ? (workRest.dur > 0 ? "Set done · " + fmt(workRest.dur) : "Set done") : "Finish session") +
      '</button>';
    }
    if (group === "rest") {
      return '<button class="primary" data-act="primary">' +
        (state.status === "paused" ? "Resume" : "Pause") +
      '</button><button class="ghost" data-act="skip">Skip</button>';

  function syncIsland(force) {
    var group = groupOf();
    var session = activeSession();
    var p = currentPos();
    var accent = accentKind();
    if (!p) return;

    var gate = group === "gate";
    islandEl.classList.toggle("dormant", gate);
    if (gate) {
      ui.expanded = false;
      islandEl.classList.remove("expanded");
      screenEl.classList.remove("island-open");

      islandEl.style.height = "37px";

    }

    islandEl.classList.toggle("expanded", ui.expanded);
    screenEl.classList.toggle("island-open", ui.expanded);
    islandEl.style.setProperty("--phase", PHASE_COLORS[accent] || PHASE_COLORS.set);

    var compactW = group === "ready" ? 200 : group === "done" ? 190 : 214;
    islandEl.style.width = (ui.expanded ? 380 : compactW) + "px";
    islandEl.style.height = (ui.expanded ? 186 : 37) + "px";
    islandEl.style.borderRadius = (ui.expanded ? 44 : 22) + "px";

    setText($("[data-el='icLabel']", islandEl), compactLabel(group, p));
    setText($("[data-el='icTime']", islandEl), compactTime(group));

    var iePhase, ieSub, ieTime, ieNext, progress = 0, small = false;
    var total = sessionTotals(session).sets;
    var positionText = positionLabel(p.block, p);

    if (group === "ready") {
      var rest = upcomingRest();
      if (rest) {
        if (rest.dur <= 0) {
          iePhase = "NO REST";
          ieTime = "NEXT";
          ieNext = movementName(p.movement).toUpperCase() + (positionText ? " · " + positionText : "");
          small = true;
        } else {
          iePhase = restKindLabel(rest.kind);
          ieTime = fmt(rest.dur);
          ieNext = movementName(p.movement).toUpperCase() + (positionText ? " · " + positionText : "");
        }
      } else {
        iePhase = "LAST SET";
        ieTime = "FINISH";
        ieNext = movementName(p.movement).toUpperCase() + " · NO REST AFTER";
        small = true;
      }
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
    } else if (group === "work") {
      iePhase = "WORK";
      ieTime = fmt(remainingSetNow());
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
      var workRest = upcomingRest();
      ieNext = workRest ? (workRest.dur > 0 ? "REST " + fmt(workRest.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
      progress = setProgress();
    } else if (group === "rest") {
      iePhase = state.status === "paused" ? "PAUSED" : restKindLabel(state.restKind);
      ieTime = fmt(remainingNow());
      ieSub = "BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name.toUpperCase();
      ieNext = state.rest ? state.rest.label : "";
      progress = restProgress();
    } else {
      iePhase = "DONE";
      ieSub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " + plural(sessionTotals(session).movements, "MOVEMENT", "MOVEMENTS");
      ieTime = "DONE";
      ieNext = plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      progress = 1;

    setText($("[data-el='iePhase']", islandEl), iePhase);
    setText($("[data-el='ieSub']", islandEl), ieSub);
    var ieTimeEl = $("[data-el='ieTime']", islandEl);
    setText(ieTimeEl, ieTime);
    if (ieTimeEl) ieTimeEl.classList.toggle("small", small);
    setText($("[data-el='ieNext']", islandEl), ieNext);

    var sig = activeSessionId + "|" + group + "|" + state.status + "|" + state.doneSets + "|" +
      (state.restKind || "") + "|" + session.blocks.length + "|" + p.block.id + "|" +
      p.movement.id + "|" + p.movement.endCondition + "|" + p.movement.target;
    if (force || sig !== ui.islandSig) {

          setDone();

  /* ------------------------------------------------------------------ events */
  var holdDelay = 0;
  var holdRepeat = 0;
  var holdButton = null;
  var holdFired = false;
  var suppressStepClick = false;

  function liveStepButton(source) {
    if (!source) return null;
    var selector = '[data-act="' + source.getAttribute("data-act") + '"]';
    var key = source.getAttribute("data-key");
    var dir = source.getAttribute("data-dir");
    if (key != null) selector += '[data-key="' + key + '"]';
    if (dir != null) selector += '[data-dir="' + dir + '"]';
    return appEl.querySelector(selector);
  }
  function stopStepHold() {
    if (holdDelay) {
      clearTimeout(holdDelay);
      holdDelay = 0;
    }
    if (holdRepeat) {
      clearInterval(holdRepeat);
      holdRepeat = 0;
    }
    if (holdFired) suppressStepClick = true;
    holdButton = null;
    holdFired = false;
  }
  function repeatStep() {
    if (!holdButton) {
      stopStepHold();
      return;
    }
    if (isLocked()) {
      stopStepHold();
      return;
    }
    var live = liveStepButton(holdButton);
    if (!live || live.disabled) {
      stopStepHold();
      return;
    }
    holdFired = true;
    handleAct(live.getAttribute("data-act"), live);
  }
  function startStepHold(source) {
    stopStepHold();
    if (!source || source.disabled || isLocked()) return;
    suppressStepClick = false;
    holdButton = source;
    holdFired = false;
    holdDelay = setTimeout(function () {
      holdDelay = 0;
      repeatStep();
      if (!holdButton) return;
      holdRepeat = setInterval(repeatStep, 100);
    }, 500);
  }

  appEl.addEventListener("pointerdown", function (e) {
    var button = e.target.closest ? e.target.closest(".sstep button") : null;
    if (!button) return;
    if (e.button !== undefined && e.button > 0) return;
    startStepHold(button);
  });
  document.addEventListener("pointerup", stopStepHold);
  document.addEventListener("pointercancel", stopStepHold);
  window.addEventListener("blur", stopStepHold);

  document.addEventListener("click", function (e) {
    var inIsland = !!(e.target.closest && e.target.closest("#island"));
    var actEl = e.target.closest ? e.target.closest("[data-act]") : null;
    if (actEl) {
      if (suppressStepClick && actEl.closest(".sstep")) {
        suppressStepClick = false;
        return;
      }
      suppressStepClick = false;
      var act = actEl.getAttribute("data-act");
      var switched = inIsland && ui.tab === "sessions" && (act === "primary" || act === "skip");
      if (switched) {
        flushEdit();
        ui.tab = "timer";
        ui.route = { kind: "list" };
        ui.deleteArmed = null;
        ui.editingNumber = null;

      handleAct(act, actEl);
      if (switched) render(false);
      if (!inIsland && ui.expanded) {
        ui.expanded = false;
        syncIsland(true);
      }
      return;
    }
    if (!inIsland && ui.expanded) {
      ui.expanded = false;
      syncIsland(true);
    }
  });

  var dragState = null;
  var dragGhost = null;

    dragGhost = null;
    $$("[data-drag-row].dragging, [data-drag-row].drop-target", appEl).forEach(function (row) {
      row.classList.remove("dragging");
      row.classList.remove("drop-target");
    });
  }
  function moveDragGhost(e) {
    if (!dragGhost) return;
    var x = e.clientX;
    var y = e.clientY;
    if (!x && !y) return;
    dragGhost.style.left = (x + 14) + "px";
    dragGhost.style.top = (y - 34) + "px";

  appEl.addEventListener("dragstart", function (e) {
    var handle = e.target.closest ? e.target.closest("[data-drag-handle]") : null;
    if (!handle || isLocked()) {
      e.preventDefault();
      return;
    }
    var row = handle.closest("[data-drag-row]");
    if (!row) return;
    dragState = { kind: row.getAttribute("data-drag-row"), id: row.getAttribute("data-id") };
    row.classList.add("dragging");
    var card = row.querySelector(".block-open") || row.querySelector(".session-card");
    if (card) {
      var rect = card.getBoundingClientRect();
      dragGhost = card.cloneNode(true);
      dragGhost.classList.add("drag-ghost");
      dragGhost.removeAttribute("data-act");
      dragGhost.style.width = rect.width + "px";
      dragGhost.style.left = ((e.clientX || rect.left) + 14) + "px";
      dragGhost.style.top = ((e.clientY || rect.top) - 34) + "px";
      document.body.appendChild(dragGhost);
    }
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragState.id);
      var blank = new Image();
      blank.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      e.dataTransfer.setDragImage(blank, 0, 0);
    }
  });
  appEl.addEventListener("drag", moveDragGhost);
  appEl.addEventListener("dragover", function (e) {
    moveDragGhost(e);
    if (!dragState) return;
    var row = e.target.closest ? e.target.closest("[data-drag-row]") : null;
    if (!row || row.getAttribute("data-drag-row") !== dragState.kind) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";

  });
  appEl.addEventListener("drop", function (e) {
    if (!dragState) return;

    var state = dragState;
    clearDrag();
    if (row && row.getAttribute("data-drag-row") === state.kind) {
      reorderRow(state.kind, state.id, row.getAttribute("data-id"));
    }
  });
  appEl.addEventListener("dragend", clearDrag);

  islandEl.addEventListener("click", function (e) {
    if (e.target.closest("[data-act]")) return;
    if (groupOf() === "gate") return;
    e.stopPropagation();
    ui.expanded = !ui.expanded;
    syncIsland(true);
  });
  islandEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (groupOf() === "gate") return;
      ui.expanded = !ui.expanded;
      syncIsland(true);
    }
  });

  appEl.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="sessionName"]') && ui.route.kind === "session") {
      var session = findSession(ui.route.id);
      if (session) {
        session.name = liveName(t.value);
        markEdited(session);
      }
    } else if (t.matches('[data-el="blockName"]') && ui.route.kind === "block") {
      var blockSession = findSession(ui.route.sessionId);
      var block = routeBlock(ui.route);
      if (block) {
        block.name = liveName(t.value);
        if (!ui.route.staged) markEdited(blockSession);
      }
    } else if (t.matches('[data-el="movementName"]') && ui.route.kind === "movement") {
      var movement = findMovement(ui.route.id);
      if (movement) {
        movement.name = liveName(t.value);
        markEdited(null);
      }
    } else if (t.matches('[data-el="pickerName"]') && ui.route.kind === "picker") {
      if (!ui.picker) ui.picker = pickerDefault();
      ui.picker.name = liveName(t.value);
      var addButton = $('[data-act="add-new-movement"]', appEl);
      if (addButton) addButton.disabled = !ui.picker.name.trim();
    } else if (t.matches('[data-el="numberInput"]')) {
      ui.numberDraft = t.value;
    } else if (t.matches('[data-el="calStart"], [data-el="calEnd"], [data-el="calLabel"]')) {
      if (!ui.calSheet || ui.calSheet.kind !== "exceptions") return;
      if (!ui.calExceptionDraft) ui.calExceptionDraft = { start: "", end: "", label: "" };
      if (t.matches('[data-el="calStart"]')) ui.calExceptionDraft.start = t.value;
      else if (t.matches('[data-el="calEnd"]')) ui.calExceptionDraft.end = t.value;
      else ui.calExceptionDraft.label = t.value;
    }
  });

  appEl.addEventListener("focusout", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="sessionName"]')) {
      commitSessionName(t);
    } else if (t.matches('[data-el="blockName"]')) {
      commitBlockName(t);
    } else if (t.matches('[data-el="movementName"]')) {
      commitMovementName(t);
    } else if (t.matches('[data-el="pickerName"]') && ui.picker) {
      ui.picker.name = trimName(t.value, "");
      if (t.value !== ui.picker.name) t.value = ui.picker.name;
      var addButton = $('[data-act="add-new-movement"]', appEl);
      if (addButton) addButton.disabled = !ui.picker.name;
    } else if (t.matches('[data-el="numberInput"]')) {
      commitNumberInput(t, false);
    }
  });

  appEl.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-el="pickerName"]') && e.key === "Enter") {
      e.preventDefault();
      queueNewMovementToBlock();
      return;
    }
    if ((t.matches('[data-el="sessionName"]') || t.matches('[data-el="blockName"]') ||
         t.matches('[data-el="movementName"]')) && e.key === "Enter") {
      e.preventDefault();
      t.blur();
      return;
    }
    if (t.matches('[data-el="numberInput"]')) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        commitNumberInput(t, true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        var target = resolveEditTarget(ui.editingNumber ? ui.editingNumber.key : "");
        if (target && ui.editingNumber) t.value = String(target.value == null ? "" : target.value);
        ui.editingNumber = null;
        t.blur();
      }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (ui.calSheet) {
        ui.calSheet = null;
        ui.calDeleteArmed = null;
        ui.calExceptionDraft = null;
        ui.calExceptionError = "";
        render(false);
        return;
      }
      if (ui.expanded) {
        ui.expanded = false;
        syncIsland(true);
        return;
      }
      if (ui.tab === "sessions") {
        if (ui.route.kind === "movement") backToLibrary();
        else if (ui.route.kind === "library") backToList();
        else if (ui.route.kind === "picker") cancelPicker();
        else if (ui.route.kind === "blockMovement") backToBlock(ui.route.sessionId, ui.route.blockId);
        else if (ui.route.kind === "block") backToSession(ui.route.sessionId);
        else if (ui.route.kind === "session") backToList();
        else {
          flushEdit();
          ui.tab = "timer";
          render(false);
        }
      }
    }
    if (e.key === " ") {
      var t = e.target;
      if (t && t.closest && t.closest("button, input, textarea")) return;
      if (ui.tab !== "timer") return;
      if (state.status === "resting" || state.status === "paused") {
        e.preventDefault();
        state.status === "resting" ? pauseRest() : resumeRest();
      }
    }
  });

  window.addEventListener("beforeunload", function () {
    commitEdit();
  });

  /* ------------------------------------------------------------------ timer */
  var frame = function (now) {
    if (state.status === "resting") {
      var rem = (state.deadline - now) / 1000;
      if (rem <= 0) finishRest(true);
    } else if (state.status === "performing") {
      if (state.setDeadline - now <= 0) setDone();
    }
    sync();
    requestAnimationFrame(frame);
  };
  // A display link drives the smooth countdown, but a headless check has none.
  // The same 200 ms deadline check the app uses keeps the deadline honest.
  setInterval(function () {
    if (state.status === "resting" && state.deadline - performance.now() <= 0) {
      finishRest(true);
    } else if (state.status === "performing" && state.setDeadline - performance.now() <= 0) {
      setDone();
    }
  }, 200);

  /* ------------------------------------------------------------------ fit + boot */
  function fit() {
    var availH = window.innerHeight - 126;
    var availW = window.innerWidth - 28;
    var s = Math.min(1, availH / 880, availW / 430);
    s = Math.max(0.5, s);
    frameEl.style.transform = "scale(" + s + ")";
    stageEl.style.height = (880 * s) + "px";
    stageEl.style.width = (430 * s) + "px";
  }
  window.addEventListener("resize", fit);

  function boot() {
    resetSession();
    render(false);
    fit();
    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
</html>
