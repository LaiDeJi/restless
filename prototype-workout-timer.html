<title>Restless — session rest timer</title>
<!--
  PROTOTYPE — a session rest timer built around the Dynamic Island.

  Model:
    A session is an ordered list of blocks. A block holds movements from the
    reusable library, a number of rounds, a number of sets per round, a set
    rest, and a round rest. Every set ends on one of three conditions: a rep
    target counted on the watch, a timed hold on the phone, or a manual tap.

    Each round runs every movement in order for its sets-per-round sets. A set
    rest follows every set except the last of its round; a round rest follows
    the last set of a round. A block with one movement is that movement
    repeated; two or more movements repeat the group. A sequential pair is two
    blocks.

    A timed set runs a work countdown in the performing phase, then starts the
    same rest as any other set. The final set of the final block has no rest.

  The key interaction: tap the Dynamic Island → Set done. That starts the right rest
  without reopening the app. The phone screen is the detailed view of the same state.

  Navigation: TIMER and SESSIONS bottom tabs. SESSIONS lists saved sessions and the
  MOVEMENTS library. A session opens its ordered blocks; a block edits its rounds,
  sets per round, rests, and movements. A movement opens its end condition and target.
  Values persist in localStorage. Rounds and sets per round are unbounded; rests stay
  15–600 seconds in 15s steps, except a block's set rest may be 0.

  The add-movement picker can also create a library movement from a typed name: it
  is appended with the selected set end and target, carries no watch profile, and is
  reused when a matching name already exists. Dragging a block or movement by its
  grip floats an opaque card under the pointer while the source slot dims and the row
  under the pointer is outlined.

  The watch buttons in the timer and recording screens are a prototype stand-in for a
  real watch. They let you walk the armed, unavailable, counting, received, and failed
  states without a device.

  The timer's ↺ restart arms on the first tap (TAP AGAIN, amber) and applies the
  restart on the second; it appears once a set is done and stays available through a
  set or rest. The block editor appends an unused library movement in one tap under
  ADD FROM LIBRARY. The footer toggle previews the iOS 26 Liquid Glass chrome and the
  flat iOS 18–25 fallback on EDIT, restart, and the SESSIONS add control.

  Not production code. Double-click to open.
-->

  /* ---------------------------------------------------------------- phone hardware */
  .phone {

    height: 880px;
    padding: 14px;

      linear-gradient(148deg, #5a5a60 0%, #1b1b1f 22%, #26262b 46%, #101013 72%, #3b3b41 100%);
    box-shadow:
      0 70px 110px -40px rgba(0,0,0,.95),

  }
  .side-btn {

  .side-btn.vol-up   { left: -3px; top: 176px; height: 58px; }
  .side-btn.vol-down { left: -3px; top: 246px; height: 58px; }
  .side-btn.mute     { left: -3px; top: 118px; height: 32px; }
  .side-btn.power    { right: -3px; top: 200px; height: 92px; }

  .screen {
    position: relative;
    width: 402px;
    height: 852px;
    border-radius: 58px;
    overflow: hidden;
    background: #070708;
    isolation: isolate;
  }
  .app { position: absolute; inset: 0; z-index: 10; }

  /* status bar */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 56px;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;

    position: absolute;

  /* ---------------------------------------------------------------- dynamic island */
  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 37px;
    border-radius: 22px;
    background: #000;
    border: 1px solid rgba(255,255,255,.06);
    z-index: 50;
    overflow: hidden;
    cursor: pointer;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    box-shadow:
      0 3px 12px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,255,255,.02);
    transition:
      width .52s cubic-bezier(.32,.72,0,1),
      height .52s cubic-bezier(.32,.72,0,1),
      border-radius .42s cubic-bezier(.32,.72,0,1);
    --phase: #C8FF4D;
  }
  #island:focus, #island:focus-visible { outline: none !important; }
  .island.dormant { cursor: default; }
  .island.dormant .ic,
  .island.dormant .ie { opacity: 0; }

  .ic {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    opacity: 1;
    transition: opacity .18s ease;
  }
  .island.expanded .ic { opacity: 0; pointer-events: none; transition-duration: .08s; }
  .ic-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ic-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--phase);
    box-shadow: 0 0 7px color-mix(in srgb, var(--phase) 60%, transparent);
    flex: 0 0 auto;
  }
  .ic-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .13em;
    white-space: nowrap;
  }
  .ic-time {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .ie {
    position: absolute;
    inset: 0;
    padding: 15px 20px 16px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .16s ease, visibility 0s linear .2s;
    color: #fff;
  }
  .island.expanded .ie {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .24s ease .1s, visibility 0s;
  }
  .ie-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ie-phase { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .16em; white-space: nowrap; }
  .ie-phase i { width: 7px; height: 7px; border-radius: 50%; background: var(--phase); box-shadow: 0 0 7px color-mix(in srgb, var(--phase) 55%, transparent); flex: 0 0 auto; }
  .ie-sub {
    font-size: 11px;
    letter-spacing: .07em;
    color: rgba(255,255,255,.44);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ie-time {
    font-size: 50px;
    font-weight: 600;
    letter-spacing: -.05em;
    line-height: 1;
    margin-top: 9px;
    font-variant-numeric: tabular-nums;
  }
  .ie-time.small { font-size: 34px; letter-spacing: .01em; }
  .ie-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); margin-top: 10px; overflow: hidden; }
  .ie-bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--phase); }
  .ie-next { margin-top: 9px; font-size: 11px; letter-spacing: .1em; color: rgba(255,255,255,.44); white-space: nowrap; }
  .ie-actions { display: flex; gap: 8px; margin-top: auto; }
  .ie-actions button {
    flex: 1;
    height: 34px;
    border-radius: 17px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    white-space: nowrap;
  }
  .ie-actions .primary { background: #fff; color: #000; }
  .ie-actions .primary:active { background: rgba(255,255,255,.85); }
  .ie-actions .ghost { background: rgba(255,255,255,.13); color: #fff; }
  .ie-actions .ghost:active { background: rgba(255,255,255,.22); }

  @keyframes islandPulse {
    0% { transform: translateX(-50%) scale(1); }
    38% { transform: translateX(-50%) scale(1.035); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* ---------------------------------------------------------------- rest timer screen */
  .app-screen {
    --accent: #C8FF4D;
    --glow: rgba(200,255,77,.26);
    --glow-soft: rgba(200,255,77,.07);
    position: relative;
    height: 100%;

    overflow: hidden;
    transition: background .5s ease;

  .app-screen[data-phase="round"] {

    --glow: rgba(255,184,77,.24);
    --glow-soft: rgba(255,184,77,.08);
    background: #0a0805;
  }
  .app-screen::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 160px;
    width: 420px;
    height: 420px;
    transform: translateX(-50%);
    background: radial-gradient(circle, var(--glow-soft) 0%, transparent 66%);
    pointer-events: none;
    transition: background .5s;
  }

  .app-head {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    flex: 0 0 auto;
  }
  .brand {

  .brand-dot {

  .edit-pill {
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.035);

    font-size: 13px;
    font-weight: 600;
    letter-spacing: .09em;

  }
  .edit-pill:active { background: rgba(255,255,255,.1); }
  .head-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
  }
  .restart-pill {
    width: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: rgba(255,255,255,.72);
  }
  .restart-pill svg { width: 18px; height: 18px; }
  .edit-pill.chrome-glass { color: rgba(255,255,255,.86); }
  .add-pill.chrome-glass { color: rgba(255,255,255,.86); }
  .restart-pill.armed {
    width: auto;
    padding: 0 14px;
    border-radius: 999px;

  .pos {
    position: relative;

    min-height: 24px;
    margin-top: 6px;

  .pos em { font-style: normal; color: rgba(255,255,255,.26); }

  .pos-up {

  }
  .pos-done {
    color: var(--accent);

  }

  .center-stack {
    position: relative;

    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;

  /* The timer stage pins the ring's centre to its own vertical middle. The
     top chrome and the lower content are positioned against that fixed centre,
     so neither a wrapping position strip nor a taller set map moves the ring.
     Tall content makes the stage scroll. */
  .timer-screen { padding-bottom: 92px; }
  .timer-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding-top: calc(var(--stage-h, 696px) / 2 + 170px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .timer-stage::-webkit-scrollbar { display: none; }
  .timer-chrome {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;

  .timer-stage > .hero {
    position: absolute;
    top: calc(var(--stage-h, 696px) / 2);
    left: 50%;
    transform: translate(-50%, -50%);

  }
  .timer-lower {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .timer-lower .actions {
    margin-top: auto;
    width: 100%;
  }
  .hero {
    position: relative;
    width: 300px;
    height: 300px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .rt-ring {
    position: absolute;
    width: 300px;
    height: 300px;

  /* ---------------------------------------------------------------- setup sheet */

<body>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ config */
  var STORAGE_KEY = "restless.sessions.v4";

  var LEGACY_KEY = "rounds.presets.v1";

  var DEFAULT_SET_REST = 60;
  var DEFAULT_ROUND_REST = 120;

  var MAP_LIMITS = { rounds: 12, perRound: 12, dots: 72 };
  var PHASE_COLORS = {
    set: "#C8FF4D",

  };
  var ICON = {
    skip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 6.1v11.8a1 1 0 0 0 1.56.83l8.06-5.9a1 1 0 0 0 0-1.66L6.56 5.27A1 1 0 0 0 5 6.1z"/><rect x="16.6" y="4.9" width="3" height="14.2" rx="1.3"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="7" r="1.6"/><circle cx="15" cy="7" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="17" r="1.6"/><circle cx="15" cy="17" r="1.6"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M6.5 7l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/><path d="M10 11v6M14 11v6"/></svg>',
    restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6 9.6a7.6 7.6 0 1 1 1.1 7.2"/><path d="M4.3 4.7v5.2h5.2"/></svg>',
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.6 1.6M9 2.5h6"/></svg>',
    sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4.5"/></svg>'
  };

  /* ------------------------------------------------------------------ demo data */
  var DEMO_LIBRARY = [
    { id: "m-bench", name: "Bench press", group: "Chest", defaultCondition: "reps", defaultTarget: 10, profile: { axis: "FOREARM", rise: 42, fall: 46, minPeriod: 0.92 } },
    { id: "m-incline", name: "Incline press", group: "Chest", defaultCondition: "reps", defaultTarget: 10, profile: { axis: "FOREARM", rise: 39, fall: 44, minPeriod: 0.98 } },
    { id: "m-curl", name: "Curl", group: "Biceps", defaultCondition: "reps", defaultTarget: 12, profile: { axis: "FOREARM", rise: 38, fall: 41, minPeriod: 0.86 } },
    { id: "m-pushdown", name: "Pushdown", group: "Triceps", defaultCondition: "reps", defaultTarget: 12, profile: { axis: "FOREARM", rise: 36, fall: 43, minPeriod: 0.88 } },
    { id: "m-plank", name: "Plank", group: "Core", defaultCondition: "time", defaultTarget: 60, profile: { axis: "FOREARM", rise: 21, fall: 24, minPeriod: 1.4 } },
    { id: "m-deadhang", name: "Dead hang", group: "Back", defaultCondition: "manual", defaultTarget: null, profile: null },
    { id: "m-lateral", name: "Lateral raise", group: "Shoulders", defaultCondition: "reps", defaultTarget: 15, profile: { axis: "FOREARM", rise: 33, fall: 37, minPeriod: 0.94 } }
  ];
  var DEMO_SESSIONS = [
    {
      id: "s-chest",
      name: "Chest",
      blocks: [{
        id: "b-chest",
        name: "Chest",
        rounds: 4,
        setsPerRound: 4,
        setRest: 60,
        roundRest: 120,
        movements: [
          { id: "bm-bench", movementId: "m-bench", endCondition: "reps", target: 10 }
        ]
      }]
    },
    {
      id: "s-arms",
      name: "Arms",
      blocks: [{
        id: "b-arms",
        name: "Arms",
        rounds: 2,
        setsPerRound: 1,
        setRest: 30,
        roundRest: 120,
        movements: [
          { id: "bm-curl", movementId: "m-curl", endCondition: "reps", target: 12 },
          { id: "bm-pushdown", movementId: "m-pushdown", endCondition: "reps", target: 12 }
        ]
      }]
    },
    {
      id: "s-core",
      name: "Core",
      blocks: [{
        id: "b-core",
        name: "Core",
        rounds: 1,
        setsPerRound: 3,
        setRest: 45,
        roundRest: 60,
        movements: [
          { id: "bm-plank", movementId: "m-plank", endCondition: "time", target: 60 }
        ]
      }]
    }
  ];

  var sessions, movements, activeSessionId;
  var state = {
    doneSets: 0,
    status: "notStarted",   // notStarted | ready | performing | resting | paused | done
    restKind: null,        // "set" | "round"
    duration: 0,
    remaining: 0,
    deadline: 0,
    setDuration: 0,
    setDeadline: 0,
    reps: 0,
    watchReachable: true,
    rest: null
  };
  var ui = {
    tab: "timer",
    route: { kind: "list" },
    expanded: false,
    deleteArmed: null,
    editingNumber: null,
    numberDraft: "",
    focusName: false,
    focusNumber: false,
    commitTimer: 0,
    pendingEdit: false,
    pendingReset: false,
    mapSig: "",
    islandSig: "",
    debugSig: "",
    record: null,
    draft: null,
    stagedBlock: null,
    restartArmed: false,
    restartStatus: ""
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var appEl = $("#app");
  var screenEl = $("#screen");
  var islandEl = $("#island");
  var debugEl = $("#debug");
  var stageEl = $("#stage");
  var frameEl = $("#phoneFrame");

  var textCache = new WeakMap();

  initData();

  /* ------------------------------------------------------------------ tiny helpers */
  function uid(prefix) {
    return (prefix || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function safeMul(a, b) {
    var v = a * b;
    if (!isFinite(v) || v > Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
    return v;
  }
  function safeAdd(a, b) {
    var v = a + b;
    if (!isFinite(v) || v > Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
    return v;
  }
  function safeCount(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    v = Math.floor(v);
    if (v < 1) return 1;
    if (v > Number.MAX_SAFE_INTEGER) return fallback;
    return v;
  }
  function safeRest(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    return clamp(Math.round(v / 15) * 15, LIMITS.setRest[0], LIMITS.setRest[1]);
  }
  function safeSetRest(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    if (v <= 0) return 0;
    return safeRest(v, fallback);
  }
  function safeTime(value, fallback) {
    var v = Number(value);
    if (!isFinite(v)) return fallback;
    return clamp(Math.round(v / 15) * 15, LIMITS.time[0], LIMITS.time[1]);
  }
  function safeTarget(condition, value, fallback) {
    if (condition === "manual") return null;
    if (condition === "time") return safeTime(value, fallback == null ? 60 : fallback);
    return Math.max(1, safeCount(value, fallback == null ? 10 : fallback));
  }
  function trimName(value, fallback) {
    var name = String(value == null ? "" : value).trim().slice(0, 18);
    return name || fallback;
  }
  function liveName(value) {
    return String(value == null ? "" : value).slice(0, 18);
  }
  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function idOk(value, used) {
    return typeof value === "string" && /^[A-Za-z0-9_-]+$/.test(value) && !used[value];
  }
  function isCondition(value) { return CONDITIONS.indexOf(value) >= 0; }

  /* ------------------------------------------------------------------ model lookups */
  function findSession(id) {
    if (ui.draft && ui.draft.id === id) return ui.draft;
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === id) return sessions[i];
    return null;
  }
  function findBlock(session, id) {
    if (!session) return null;
    for (var i = 0; i < session.blocks.length; i++) if (session.blocks[i].id === id) return session.blocks[i];
    return null;
  }
  function findBlockMovement(block, id) {
    if (!block) return null;
    for (var i = 0; i < block.movements.length; i++) if (block.movements[i].id === id) return block.movements[i];
    return null;
  }
  /// A staged block lives outside `session.blocks` until DONE. Every block,
  /// movement, and picker route resolves its block through this one helper so a
  /// staged edit never touches the session or schedules a save.
  function routeBlock(route) {
    if (!route) return null;
    if (route.staged && ui.stagedBlock && ui.stagedBlock.id === route.blockId) return ui.stagedBlock;
    var session = findSession(route.sessionId);
    return findBlock(session, route.blockId);
  }
  function discardStagedBlock() {
    ui.stagedBlock = null;
  }
  function findMovement(id) {
    for (var i = 0; i < movements.length; i++) if (movements[i].id === id) return movements[i];
    return null;
  }
  function movementName(bm) {
    var m = bm ? findMovement(bm.movementId) : null;
    return m ? m.name : "Missing movement";
  }
  function movementGroup(bm) {
    var m = bm ? findMovement(bm.movementId) : null;
    return m ? m.group : "Untitled group";
  }
  function movementProfile(bm) {
    var m = bm ? findMovement(bm.movementId) : null;
    return m ? m.profile : null;
  }
  function activeSession() {
    return findSession(activeSessionId) || sessions[0] || null;
  }

    else if (draft.condition === "time") next = clamp((draft.target || 15) + Number(dir) * 15, LIMITS.time[0], LIMITS.time[1]);
    else return;
    if (next === draft.target) return;
    draft.target = next;
    render(false);
  }

  /* ------------------------------------------------------------------ state changes */
  function resetSession() {
    state.doneSets = 0;
    state.status = "notStarted";
    state.restKind = null;
    state.duration = 0;
    state.remaining = 0;
    state.deadline = 0;
    state.setDuration = 0;
    state.setDeadline = 0;
    state.reps = 0;
    state.rest = null;
    ui.restartArmed = false;
    ui.restartStatus = "";
  }
  function startSession() {
    if (state.status !== "notStarted") return;
    flushEdit();
    ui.expanded = false;
    state.doneSets = 0;
    state.status = "ready";
    state.restKind = null;
    state.duration = 0;
    state.remaining = 0;
    state.deadline = 0;
    state.setDuration = 0;
    state.setDeadline = 0;
    state.reps = 0;
    state.rest = null;
    render(true);
  }
  function setDone() {
    if (state.status !== "ready" && state.status !== "performing") return;
    flushEdit();
    var total = totalSets();
    if (state.doneSets >= total) return;

    var rest = upcomingRest();
    ui.expanded = false;
    ui.editingNumber = null;
    state.setDuration = 0;
    state.setDeadline = 0;
    state.reps = 0;

    if (!rest) {
      state.doneSets = total;
      state.status = "done";
      state.restKind = null;
      state.remaining = 0;
      state.duration = 0;
      state.deadline = 0;
      state.rest = null;
      render(true);
      return;
    }

    state.doneSets++;
    state.rest = rest;
    state.restKind = rest.kind;
    state.duration = rest.dur;
    state.remaining = rest.dur;
    state.deadline = performance.now() + rest.dur * 1000;

    if (rest.dur <= 0) {
      state.status = "ready";
      state.rest = null;
      state.restKind = null;
      state.remaining = 0;
      state.duration = 0;
      state.deadline = 0;
      render(true);
      return;
    }

    state.status = "resting";
    render(true);
  }
  function startSet() {
    if (state.status !== "ready") return;
    var p = currentPos();
    if (!p || !p.movement || p.movement.endCondition !== "time") return;
    if (!p.movement.target) return;
    flushEdit();
    ui.expanded = false;
    state.status = "performing";
    state.setDuration = p.movement.target;
    state.setDeadline = performance.now() + p.movement.target * 1000;
    state.reps = 0;
    render(true);
  }
  function finishRest(pulse) {
    if (state.status !== "resting" && state.status !== "paused") return;
    state.status = "ready";
    state.remaining = 0;
    state.duration = 0;
    state.restKind = null;
    state.deadline = 0;
    state.rest = null;
    state.reps = 0;
    if (pulse) {
      islandEl.classList.remove("pulse");
      void islandEl.offsetWidth;
      islandEl.classList.add("pulse");
    }
    render(true);
  }
  function skipRest() {
    if (state.status !== "resting" && state.status !== "paused") return;
    flushEdit();
    finishRest(false);
  }
  function pauseRest() {
    if (state.status !== "resting") return;
    flushEdit();
    if (state.status !== "resting") return;
    state.remaining = remainingNow();
    state.deadline = 0;
    state.status = "paused";
    sync();
  }
  function resumeRest() {
    if (state.status !== "paused") return;
    flushEdit();
    if (state.status !== "paused") return;
    state.status = "resting";
    state.deadline = performance.now() + state.remaining * 1000;
    sync();
  }
  function again() {
    flushEdit();
    resetSession();
    state.status = "ready";
    ui.tab = "timer";
    ui.route = { kind: "list" };
    ui.expanded = false;
    render(true);
  }
  function watchReady(p) {
    if (!state.watchReachable) return false;
    var movement = p && p.movement ? findMovement(p.movement.endCondition === "reps" ? p.movement.movementId : null) : null;
    return !!(movement && movement.profile);
  }
  function watchRep() {
    if (state.status !== "ready") return;
    var p = currentPos();
    if (!p || !p.movement || p.movement.endCondition !== "reps" || !watchReady(p)) return;
    var target = p.movement.target || 1;
    state.reps = Math.min(target, state.reps + 1);
    if (state.reps >= target) {
      setDone();
    } else {
      render(false);
    }
  }
  function watchDrop() {
    state.watchReachable = false;
    render(false);
  }
  function watchConnect() {
    state.watchReachable = true;
    state.reps = 0;
    render(false);
  }

  /* ------------------------------------------------------------------ numeric editing */
  function startEditNumber(key) {
    if (isLocked()) return;
    var target = resolveEditTarget(key);
    if (!target || target.value == null) return;
    ui.editingNumber = { scope: ui.route.kind, key: key };
    ui.numberDraft = String(target.value);
    ui.focusNumber = true;
    render(false);
  }
  function resolveEditTarget(key) {
    if (ui.route.kind === "block") {
      var block = routeBlock(ui.route);
      if (!block) return null;
      return { object: block, key: key, value: block[key], condition: null };
    }
    if (ui.route.kind === "blockMovement") {
      var b2 = routeBlock(ui.route);
      var bm = findBlockMovement(b2, ui.route.movementId);
      if (!bm || key !== "target") return null;
      return { object: bm, key: "target", value: bm.target, condition: bm.endCondition };
    }
    if (ui.route.kind === "movement") {
      var movement = findMovement(ui.route.id);
      if (!movement || (key !== "defaultTarget" && key !== "target")) return null;
      return { object: movement, key: "defaultTarget", value: movement.defaultTarget, condition: movement.defaultCondition };
    }
    return null;
  }
  function commitNumberInput(input, immediate) {
    if (!ui.editingNumber) return;
    var target = resolveEditTarget(ui.editingNumber.key);
    var editing = ui.editingNumber;
    ui.editingNumber = null;
    if (!target) return;
    var current = target.value;
    var raw = String(input.value == null ? "" : input.value).trim();
    var next = current;
    if (raw) {
      if (editing.key === "rounds" || editing.key === "setsPerRound") {
        next = safeCount(raw, current);
        if (editing.key === "rounds" && target.object.movements && target.object.movements.length > 1) {
          next = Math.max(2, next);
        }
      } else if (editing.key === "target" || editing.key === "defaultTarget") {
        next = safeTarget(target.condition, raw, current);
      } else {
        next = current;
      }
    }
    if (next !== current) {
      target.object[target.key] = next;
      if (ui.route.staged) {
        // Staged edits stay in memory and never schedule a save.
      } else if (ui.route.kind === "block" || ui.route.kind === "blockMovement") {
        markEdited(findSession(ui.route.sessionId));
      } else {
        markEdited(null);
      }
    }
    if (immediate) render(false);
    else setTimeout(function () { if (!ui.editingNumber) render(false); }, 0);
  }

  /* ------------------------------------------------------------------ rendering */
  function render(animate) {
    if (ui.tab !== "timer") {
      ui.restartArmed = false;
      ui.restartStatus = "";
    }
    appEl.innerHTML = appMarkup();
    ui.mapSig = "";
    if (animate) {
      var root = appEl.firstElementChild;
      if (root) {
        root.classList.add("screen-in");
        root.addEventListener("animationend", function () { root.classList.remove("screen-in"); }, { once: true });
      }
    }
    sync();
    syncIsland(true);
    if (ui.focusName) {
      ui.focusName = false;
      setTimeout(focusNameInput, 0);
    }
    if (ui.focusNumber) {
      ui.focusNumber = false;
      setTimeout(focusNumberInput, 0);
    }
    if (ui.tab === "timer") {
      requestAnimationFrame(scrollBlockStrip);
    }
  }

  function appMarkup() {
    var sessionsView = ui.tab === "sessions";
    var body = sessionsView ? sessionsMarkup() : timerMarkup();
    var phase = sessionsView ? "set" : accentKind();
    return '<div class="app-screen' + (sessionsView ? " sessions-screen" : " timer-screen") + '" data-phase="' + phase + '">' +
      body +
      tabbarMarkup() +
    '</div>';
  }

  function timerMarkup() {
    var session = activeSession();
    var group = groupOf();
    var isRest = group === "rest";
    var isDone = group === "done";
    var p = currentPos();
    if (!session || !p) {
      return '<div class="center-stack"><div class="rt-center"><div class="rt-kicker">NO SESSION</div><div class="rt-sub">Open SESSIONS to build a plan.</div></div></div>';
    }
    var block = p.block;
    var movement = p.movement;
    var multi = session.blocks.length > 1;
    var movementText = movementName(movement);
    var doneInBlock = clamp(state.doneSets - p.blockStart, 0, blockTotalSets(block));
    var stageHeight = Math.max(320, (screenEl.clientHeight || 852) - 64 - 92);
    var posHtml;

    // Arming a restart lasts only for the phase it was armed in.
    if (ui.restartStatus !== state.status) {
      ui.restartStatus = state.status;
      ui.restartArmed = false;
    }

    if (isDone) {
      posHtml = '<div class="pos"><span class="pos-done">SESSION COMPLETE</span></div>';
    } else {
      var bits = [];
      if (isRest) bits.push('<span class="pos-up">UP NEXT</span>');
      // The block strip already names the active block in a multi-block
      // session; a single block names itself only when it adds something the
      // movement name does not.
      if (!multi && block.name.trim().toLowerCase() !== movementText.trim().toLowerCase()) {
        bits.push('<span class="pos-block">' + esc(block.name) + '</span>');
        bits.push('<span class="pos-sep"></span>');
      }
      bits.push('<span class="pos-move">' + esc(movementText) + '</span>');
      var posText = positionLabel(block, p);
      if (posText) {
        bits.push('<span class="pos-sep"></span>');
        bits.push('<span>' + posText + '</span>');
      }
      posHtml = '<div class="pos">' + bits.join('') + '</div>';
    }

    // The ring's centre is pinned to half the stage height. The chrome sits
    // above it in the same stage, and the lower content starts one fixed gap
    // below the ring, so neither wrapping copy nor map height can move it.
    return '' +
      '<div class="timer-stage" style="--stage-h:' + stageHeight + 'px">' +
        '<div class="timer-chrome">' +
          '<header class="app-head">' +
            '<div class="brand"><span class="brand-dot"></span><span class="brand-name" data-el="brandName">' +
              esc(session.name) + '</span></div>' +
            '<div class="head-actions">' +
              (isRest || group === "work" ? '' : '<button class="edit-pill chrome-glass" data-act="edit-session">EDIT</button>') +
              restartMarkup() +
            '</div>' +
          '</header>' +
          (multi ? blockStripMarkup(session, p.blockIndex) : '') +
          posHtml +
        '</div>' +
        '<div class="hero">' +
          '<svg class="rt-ring" viewBox="0 0 340 340" aria-hidden="true">' +
            '<circle class="rt-track" cx="170" cy="170" r="160"></circle>' +
            '<circle class="rt-prog" cx="170" cy="170" r="160" data-el="ring"></circle>' +
          '</svg>' +
          '<div class="rt-center">' +
            '<div class="rt-kicker" data-el="kicker"></div>' +
            '<div class="rt-time" data-el="time"></div>' +
            '<div class="rt-sub" data-el="sub"></div>' +
          '</div>' +
        '</div>' +
        '<div class="timer-lower">' +
          mapMarkup(session, block, doneInBlock) +
          watchMarkup(p, group) +
          '<div class="actions">' +
            '<button class="primary" data-act="primary">' +
              '<span class="btn-main" data-el="btnMain"></span>' +
              '<span class="btn-sub" data-el="btnSub"></span>' +
            '</button>' +
            (isRest ? '<button class="icon-btn" data-act="skip" aria-label="Skip rest">' + ICON.skip + '</button>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /// A two-tap restart: the first tap arms, the second applies. Hidden before
  /// the first set and in done, where START AGAIN is the primary action.
  function restartMarkup() {
    if (state.doneSets <= 0 || state.status === "done" || state.status === "notStarted") return "";
    if (ui.restartArmed) {
      return '<button class="edit-pill restart-pill armed chrome-glass" data-act="restart" ' +
        'aria-label="Tap again to restart session">TAP AGAIN</button>';
    }
    return '<button class="edit-pill restart-pill chrome-glass" data-act="restart" ' +
      'aria-label="Restart session">' + ICON.restart + '</button>';
  }

  function blockStripMarkup(session, activeIndex) {
    var out = '<div class="block-strip" data-el="blockStrip">';
    var offset = 0;
    session.blocks.forEach(function (block, index) {
      var total = blockTotalSets(block);
      var complete = state.status === "done" || state.doneSets >= offset + total;
      var active = index === activeIndex;
      out += '<span class="block-chip ' + (complete ? "done" : active ? "on" : "") + '"' +
        ' aria-label="' + esc(block.name) + (complete ? ", complete" : active ? ", active" : "") + '">' +
        (complete ? '<span class="pc-check">✓</span>' : '') +
        '<span>' + esc(block.name) + '</span>' +
      '</span>';
      offset = safeAdd(offset, total);
    });
    return out + '</div>';
  }

  function mapMarkup(session, block, doneInBlock) {
    var total = blockTotalSets(block);
    var perRound = safeMul(Math.max(1, block.movements.length), Math.max(1, block.setsPerRound));
    var inner;
    var dots = MAP_LIMITS.dots;
    if (block.rounds <= MAP_LIMITS.rounds && perRound <= MAP_LIMITS.perRound && total <= dots) {
      var rows = "";
      for (var r = 1; r <= block.rounds; r++) {
        rows += '<div class="map-row" data-r="' + r + '">' +
          '<span class="map-label">R' + r + '</span>' +
          '<span class="map-dots">';
        block.movements.forEach(function (bm, m) {
          if (m > 0) rows += '<span class="map-gap"></span>';
          for (var k = 1; k <= block.setsPerRound; k++) {
            rows += '<i class="map-dot" data-r="' + r + '" data-m="' + m + '" data-k="' + k + '"></i>';
          }
        });
        rows += '</span></div>';
      }
      inner = '<div class="map-grid">' + rows + '</div>';
    } else {
      var pct = total ? (doneInBlock / total) * 100 : 0;
      inner = '<div class="map-bar-wrap">' +
        '<div class="map-bar"><i data-el="mapBar" style="width:' + pct + '%"></i></div>' +
        '<div class="map-bar-label">' + doneInBlock + ' OF ' + total + ' SETS IN THIS BLOCK</div>' +
      '</div>';
    }
    return '<div class="map-wrap">' + inner + '<div class="map-caption" data-el="mapCap"></div></div>';
  }

  function watchMarkup(p, group) {
    if (group !== "ready" || !p.movement || p.movement.endCondition !== "reps") return "";
    var lib = findMovement(p.movement.movementId);
    var target = p.movement.target || 1;
    if (!state.watchReachable) {
      return '<div class="watch-strip off">' +
        '<span class="watch-dot"></span>' +
        '<span class="watch-label">WATCH UNAVAILABLE</span>' +
        '<span class="watch-count">SET DONE STILL WORKS</span>' +
        '<span class="watch-sim"><button data-act="watch-connect">CONNECT</button></span>' +
      '</div>';
    }
    if (!lib || !lib.profile) {
      return '<div class="watch-strip off">' +
        '<span class="watch-dot"></span>' +
        '<span class="watch-label">WATCH UNAVAILABLE</span>' +
        '<span class="watch-count">NO PROFILE · SET DONE STILL WORKS</span>' +
        '<span class="watch-sim"><button data-act="watch-drop">DISCONNECT</button></span>' +
      '</div>';
    }
    return '<div class="watch-strip">' +
      '<span class="watch-dot"></span>' +
      '<span class="watch-label">WATCH ARMED</span>' +
      '<span class="watch-count" data-el="watchCount">' + state.reps + ' OF ' + target + ' REPS</span>' +
      '<span class="watch-sim"><button data-act="watch-rep">+ REP</button><button data-act="watch-drop">DISCONNECT</button></span>' +
    '</div>';
  }

  function tabbarMarkup() {
    return '<nav class="tabbar" aria-label="Main tabs">' +
      '<button class="' + (ui.tab === "timer" ? "on" : "") + '" data-act="tab-timer" aria-label="Timer">' +
        ICON.timer + '<span>TIMER</span></button>' +
      '<button class="' + (ui.tab === "sessions" ? "on" : "") + '" data-act="tab-sessions" aria-label="Sessions">' +
        ICON.sessions + '<span>SESSIONS</span></button>' +
    '</nav>';
  }

  function sessionsMarkup() {
    if (ui.route.kind === "session") return sessionEditorMarkup(ui.route.id);
    if (ui.route.kind === "block") return blockEditorMarkup(ui.route.sessionId, ui.route.blockId, ui.route.staged === true);
    if (ui.route.kind === "blockMovement") return blockMovementMarkup(ui.route.sessionId, ui.route.blockId, ui.route.movementId);
    if (ui.route.kind === "picker") return pickerMarkup(ui.route.sessionId, ui.route.blockId);
    if (ui.route.kind === "library") return libraryMarkup();
    if (ui.route.kind === "movement") return movementDetailMarkup(ui.route.id);
    if (ui.route.kind === "record") return recordMarkup();
    return sessionsListMarkup();
  }

  function sessionsListMarkup() {
    var locked = isLocked();
    var html = '<div class="sessions-scroll">';
    html += '<div class="sessions-head">' +
      '<div><div class="sessions-kicker">WORKOUTS</div><div class="sessions-title">SESSIONS</div></div>' +
      '<button class="add-pill chrome-glass" data-act="add-session" aria-label="Add session"' + (locked ? " disabled" : "") + '>+</button>' +
    '</div>';
    html += lockBannerMarkup(locked);
    sessions.forEach(function (session) {
      var t = sessionTotals(session);
      var active = session.id === activeSessionId;
      html += '<button class="session-card' + (active ? " on" : "") + '" data-act="open-session" data-id="' + esc(session.id) + '">' +
        '<div class="sc-main">' +
          '<div class="sc-name">' + esc(session.name) + '</div>' +
          '<div class="sc-meta">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + ' · ' +
            plural(t.sets, "SET", "SETS") + ' · ' + fmtLong(t.rest) + ' REST</div>' +
        '</div>' +
        '<div class="sc-right">' + (active ? '<span class="active-badge">ACTIVE</span>' : '') +
          '<span class="chev">›</span></div>' +
      '</button>';
    });
    html += '<div class="lib-head"><div class="sessions-kicker">LIBRARY</div>' +
      '<div class="lib-count">' + plural(movements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
    html += '<button class="session-card" data-act="open-library">' +
      '<div class="sc-main"><div class="sc-name">MOVEMENTS</div>' +
        '<div class="sc-meta">Recorded on the watch · reusable in any block</div></div>' +
      '<div class="sc-right"><span class="chev">›</span></div>' +
    '</button>';
    html += '<div class="sessions-foot">Each round runs every movement in order for its sets-per-round sets. A set rest follows each set; a round rest follows each round.</div>';
    return html + '</div>';
  }

  function sessionEditorMarkup(sessionId) {
    var session = findSession(sessionId);
    if (!session) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var total = sessionTotals(session);
    var isActive = session.id === activeSessionId;
    var isDraft = ui.route.draft === true;
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-list">‹ SESSIONS</button>' +
      '<button class="sheet-done" data-act="done-session">DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">SESSION</div>';
    html += '<input class="preset-name" data-el="sessionName" value="' + esc(session.name) +
      '" maxlength="18" spellcheck="false" autocomplete="off" aria-label="Session name"' + (locked ? " disabled" : "") + '>';
    html += '<div class="sheet-note">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + ' · ' +
      plural(total.sets, "SET", "SETS") + ' · ' + fmtLong(total.rest) + ' TOTAL REST</div>';
    if (isActive && state.doneSets > 0 && !locked) {
      html += '<div class="sheet-warn">EDITING THIS SESSION RESTARTS IT.</div>';
    }
    html += lockBannerMarkup(locked);
    html += '<div class="section-head"><div class="section-k">BLOCKS</div>' +
      '<div class="section-count">' + plural(session.blocks.length, "BLOCK", "BLOCKS") + '</div></div>';
    session.blocks.forEach(function (block, index) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "block" && ui.deleteArmed.id === block.id;
      html += '<div class="block-row" data-drag-row="block" data-id="' + esc(block.id) + '">' +
        '<button class="block-open" data-act="open-block" data-id="' + esc(block.id) + '">' +
          '<span class="br-index">' + pad2(index + 1) + '</span>' +
          '<span class="br-main"><span class="br-name">' + esc(block.name) + '</span>' +
            '<span class="br-meta' + (armed ? " danger" : "") + '">' +
              (armed ? "TAP AGAIN TO DELETE" : blockMeta(block)) + '</span></span>' +
          '<span class="br-chev">›</span>' +
        '</button>' +
        '<div class="row-actions">' +
          '<span class="row-grip" draggable="' + (locked ? "false" : "true") + '" data-drag-handle="block" data-id="' +
            esc(block.id) + '" role="button" aria-label="Reorder block">' + ICON.grip + '</span>' +
          (session.blocks.length > 1
            ? '<button class="row-trash' + (armed ? " armed" : "") + '" data-act="delete-block-row" data-id="' +
                esc(block.id) + '" aria-label="Delete block"' + (locked ? " disabled" : "") + '>' + ICON.trash + '</button>'
            : '') +
        '</div>' +
      '</div>';
    });
    html += '<button class="add-block" data-act="add-block"' + (locked || !movements.length ? " disabled" : "") + '>+ ADD BLOCK</button>';
    html += '<div class="editor-foot">';
    if (isDraft) {
      html += '<button class="use-btn" data-act="use-session"' +
        (locked ? " disabled" : "") + '>USE THIS SESSION</button>';
    } else if (isActive) {
      if (state.doneSets > 0) {
        html += '<button class="use-btn" data-act="restart-session"' + (locked ? " disabled" : "") + '>RESTART SESSION</button>';
      } else {
        html += '<div class="active-state">ACTIVE SESSION</div>';
      }
    } else {
      html += '<button class="use-btn" data-act="use-session" data-id="' + esc(session.id) + '"' +
        (locked ? " disabled" : "") + '>USE THIS SESSION</button>';
    }
    if (!isDraft && sessions.length > 1) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "session" && ui.deleteArmed.id === session.id;
      html += '<button class="danger-link' + (armed ? " armed" : "") + '" data-act="delete-session" data-id="' +
        esc(session.id) + '"' + (locked ? " disabled" : "") + '>' +
        (armed ? "TAP AGAIN TO DELETE" : "DELETE SESSION") + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function blockMeta(block) {
    return blockNumbers(block) + ' · SET ' + fmt(block.setRest) + ' · ROUND ' + fmt(block.roundRest);
  }
  function blockSummary(block) {
    return blockNumbers(block) + ' · ' + fmtLong(blockRest(block, false)) + ' REST';
  }

  function blockEditorMarkup(sessionId, blockId, staged) {
    var session = findSession(sessionId);
    var block = staged ? routeBlock({ sessionId: sessionId, blockId: blockId, staged: true }) : findBlock(session, blockId);
    if (!session || !block) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-session">‹ SESSION</button>' +
      '<button class="sheet-done" data-act="done-block"' +
        (staged && !block.movements.length ? " disabled" : "") + '>DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">BLOCK</div>';
    html += '<input class="preset-name" data-el="blockName" value="' + esc(block.name) +
      '" maxlength="18" spellcheck="false" autocomplete="off" aria-label="Block name"' + (locked ? " disabled" : "") + '>';
    html += '<div class="sheet-note">' + blockSummary(block) + '</div>';
    html += lockBannerMarkup(locked);
    html += '<div class="rows">' +
      blockRow(block, "rounds", "ROUNDS", true, locked) +
      blockRow(block, "setsPerRound", "SETS PER ROUND", true, locked) +
      blockRow(block, "setRest", "SET REST", false, locked) +
      blockRow(block, "roundRest", "ROUND REST", false, locked) +
    '</div>';
    html += '<div class="section-head"><div class="section-k">MOVEMENTS</div><div class="section-count">' +
      plural(block.movements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
    block.movements.forEach(function (bm, index) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "blockMovement" && ui.deleteArmed.id === bm.id;
      html += '<div class="block-row" data-drag-row="movement" data-id="' + esc(bm.id) + '">' +
        '<button class="block-open" data-act="open-block-movement" data-id="' + esc(bm.id) + '">' +
          '<span class="br-index">' + pad2(index + 1) + '</span>' +
          '<span class="br-main"><span class="br-name">' + esc(movementName(bm)) + '</span>' +
            '<span class="br-meta' + (armed ? " danger" : "") + '">' +
              (armed ? "TAP AGAIN TO DELETE" : esc(movementGroup(bm)) + ' · ' + movementConditionLabel(bm)) + '</span></span>' +
          '<span class="br-chev">›</span>' +
        '</button>' +
        '<div class="row-actions">' +
          '<span class="row-grip" draggable="' + (locked ? "false" : "true") + '" data-drag-handle="movement" data-id="' +
            esc(bm.id) + '" role="button" aria-label="Reorder movement">' + ICON.grip + '</span>' +
          (block.movements.length > 1
            ? '<button class="row-trash' + (armed ? " armed" : "") + '" data-act="delete-block-movement-row" data-id="' +
                esc(bm.id) + '" aria-label="Delete movement"' + (locked ? " disabled" : "") + '>' + ICON.trash + '</button>'
            : '') +
        '</div>' +
      '</div>';
    });
    var usedMovements = {};
    block.movements.forEach(function (bm) { usedMovements[bm.movementId] = true; });
    var unusedMovements = movements.filter(function (m) { return !usedMovements[m.id]; });
    if (!locked && unusedMovements.length) {
      html += '<div class="section-head"><div class="section-k">ADD FROM LIBRARY</div>' +
        '<div class="section-count">' + plural(unusedMovements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
      unusedMovements.forEach(function (m) {
        html += '<button class="lib-row" data-act="add-from-library" data-id="' + esc(m.id) + '">' +
          '<div class="sc-main"><div class="sc-name">' + esc(m.name) + '</div>' +
            '<div class="sc-meta">' + (m.profile ? "PROFILE" : "NO PROFILE") + ' · MANUAL</div></div>' +
          '<span class="chev">+</span></button>';
      });
    }
    html += '<button class="add-block" data-act="open-picker"' + (locked || !movements.length ? " disabled" : "") + '>+ ADD MOVEMENT</button>';
    html += '<div class="editor-foot">';
    if (!staged && session.blocks.length > 1) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "block" && ui.deleteArmed.id === block.id;
      html += '<button class="danger-link' + (armed ? " armed" : "") + '" data-act="delete-block" data-id="' +
        esc(block.id) + '"' + (locked ? " disabled" : "") + '>' +
        (armed ? "TAP AGAIN TO DELETE" : "DELETE BLOCK") + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function blockRow(block, key, label, typed, locked) {
    var isEditing = typed && ui.editingNumber && ui.editingNumber.scope === "block" && ui.editingNumber.key === key;
    var valueText = typed ? String(block[key]) : fmt(block[key]);
    var valueHtml;
    if (isEditing) {
      valueHtml = '<input class="num-input" data-el="numberInput" type="text" inputmode="numeric" value="' +
        esc(ui.numberDraft) + '" aria-label="' + label + '">';
    } else if (typed) {
      valueHtml = '<button class="sv sv-btn" data-act="edit-number" data-key="' + key +
        '" aria-label="Edit ' + label + '"' + (locked ? " disabled" : "") + '>' + valueText + '</button>';
    } else {
      valueHtml = '<span class="sv">' + valueText + '</span>';
    }
    var min = key === "setRest" ? 0 : key === "rounds" ? blockMin(block, key) : LIMITS[key] ? LIMITS[key][0] : 1;
    var max = key === "setRest" ? 600 : key === "roundRest" ? 600 : Number.MAX_SAFE_INTEGER;
    var canDec = block[key] > min;
    var canInc = block[key] < max;
    return '<div class="srow">' +
      '<span class="sk">' + label + '</span>' +
      valueHtml +
      '<div class="sstep">' +
        '<button data-act="bump-block" data-key="' + key + '" data-dir="-1" aria-label="Decrease ' + label + '"' +
          (locked || !canDec ? " disabled" : "") + '>−</button>' +
        '<button data-act="bump-block" data-key="' + key + '" data-dir="1" aria-label="Increase ' + label + '"' +
          (locked || !canInc ? " disabled" : "") + '>+</button>' +
      '</div>' +
    '</div>';
  }

  function blockMovementMarkup(sessionId, blockId, movementId) {
    var session = findSession(sessionId);
    var block = routeBlock(ui.route);
    var bm = findBlockMovement(block, movementId);
    if (!session || !block || !bm) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var lib = findMovement(bm.movementId);
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-block">‹ BLOCK</button>' +
      '<button class="sheet-done" data-act="done-block-movement">DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">MOVEMENT</div>';
    html += '<div class="detail-name">' + esc(movementName(bm)) + '</div>';
    html += '<div class="sheet-note">' + plural(block.rounds, "ROUND", "ROUNDS") + ' · ' +
      plural(block.setsPerRound, "SET", "SETS") + ' EACH</div>';
    html += lockBannerMarkup(locked);
    html += '<div class="section-head"><div class="section-k">END CONDITION</div></div>';
    html += segMarkup([
      { value: "manual", label: "MANUAL" },
      { value: "time", label: "TIME" },
      { value: "reps", label: "REPS" }
    ], bm.endCondition, "bm-condition", locked);
    if (bm.endCondition === "manual") {
      html += '<div class="sheet-note">NO TARGET · TAP SET DONE WHEN THE SET ENDS.</div>';
    } else {
      html += '<div class="rows">' + targetRow("blockMovement", bm.target, bm.endCondition, "TARGET", locked) + '</div>';
    }
    if (lib && bm.endCondition === "reps" && !lib.profile) {
      html += '<div class="danger-note">NO PROFILE · RE-RECORD THIS MOVEMENT BEFORE THE WATCH CAN COUNT.</div>';
    }
    html += '<div class="editor-foot">';
    if (block.movements.length > 1) {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "blockMovement" && ui.deleteArmed.id === bm.id;
      html += '<button class="danger-link' + (armed ? " armed" : "") + '" data-act="delete-block-movement" data-id="' +
        esc(bm.id) + '"' + (locked ? " disabled" : "") + '>' +
        (armed ? "TAP AGAIN TO DELETE" : "REMOVE FROM BLOCK") + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function targetRow(scope, value, condition, label, locked) {
    var isEditing = ui.editingNumber && ui.editingNumber.scope === scope && ui.editingNumber.key === "target";
    var text = condition === "time" ? fmt(value) : String(value == null ? "—" : value);
    var valueHtml;
    if (isEditing) {
      valueHtml = '<input class="num-input" data-el="numberInput" type="text" inputmode="numeric" value="' +
        esc(ui.numberDraft) + '" aria-label="' + label + '">';
    } else {
      valueHtml = '<button class="sv sv-btn" data-act="edit-number" data-key="target"' +
        ' aria-label="Edit ' + label + '"' + (locked ? " disabled" : "") + '>' + text + '</button>';
    }
    var step = condition === "time" ? 15 : 1;
    var min = condition === "time" ? LIMITS.time[0] : 1;
    var max = condition === "time" ? LIMITS.time[1] : Number.MAX_SAFE_INTEGER;
    var act = scope === "blockMovement" ? "bump-bm-target" : "bump-movement-target";
    return '<div class="srow">' +
      '<span class="sk">' + label + '</span>' +
      valueHtml +
      '<div class="sstep">' +
        '<button data-act="' + act + '" data-dir="-1" aria-label="Decrease ' + label + '"' +
          (locked || value <= min ? " disabled" : "") + '>−</button>' +
        '<button data-act="' + act + '" data-dir="1" aria-label="Increase ' + label + '"' +
          (locked || value >= max ? " disabled" : "") + '>+</button>' +
      '</div>' +
    '</div>';
  }

  function pickerMarkup(sessionId, blockId) {
    var session = findSession(sessionId);
    var block = routeBlock(ui.route);
    if (!session || !block) {
      ui.route = { kind: "list" };
      return sessionsListMarkup();
    }
    var locked = isLocked();
    var pick = ui.picker || pickerDefault();
    var pending = pick.pending || [];
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="cancel-picker">‹ BLOCK</button>' +
      '<button class="sheet-done" data-act="done-picker"' +
        (locked ? " disabled" : "") + '>DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">ADD MOVEMENT</div>';
    html += '<div class="sessions-title">SET END</div>';
    html += '<div class="sheet-note">Choose how the set ends, then queue a recorded movement or name a new one.</div>';
    html += lockBannerMarkup(locked);
    html += segMarkup([
      { value: "manual", label: "MANUAL" },
      { value: "time", label: "TIME" },
      { value: "reps", label: "REPS" }
    ], pick.condition, "picker-condition", locked);
    if (pick.condition === "manual") {
      html += '<div class="sheet-note">NO TARGET · TAP SET DONE WHEN THE SET ENDS.</div>';
    } else {
      html += '<div class="rows">' + pickerTargetRow(pick, locked) + '</div>';
    }
    var newName = pick.name || "";
    html += '<div class="section-k">NEW MOVEMENT</div>';
    html += '<input class="preset-name new-movement-name" data-el="pickerName" value="' + esc(newName) +
      '" maxlength="18" spellcheck="false" autocomplete="off" aria-label="New movement name"' +
      (locked ? " disabled" : "") + '>';
    if (pick.condition === "reps") {
      html += '<div class="sheet-note">NO PROFILE · THE WATCH CANNOT COUNT IT UNTIL IT IS RECORDED.</div>';
    }
    html += '<button class="use-btn new-movement-add" data-act="add-new-movement"' +
      (locked || !newName.trim() ? " disabled" : "") + '>ADD MOVEMENT</button>';
    html += '<div class="section-head"><div class="section-k">TO ADD</div><div class="section-count">' +
      plural(pending.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
    if (!pending.length) {
      html += '<div class="empty-note">Nothing queued yet. Add a movement or tap one below.</div>';
    } else {
      pending.forEach(function (entry) {
        html += '<div class="lib-row on">' +
          '<div class="sc-main"><div class="sc-name">' + esc(pickerEntryName(entry)) + '</div>' +
            '<div class="sc-meta">' + esc(conditionTargetLabel(entry.condition, entry.target)) + '</div></div>' +
          '<button class="row-trash" data-act="remove-pending" data-id="' + esc(entry.id) +
            '" aria-label="Remove ' + esc(pickerEntryName(entry)) + '"' + (locked ? " disabled" : "") + '>' +
            ICON.trash + '</button>' +
        '</div>';
      });
    }
    html += '<div class="section-head"><div class="section-k">MOVEMENT</div>' +
      '<div class="section-count">' + plural(movements.length, "MOVEMENT", "MOVEMENTS") + '</div></div>';
    html += '<div class="sheet-note">' + plural(movements.length, "MOVEMENT", "MOVEMENTS") +
      ' in the library · tap one to queue or unqueue it.</div>';
    if (!movements.length) {
      html += '<div class="empty-note">No movements yet. Record one first.</div>';
    } else {
      movements.forEach(function (m) {
        var queued = pending.some(function (entry) { return entry.movementId === m.id; });
        html += '<button class="lib-row' + (queued ? " on" : "") + '" data-act="toggle-block-movement" data-id="' + esc(m.id) + '"' +
          (locked ? " disabled" : "") + '>' +
          '<div class="sc-main"><div class="sc-name">' + esc(m.name) + '</div>' +
            '<div class="sc-meta">' + (m.profile ? "PROFILE" : "NO PROFILE") + '</div></div>' +
          '<span class="chev">' + (queued ? "✓" : "+") + '</span></button>';
      });
    }
    html += '</div>';
    return html;
  }

  function pickerTargetRow(pick, locked) {
    var min = pick.condition === "time" ? LIMITS.time[0] : 1;
    var max = pick.condition === "time" ? LIMITS.time[1] : Number.MAX_SAFE_INTEGER;
    var text = pick.condition === "time" ? fmt(pick.target) : String(pick.target);
    return '<div class="srow">' +
      '<span class="sk">TARGET</span>' +
      '<span class="sv">' + text + '</span>' +
      '<div class="sstep">' +
        '<button data-act="picker-target" data-dir="-1" aria-label="Decrease target"' +
          (locked || pick.target <= min ? " disabled" : "") + '>−</button>' +
        '<button data-act="picker-target" data-dir="1" aria-label="Increase target"' +
          (locked || pick.target >= max ? " disabled" : "") + '>+</button>' +
      '</div></div>';
  }

  function libraryMarkup() {
    var locked = isLocked();
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-list">‹ SESSIONS</button>' +
      '<button class="sheet-done" data-act="record-new"' + (locked ? " disabled" : "") + '>+</button>' +
    '</div>';
    html += '<div class="editor-kicker">LIBRARY</div>';
    html += '<div class="sessions-title">MOVEMENTS</div>';
    html += '<div class="sheet-note">' + plural(movements.length, "MOVEMENT", "MOVEMENTS") + ' · recorded on the watch</div>';
    html += lockBannerMarkup(locked);
    if (!movements.length) {
      html += '<div class="empty-note">No movements yet. Record a movement on the watch to create one.</div>';
    } else {
      movements.forEach(function (m) {
        html += '<button class="lib-row" data-act="open-movement" data-id="' + esc(m.id) + '">' +
          '<div class="sc-main"><div class="sc-name">' + esc(m.name) + '</div>' +
            '<div class="sc-meta">' + (m.profile ? "PROFILE" : "NO PROFILE") + '</div></div>' +
          '<span class="chev">›</span></button>';
      });
    }
    html += '<button class="record-row" data-act="record-new"' + (locked ? " disabled" : "") + '>+ RECORD MOVEMENT</button>';
    html += '</div>';
    return html;
  }

  function movementDetailMarkup(movementId) {
    var m = findMovement(movementId);
    if (!m) {
      ui.route = { kind: "library" };
      return libraryMarkup();
    }
    var locked = isLocked();
    var used = movementUsage(m.id);
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="back-library">‹ LIBRARY</button>' +
      '<button class="sheet-done" data-act="done-movement">DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">MOVEMENT</div>';
    html += '<input class="preset-name" data-el="movementName" value="' + esc(m.name) +
      '" maxlength="18" spellcheck="false" autocomplete="off" aria-label="Movement name"' + (locked ? " disabled" : "") + '>';
    html += '<div class="sheet-note">' + (used.length ? "USED IN " + esc(used.join(" · ")) : "NOT IN A SESSION") + '</div>';
    html += lockBannerMarkup(locked);
    html += '<div class="section-k">PROFILE</div>';
    html += '<div class="sheet-note">' + profileText(m.profile) + '</div>';
    if (!m.profile) {
      html += '<div class="danger-note">NO PROFILE · RE-RECORD THIS MOVEMENT BEFORE THE WATCH CAN COUNT.</div>';
    }
    html += '<div class="editor-foot">';
    html += '<button class="use-btn" data-act="re-record"' + (locked ? " disabled" : "") + '>RE-RECORD ON WATCH</button>';
    if (used.length) {
      html += '<button class="danger-link" disabled>DELETE MOVEMENT</button>' +
        '<div class="danger-note">USED BY ' + esc(used.join(" · ").toUpperCase()) + ' · REMOVE IT FROM THE PLAN FIRST.</div>';
    } else {
      var armed = ui.deleteArmed && ui.deleteArmed.kind === "libraryMovement" && ui.deleteArmed.id === m.id;
      html += '<button class="danger-link' + (armed ? " armed" : "") + '" data-act="delete-movement"' +
        (locked ? " disabled" : "") + '>' + (armed ? "TAP AGAIN TO DELETE" : "DELETE MOVEMENT") + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function recordMarkup() {
    if (!ui.record) {
      ui.route = { kind: "library" };
      return libraryMarkup();
    }
    var locked = isLocked();
    var record = ui.record;
    var editing = !!record.movementId;
    var html = '<div class="sessions-scroll">';
    html += '<div class="editor-head">' +
      '<button class="back-pill" data-act="record-back">‹ ' + (editing ? "MOVEMENT" : "LIBRARY") + '</button>' +
      '<button class="sheet-done" data-act="record-back">DONE</button>' +
    '</div>';
    html += '<div class="editor-kicker">RECORD</div>';
    html += '<div class="sessions-title">' + (editing ? "RE-RECORD" : "NEW MOVEMENT") + '</div>';
    html += lockBannerMarkup(locked);

    if (record.step === "idle") {
      html += '<div class="sheet-note">The watch records 15 seconds of your movement in the background. You can put your wrist down.</div>';
      html += watchRecordStrip();
      html += '<div class="editor-foot">' +
        '<button class="use-btn" data-act="start-recording"' + (locked || !state.watchReachable ? " disabled" : "") + '>START RECORDING</button>' +
      '</div>';
    } else if (record.step === "waiting") {
      html += '<div class="record-box">' +
        '<div class="record-state"><span class="watch-dot"></span>WAITING FOR THE TRACE</div>' +
        '<div class="sheet-note">Keep the watch on your wrist. It records 15 seconds in the background and sends the trace automatically.</div>' +
        '<div class="sheet-note">After the window, the watch fetches the motion; this can take a few seconds.</div>' +
        '<div class="sim-row">' +
          '<button class="mini-btn primary" data-act="simulate-trace">GOOD TRACE</button>' +
          '<button class="mini-btn" data-act="simulate-short">2 REPS</button>' +
          '<button class="mini-btn" data-act="simulate-timeout">TIMEOUT</button>' +
          '<button class="mini-btn" data-act="simulate-nomotion">NO MOTION</button>' +
        '</div>' +
      '</div>';
      html += '<div class="editor-foot"><button class="danger-link" data-act="record-back">CANCEL</button></div>';
    } else if (record.step === "received") {
      html += '<div class="record-box">' +
        '<div class="record-state"><span class="watch-dot"></span>TRACE RECEIVED</div>' +
        traceSVG(5) +
        '<div class="profile-grid">' +
          '<div class="profile-cell"><div class="profile-k">SIGNAL</div><div class="profile-v">FOREARM</div></div>' +
          '<div class="profile-cell"><div class="profile-k">MIN PERIOD</div><div class="profile-v">' + record.profile.minPeriod.toFixed(2) + ' s</div></div>' +
          '<div class="profile-cell"><div class="profile-k">RISE</div><div class="profile-v">' + Math.round(record.profile.rise) + '°</div></div>' +
          '<div class="profile-cell"><div class="profile-k">FALL</div><div class="profile-v">' + Math.round(record.profile.fall) + '°</div></div>' +
        '</div>' +
        '<div class="sheet-note">PROFILE OK · THREE OR MORE STEADY CYCLES.</div>' +
      '</div>';
      html += '<div class="section-k">NAME</div>';
      html += '<input class="preset-name" data-el="recordName" value="' + esc(record.draft.name) +
        '" maxlength="18" spellcheck="false" autocomplete="off" aria-label="Movement name"' + (locked ? " disabled" : "") + '>';
      html += '<div class="editor-foot">' +
        '<button class="use-btn" data-act="save-record"' + (locked ? " disabled" : "") + '>SAVE MOVEMENT</button>' +
        '<button class="danger-link" data-act="discard-record">DISCARD</button>' +
      '</div>';
    } else {
      html += '<div class="record-box">' +
        '<div class="record-state bad"><span class="watch-dot"></span>RECORDING FAILED</div>' +
        '<div class="sheet-note">' + esc(record.reason || "NO TRACE ARRIVED") + '</div>' +
      '</div>';
      html += '<div class="editor-foot">' +
        '<button class="use-btn" data-act="retry-record">TRY AGAIN</button>' +
        '<button class="danger-link" data-act="record-back">CANCEL</button>' +
      '</div>';
    }

    html += '</div>';
    return html;
  }

  function watchRecordStrip() {
    if (state.watchReachable) {
      return '<div class="watch-strip"><span class="watch-dot"></span>' +
        '<span class="watch-label">WATCH READY</span>' +
        '<span class="watch-count">OPEN THE WATCH APP</span>' +
        '<span class="watch-sim"><button data-act="watch-drop">DISCONNECT</button></span></div>';
    }
    return '<div class="watch-strip off"><span class="watch-dot"></span>' +
      '<span class="watch-label">WATCH UNAVAILABLE</span>' +
      '<span class="watch-count">OPEN RESTLESS ON THE WATCH</span>' +
      '<span class="watch-sim"><button data-act="watch-connect">CONNECT</button></span></div>';
  }
  function traceSVG(cycles) {
    var points = [];
    for (var i = 0; i <= 120; i++) {
      var x = (i / 120) * 300;
      var y = 40 - Math.sin((i / 120) * Math.PI * 2 * cycles) * 26;
      points.push(x.toFixed(1) + "," + y.toFixed(1));
    }
    return '<svg class="trace-svg" viewBox="0 0 300 80" aria-hidden="true">' +
      '<line class="trace-grid" x1="0" y1="40" x2="300" y2="40"></line>' +
      '<polyline class="trace-line" points="' + points.join(" ") + '"></polyline>' +
    '</svg>';
  }
  function recordTargetRow(draft, locked) {
    var text = draft.condition === "time" ? fmt(draft.target) : String(draft.target == null ? "—" : draft.target);
    var step = draft.condition === "time" ? 15 : 1;
    var min = draft.condition === "time" ? LIMITS.time[0] : 1;
    var max = draft.condition === "time" ? LIMITS.time[1] : Number.MAX_SAFE_INTEGER;
    return '<div class="srow">' +
      '<span class="sk">TARGET</span>' +
      '<span class="sv">' + text + '</span>' +
      '<div class="sstep">' +
        '<button data-act="record-target" data-dir="-1" aria-label="Decrease target"' +
          (locked || draft.target <= min ? " disabled" : "") + '>−</button>' +
        '<button data-act="record-target" data-dir="1" aria-label="Increase target"' +
          (locked || draft.target >= max ? " disabled" : "") + '>+</button>' +
      '</div>' +
    '</div>';
  }

  function groupChips(selected, action, locked) {
    var options = GROUPS.slice();
    if (selected && options.indexOf(selected) < 0) options.push(selected);
    var html = '<div class="chip-row">';
    options.forEach(function (group) {
      html += '<button class="chip' + (group === selected ? " on" : "") + '" data-act="' + action +
        '" data-group="' + esc(group) + '"' + (locked ? " disabled" : "") + '>' + esc(group.toUpperCase()) + '</button>';
    });
    return html + '</div>';
  }
  function segMarkup(options, selected, action, locked) {
    var html = '<div class="seg">';
    options.forEach(function (option) {
      html += '<button class="' + (option.value === selected ? "on" : "") + '" data-act="' + action +
        '" data-value="' + option.value + '"' + (locked ? " disabled" : "") + '>' + option.label + '</button>';
    });
    return html + '</div>';
  }
  function lockBannerMarkup(locked) {
    return locked
      ? '<div class="lock-banner">EDITING LOCKED DURING A SET OR REST · SWITCH TO TIMER TO SET DONE OR PAUSE</div>'
      : '';
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(s) { var v = Math.max(0, Math.ceil(s)); return Math.floor(v / 60) + ":" + pad(v % 60); }
  function fmtLong(s) {
    var v = Math.max(0, Math.round(s));
    var h = Math.floor(v / 3600);
    var m = Math.floor((v % 3600) / 60);
    var sec = v % 60;
    return h ? (h + ":" + pad(m) + ":" + pad(sec)) : (m + ":" + pad(sec));
  }

  function focusNameInput() {
    var input = $('[data-el="sessionName"], [data-el="blockName"], [data-el="movementName"], [data-el="recordName"]', appEl);
    if (input) { input.focus(); input.select(); }
  }
  function focusNumberInput() {
    var input = $('[data-el="numberInput"]', appEl);
    if (input) { input.focus(); input.select(); }
  }
  function scrollBlockStrip() {
    var strip = $('[data-el="blockStrip"]', appEl);
    if (!strip) return;
    var chip = $(".block-chip.on", strip);
    if (!chip) return;
    strip.scrollLeft = Math.max(0, chip.offsetLeft - (strip.clientWidth - chip.offsetWidth) / 2);
  }

  /* ------------------------------------------------------------------ sync */
  function setText(el, text) {
    if (!el) return;
    if (textCache.get(el) !== text) {
      textCache.set(el, text);
      el.textContent = text;
    }
  }

  function sync() {
    var group = groupOf();
    var session = activeSession();
    var p = currentPos();
    var accent = accentKind();
    var wrap = $(".app-screen", appEl);
    if (wrap && ui.tab === "timer" && wrap.getAttribute("data-phase") !== accent) {
      wrap.setAttribute("data-phase", accent);
    }

    if (ui.tab === "timer" && p) {
      var kicker, timeText, sub, progress = 0, small = false;
      var total = sessionTotals(session).sets;

      if (group === "gate") {
        kicker = "READY";
        timeText = "START";
        sub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " +
          plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
        small = true;
      } else if (group === "ready") {
        var rest = upcomingRest();
        if (rest) {
          if (rest.dur <= 0) {
            kicker = "NO REST";
            timeText = "NEXT";
            sub = "AFTER THIS SET";
            small = true;
          } else {
            kicker = restKindLabel(rest.kind);
            timeText = fmt(rest.dur);
            sub = "AFTER THIS SET";
          }
        } else {
          kicker = "LAST SET";
          timeText = "FINISH";
          sub = "NO REST AFTER";
          small = true;
        }
      } else if (group === "work") {
        kicker = "WORK";
        timeText = fmt(remainingSetNow());
        var workRest = upcomingRest();
        sub = workRest ? (workRest.dur > 0 ? "REST " + fmt(workRest.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
        progress = setProgress();
      } else if (group === "rest") {
        kicker = state.status === "paused" ? "PAUSED" : restKindLabel(state.restKind);
        timeText = fmt(remainingNow());
        sub = state.rest ? state.rest.label : "";
        progress = restProgress();
      } else {
        kicker = state.doneSets + " OF " + plural(total, "SET", "SETS");
        timeText = "DONE";
        sub = plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " +
          plural(sessionTotals(session).movements, "MOVEMENT", "MOVEMENTS") + " · " +
          fmtLong(sessionTotals(session).rest) + " TOTAL REST";
        progress = 1;
        small = true;
      }

      setText($("[data-el='kicker']", appEl), kicker);
      var timeEl = $("[data-el='time']", appEl);
      setText(timeEl, timeText);
      if (timeEl) timeEl.classList.toggle("small", small);
      setText($("[data-el='sub']", appEl), sub);

      var ring = $("[data-el='ring']", appEl);
      if (ring) ring.style.strokeDashoffset = String(1005.31 * (1 - progress));

      setText($("[data-el='mapCap']", appEl), state.doneSets + " OF " + plural(total, "SET", "SETS"));
      paintMap(p, session);

      var blockStart = p.blockStart;
      var blockTotal = blockTotalSets(p.block);
      var doneInBlock = clamp(state.doneSets - blockStart, 0, blockTotal);
      var mapBar = $("[data-el='mapBar']", appEl);
      if (mapBar) {
        mapBar.style.width = (blockTotal ? (doneInBlock / blockTotal) * 100 : 0) + "%";
        setText($(".map-bar-label", appEl), doneInBlock + " OF " + blockTotal + " SETS IN THIS BLOCK");
      }

      var watchCount = $("[data-el='watchCount']", appEl);
      if (watchCount) {
        var target = p.movement.endCondition === "reps" ? (p.movement.target || 1) : 0;
        setText(watchCount, state.reps + " OF " + target + " REPS");
      }

      var main, btnSub;
      if (group === "gate") {
        main = "START SESSION";
        btnSub = "BLOCK 1 · " + session.blocks[0].name.toUpperCase();
      } else if (group === "ready") {
        if (p.movement.endCondition === "time") {
          main = "START";
          btnSub = fmt(p.movement.target) + " HOLD";
        } else if (p.movement.endCondition === "reps") {
          main = "SET DONE";
          btnSub = watchReady(p) ? state.reps + " OF " + (p.movement.target || 1) + " REPS · WATCH ARMED" : "WATCH UNAVAILABLE · TAP WHEN DONE";
        } else {
          var readyRest = upcomingRest();
          main = "SET DONE";
          btnSub = readyRest ? (readyRest.dur > 0 ? "START " + fmt(readyRest.dur) + " " + (readyRest.kind === "set" ? "SET" : "ROUND") + " REST" : "NEXT SET IMMEDIATELY") : "NO REST AFTER";
        }
      } else if (group === "work") {
        var workRest2 = upcomingRest();
        main = "SET DONE";
        btnSub = workRest2 ? (workRest2.dur > 0 ? "REST " + fmt(workRest2.dur) + " AFTER" : "NEXT SET IMMEDIATELY") : "FINISH AFTER THIS SET";
      } else if (group === "rest") {
        if (state.status === "paused") {
          main = "RESUME";
          btnSub = "TAP TO RESUME";
        } else {
          main = "PAUSE";
          btnSub = restKindLabel(state.restKind);
        }
      } else {
        main = "START AGAIN";
        btnSub = plural(total, "SET", "SETS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      }
      setText($("[data-el='btnMain']", appEl), main);
      setText($("[data-el='btnSub']", appEl), btnSub);
    }

    syncIsland(false);

    var debugSig = group + "|" + state.status + "|" + state.doneSets + "|" + (state.restKind || "") + "|" +
      Math.floor(remainingNow()) + "|" + Math.floor(remainingSetNow()) + "|" + state.reps + "|" + state.watchReachable;
    if (debugSig !== ui.debugSig) {
      ui.debugSig = debugSig;
      var txt;
      if (!p) {
        txt = "NO SESSION";
      } else if (group === "gate") {
        txt = "READY · NOT STARTED · BLOCK 1/" + session.blocks.length + " · " + p.block.name + " · " +
          movementName(p.movement);
      } else if (group === "ready") {
        txt = "READY · BLOCK " + (p.blockIndex + 1) + "/" + session.blocks.length + " · " + p.block.name + " · " +
          movementName(p.movement) + " · " + positionLabel(p.block, p) +
          " · " + (p.movement.endCondition === "reps" ? (watchReady(p) ? "WATCH ARMED " + state.reps + "/" + (p.movement.target || 1) : "WATCH UNAVAILABLE") : movementConditionLabel(p.movement));
      } else if (group === "work") {
        txt = "PERFORMING · WORK " + fmt(remainingSetNow()) + " · " + movementName(p.movement) + " · " +
          positionLabel(p.block, p);
      } else if (group === "rest") {
        txt = state.status.toUpperCase() + " · " + restKindLabel(state.restKind) + " · " + fmt(remainingNow()) +
          " · " + (state.rest ? state.rest.label : "") + " · NEXT " + movementName(p.movement);
      } else {
        txt = "DONE · " + plural(sessionTotals(session).sets, "SET", "SETS") + " · " +
          plural(session.blocks.length, "BLOCK", "BLOCKS") + " · " + fmtLong(sessionTotals(session).rest) + " TOTAL REST";
      }
      var safeText = txt.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      debugEl.innerHTML = safeText.replace(/^(READY|PERFORMING|RESTING|PAUSED|DONE|NO SESSION)/, "<b>$1</b>");
    }
  }

  function paintMap(p, session) {
    var dots = $$(".map-dot", appEl);
    if (!dots.length) return;
    var block = p.block;
    var doneInBlock = clamp(state.doneSets - p.blockStart, 0, blockTotalSets(block));
    var sig = block.id + "|" + state.status + "|" + doneInBlock + "|" + block.rounds + "|" + block.setsPerRound + "|" + block.movements.length;
    if (sig === ui.mapSig) return;
    ui.mapSig = sig;

    var stepsPer = Math.max(1, block.setsPerRound);
    var perRound = safeMul(Math.max(1, block.movements.length), stepsPer);
    dots.forEach(function (dot) {
      var r = Number(dot.getAttribute("data-r"));
      var m = Number(dot.getAttribute("data-m"));
      var k = Number(dot.getAttribute("data-k"));
      var index = (r - 1) * perRound + m * stepsPer + (k - 1);
      dot.classList.toggle("done", index < doneInBlock);
      dot.classList.toggle("current", index === doneInBlock && state.status !== "done");
    });
    $$(".map-row", appEl).forEach(function (row) {
      row.classList.toggle("active", Number(row.getAttribute("data-r")) === p.round && state.status !== "done");
    });
  }

  /* ------------------------------------------------------------------ island */
  function shortMovement(name) {
    var clean = String(name || "MOV").replace(/[^A-Za-z0-9]/g, "");
    return (clean.slice(0, 3).toUpperCase() || "MOV");
  }
  function compactLabel(group, p) {
    if (group === "done") return "DONE";
    return shortMovement(movementName(p.movement));
  }
  function compactTime(group) {
    if (group === "done") return totalSets() + " SETS";
    if (group === "work") return fmt(remainingSetNow());
    if (group === "rest") return fmt(remainingNow());
    return "READY";
  }
  function islandActionsHTML(group, p) {
    if (group === "ready") {
      if (p.movement.endCondition === "time") {
        return '<button class="primary" data-act="primary">Start · ' + fmt(p.movement.target) + '</button>';
      }
      var rest = upcomingRest();
      return '<button class="primary" data-act="primary">' +
        (rest ? (rest.dur > 0 ? "Set done · " + fmt(rest.dur) : "Set done") : "Finish session") +
      '</button>';
    }
    if (group === "work") {
      var workRest = upcomingRest();
      return '<button class="primary" data-act="primary">' +
